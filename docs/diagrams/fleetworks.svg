<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 800" role="img" aria-labelledby="fleetworks-title fleetworks-desc">
<title id="fleetworks-title">Native clients and independent backend ownership</title>
<desc id="fleetworks-desc">The native Mac client and registered Intel Web call the purpose-authenticated gateway. The native client owns only protected local folder identity. Private Brain, Tools, Control and Execution services share domain records and fences in SurrealDB. Workers use authenticated Jobs HTTP for SQLite logs and the RocksDB queue, and publish actor projections to the private Tantivy service. The gateway queries Tantivy for discovery and validates candidates against canonical domain records. An external operator provisions the backend; client launch does not start it.</desc>
<defs><marker id="fleetworks-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4f5d75"/></marker></defs>
<style>text{font-family:Geist,system-ui,sans-serif;fill:#2d3142}.label{font-size:20px;font-weight:600}.note{font-size:16px}.zone{font-size:13px;font-weight:600;letter-spacing:1px}.node{fill:#fff;stroke:#4f5d75}.accent{fill:#fff6ed;stroke:#eb6c36}.edge{fill:none;stroke:#4f5d75;stroke-width:2;marker-end:url(#fleetworks-arrow)}.minor{fill:#4f5d75;font-size:14px}</style>
