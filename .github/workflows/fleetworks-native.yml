name: Build and verify one Fleetworks Mac app

on:
  workflow_call:
    inputs:
      expected-head:
        type: string
        required: true
      release-version:
        description: Empty for PR debug checks; exact artifact version for trusted publication
        type: string
        default: ''
      target:
        type: string
        required: true
      runner:
        type: string
        required: true
    outputs:
      artifact-id:
        value: ${{ jobs.package.outputs.artifact-id }}
      artifact-url:
        value: ${{ jobs.package.outputs.artifact-url }}
      sha256:
        value: ${{ jobs.package.outputs.sha256 }}
      evidence-url:
        value: ${{ jobs.package.outputs.evidence-url }}

# No signing, publication, PR-comment or package-write credentials are available.
# Native build/fixture jobs never install Docker, Node or backend engines.
permissions:
  contents: read
  actions: read

env:
  FLEETWORKS_HEAD: ${{ inputs.expected-head }}
  NATIVE_TARGET: ${{ inputs.target }}
  RELEASE_VERSION: ${{ inputs.release-version }}
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: 1

jobs:
  package:
    name: Native app and real-view fixtures
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
      sha256: ${{ steps.package.outputs.sha256 }}
      rune-revision: ${{ steps.package.outputs.rune-revision }}
      evidence-url: ${{ steps.evidence.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected-head }}
          persist-credentials: false
          lfs: false
      - name: Resolve exact source and repository toolchain
        id: pin
        env:
          SELECTED_RUNNER: ${{ inputs.runner }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FLEETWORKS_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$FLEETWORKS_HEAD"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          pairs = {
              "x86_64-apple-darwin": "macos-15-intel",
              "aarch64-apple-darwin": "macos-15",
          }
          if pairs.get(os.environ["NATIVE_TARGET"]) != os.environ["SELECTED_RUNNER"]:
              raise SystemExit("Selected Mac target/runner pair is unsupported")
          match = re.search(r'^channel\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"', Path("rust-toolchain.toml").read_text(), re.M)
          if not match:
              raise SystemExit("Repository requires an explicit Rust toolchain pin")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("version=" + match[1], file=output)
          PY
      - name: Install the selected repository toolchain
        env:
          TOOLCHAIN: ${{ steps.pin.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt --target "$NATIVE_TARGET"
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$NATIVE_TARGET"
          test "$(rustc -vV | sed -n 's/^release: //p')" = "$TOOLCHAIN"
          xcode-select -p
          xcrun --sdk macosx --show-sdk-path
          clang_dir="$(dirname "$(xcrun --find clang)")/../lib"
          test -f "$clang_dir/libclang.dylib"
          printf 'LIBCLANG_PATH=%s\n' "$clang_dir" >> "$GITHUB_ENV"
          python3 scripts/fleetworks_verify.py platform --format json
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ inputs.target }}-${{ steps.pin.outputs.version }}-${{ hashFiles('Cargo.lock', 'apps/fleetworks-desktop/Cargo.toml', 'services/api-host/Cargo.toml', 'services/search-index/Cargo.toml') }}
          workspaces: . -> target/agents
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Run scoped desktop unit tests
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/fleetworks-native-evidence"
          mkdir -p "$evidence"
          python3 -B -m unittest discover -s .github/scripts -p 'test_ui_visual_review.py'
          python3 scripts/fleetworks_candidate.py verify-engine-free | tee "$evidence/engine-free.json"
          cargo fmt -p fleetworks-desktop -p fleetworks-workstation -p fleetworks-contracts -- --check
          python3 scripts/agent_cargo.py test --locked -p fleetworks-desktop \
            -p fleetworks-workstation -p fleetworks-contracts -- --test-threads=1 \
            | tee "$evidence/unit-tests.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$evidence/unit-tests.log"
      - name: Generate selected actual shared-view fixture evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fleetworks_verify.py native-ui --agent --require-clean \
            --revision "$FLEETWORKS_HEAD" --output "$RUNNER_TEMP/fleetworks-native-evidence/fixtures" \
            --scene redesign-setup --scene workstation-offline --scene atlas-offline --scene brain-search-ready \
            --scene brain-dossier --scene brain-search-indexing --scene brain-search-error \
            --scene tools-offline --scene models-setup --scene profile-setup \
            --scene workspaces-offline --scene jobs-offline \
            --size 1280x800 --size 640x480 --scale 1 --scale 2 \
            --script brain-search-ready=apps/fleetworks-desktop/tests/fixtures/scripts/brain-search-open.json \
            --script-expect-key brain-search-ready=dossier-name
      - name: Capture wide workstation shell and Settings dialog
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fleetworks_verify.py native-ui --agent --require-clean \
            --revision "$FLEETWORKS_HEAD" --output "$RUNNER_TEMP/fleetworks-native-evidence/shell-settings" \
            --scene registration-ready --scene workstation-partial-seed \
            --scene atlas-articles-ready --scene jobs-page-two \
            --size 1440x860 --size 640x480 --scale 1 \
            --script registration-ready=apps/fleetworks-desktop/tests/fixtures/scripts/workstation-settings-open.json \
            --script-expect-key registration-ready=workstation-settings-body
      - name: Capture synthetic local pairing approval screen
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fleetworks_verify.py native-ui --agent --require-clean \
            --revision "$FLEETWORKS_HEAD" --output "$RUNNER_TEMP/fleetworks-native-evidence/pairing-local-review" \
            --scene pairing-waiting --local-review-fixture \
            --size 1440x860 --size 640x480 --scale 1
      - name: Build, archive, extract-verify and smoke-test the debug app for pull-request review
        if: inputs.release-version == ''
        shell: bash
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/fleetworks-native-debug"
          extracted="$RUNNER_TEMP/fleetworks-native-debug-extracted"
          evidence="$RUNNER_TEMP/fleetworks-native-evidence"
          mkdir -p "$evidence"
          python3 scripts/fleetworks_candidate.py build-native --agent \
            --target "$NATIVE_TARGET" --profile debug \
            --output "$dist" \
            --revision "$FLEETWORKS_HEAD" \
            --workflow "${{ github.workflow }}" --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" \
            --archive --require-clean | tee "$evidence/build-$NATIVE_TARGET.out"
          DIST_DIR="$dist" EXTRACT_DIR="$extracted" SIZES_OUT="$evidence/package-sizes-$NATIVE_TARGET.json" python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from fleetworks_candidate import locked_rune_revision, sha256

          dist = Path(os.environ["DIST_DIR"])
          archives = list(dist.glob("Fleetworks-*.zip"))
          if len(archives) != 1:
              raise SystemExit(f"Expected 1 debug macOS archive, found {len(archives)}")
          archive = archives[0]
          manifest = json.loads((dist / "Fleetworks.app.manifest.json").read_text(encoding="utf-8"))
          bundle = dist / "Fleetworks.app"
          exe = bundle / "Contents/MacOS/fleetworks-desktop"
          companion = bundle / "Contents/MacOS/argos-api-host"
          unpacked_bytes = sum(path.stat().st_size for path in bundle.rglob("*") if path.is_file())
          sizes = {
              "target": os.environ["NATIVE_TARGET"],
              "profile": "debug",
              "archive_name": archive.name,
              "archive_bytes": archive.stat().st_size,
              "archive_mib": round(archive.stat().st_size / (1024 * 1024), 2),
              "unpacked_bytes": unpacked_bytes,
              "unpacked_mib": round(unpacked_bytes / (1024 * 1024), 2),
              "executable_bytes": exe.stat().st_size,
              "companion_bytes": companion.stat().st_size if companion.is_file() else None,
          }
          Path(os.environ["SIZES_OUT"]).write_text(json.dumps(sizes, indent=2) + "\n", encoding="utf-8")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  print(
                      f"- `{sizes['target']}` (`debug`): archive `{sizes['archive_name']}` = "
                      f"`{sizes['archive_mib']} MiB` ({sizes['archive_bytes']} B), unpacked = "
                      f"`{sizes['unpacked_mib']} MiB` ({sizes['unpacked_bytes']} B), "
                      f"desktop = `{sizes['executable_bytes']} B`, companion = `{sizes['companion_bytes']} B`",
                      file=handle,
                  )
          subprocess.run([
              sys.executable, "scripts/fleetworks_candidate.py", "verify-native",
              "--archive", str(archive),
              "--sha256", sha256(archive),
              "--revision", os.environ["FLEETWORKS_HEAD"],
              "--target", os.environ["NATIVE_TARGET"],
              "--profile", "debug",
              "--rune-revision", locked_rune_revision(),
              "--version", manifest["version"],
              "--directory", os.environ["EXTRACT_DIR"],
              "--require-clean",
          ], check=True)
          PY
          python3 scripts/fleetworks_local_backend_smoke.py \
            --app "$extracted/Fleetworks.app" \
            --output "$evidence/local-backend-smoke-$NATIVE_TARGET.json"
      - name: Package the trusted versioned release app
        if: inputs.release-version != ''
        id: package
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/fleetworks-native-candidate"
          python3 scripts/fleetworks_candidate.py build-native --agent \
            --target "$NATIVE_TARGET" --profile release --output "$output" --version "$RELEASE_VERSION" \
            --revision "$FLEETWORKS_HEAD" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --archive --require-clean
          CANDIDATE_DIRECTORY="$output" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from fleetworks_candidate import locked_rune_revision, sha256
          directory = Path(os.environ["CANDIDATE_DIRECTORY"])
          archives = list(directory.glob("Fleetworks-*.zip"))
          if len(archives) != 1:
              raise SystemExit("Exactly one versioned app ZIP is required")
          manifest = json.loads((directory / "Fleetworks.app.manifest.json").read_text())
          if (manifest["revision"] != os.environ["FLEETWORKS_HEAD"]
                  or manifest["version"] != os.environ["RELEASE_VERSION"]
                  or manifest["dirty"] is not False):
              raise SystemExit("Candidate source identity differs from the selected exact revision")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("sha256=" + sha256(archives[0]), file=output)
              print("rune-revision=" + locked_rune_revision(), file=output)
          PY
      - name: Upload immutable app ZIP, manifest and checksum
        if: inputs.release-version != ''
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Fleetworks-app-${{ inputs.target }}-${{ inputs.expected-head }}-${{ github.run_id }}.${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fleetworks-native-candidate/Fleetworks-*.zip
            ${{ runner.temp }}/fleetworks-native-candidate/Fleetworks-*.zip.sha256
            ${{ runner.temp }}/fleetworks-native-candidate/Fleetworks.app.manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain real-view evidence and original failures
        id: evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Fleetworks-native-evidence-${{ inputs.target }}-${{ inputs.expected-head }}-${{ github.run_id }}.${{ github.run_attempt }}
          path: ${{ runner.temp }}/fleetworks-native-evidence/
          if-no-files-found: ignore
          retention-days: 14

  verify:
    name: Verify exact downloaded app bytes
    if: inputs.release-version != ''
    needs: package
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected-head }}
          persist-credentials: false
          lfs: false
      - name: Require exact artifact and source identity
        env:
          ARTIFACT_ID: ${{ needs.package.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FLEETWORKS_HEAD"
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: ${{ runner.temp }}/fleetworks-native-download
          digest-mismatch: error
      - name: Verify downloaded ZIP without installing or launching it
        env:
          EXPECTED_SHA256: ${{ needs.package.outputs.sha256 }}
          RUNE_REVISION: ${{ needs.package.outputs.rune-revision }}
        shell: bash
        run: |
          set -euo pipefail
          archives=("$RUNNER_TEMP"/fleetworks-native-download/Fleetworks-*.zip)
          test "${#archives[@]}" = 1
          python3 scripts/fleetworks_candidate.py verify-native --archive "${archives[0]}" \
            --sha256 "$EXPECTED_SHA256" --revision "$FLEETWORKS_HEAD" \
            --target "$NATIVE_TARGET" --profile release --version "$RELEASE_VERSION" --rune-revision "$RUNE_REVISION" \
            --require-clean --directory "$RUNNER_TEMP/fleetworks-native-extracted"
          python3 scripts/fleetworks_local_backend_smoke.py \
            --app "$RUNNER_TEMP/fleetworks-native-extracted/Fleetworks.app"
      - name: Record actual review URLs and verification limits
        env:
          APP_URL: ${{ needs.package.outputs.artifact-url }}
          EVIDENCE_URL: ${{ needs.package.outputs.evidence-url }}
          EXPECTED_SHA256: ${{ needs.package.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APP_URL"
          test -n "$EVIDENCE_URL"
          {
            printf 'Fleetworks `%s` / `%s`\n\n' "$FLEETWORKS_HEAD" "$NATIVE_TARGET"
            printf -- '- [Download exact app artifact](%s); SHA-256 `%s`.\n' "$APP_URL" "$EXPECTED_SHA256"
            printf -- '- [Real-view PNG/tree/test evidence](%s). Actions retention: 14 days.\n' "$EVIDENCE_URL"
            printf -- '- Bundle architecture, libraries, identity and checksums passed on downloaded bytes.\n'
            printf -- '- PNGs generated; human visual inspection and matching-hardware GUI launch remain pending.\n'
            printf -- '- Unsigned app; notarization, minimum-macOS testing and matching-hardware launch remain pending.\n'
          } >> "$GITHUB_STEP_SUMMARY"
