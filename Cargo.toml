[workspace]
resolver = "2"
members = [
    "crates/argos-osint-core",
    "crates/argos-osint-api",
    "services/api-host",
    "services/search-index",
    "crates/fleetworks-contracts",
    "crates/fleetworks-workstation",
    "crates/fleetworks-broker",
    "crates/fleetworks-jobs",
    "apps/fleetworks-desktop",
]

default-members = ["apps/fleetworks-desktop"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.2.1"
authors = ["the Argos OSINT authors"]
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
csv = "1.4"
dirs = "5"
futures-util = "0.3"
regex = "1"
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
rune = { git = "https://github.com/anomalyco/rune", rev = "205b8d4f7e60fa6248b83bfbbb4c6a06096c59ff", default-features = false, features = ["accessibility", "embedded-fonts", "metal-backend", "native-file-dialog", "svg"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "205b8d4f7e60fa6248b83bfbbb4c6a06096c59ff", default-features = false, features = ["markdown"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
strsim = "0.11"
# Remote-only SurrealDB client pinned to server 3.3.4. Loopback WebSocket only:
# no embedded kv engines, no TLS (the server binds 127.0.0.1).
# Engines/protocols come from the crates' `embedded` (RocksDB, default) and
# `server` (WebSocket client) features.
surrealdb = { version = "=3.3.4", default-features = false }
sysinfo = "0.33"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "fs", "sync", "net", "signal", "test-util"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
toml = "0.8"
tract-onnx = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
unicode-normalization = "=0.1.25"
scraper = "0.27"

# Rune's vendor fixes must be selected by the application workspace; patches
# declared by a Git dependency do not propagate. Keep these at the Rune pin.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "205b8d4f7e60fa6248b83bfbbb4c6a06096c59ff" }
winit = { git = "https://github.com/anomalyco/rune", rev = "205b8d4f7e60fa6248b83bfbbb4c6a06096c59ff" }

# The embedded JS engine must meet local interrupt deadlines in debug builds too.
[profile.dev.package.rquickjs-sys]
opt-level = 3

# Rune's full debug information can exceed the native development host's
# memory budget. Preserve backtrace line tables without rebuilding unrelated
# backend dependencies with a different global profile.
[profile.dev.package.rune]
debug = "line-tables-only"

[profile.dev.package.rune-kit]
debug = "line-tables-only"

# RocksDB's C++ (built by cc in librocksdb-sys' build script) is the single
# biggest compile; skip -g for it in dev/test builds (local and CI).
[profile.dev.package.surrealdb-librocksdb-sys]
debug = false

# cargo-mutants configuration for mutation testing
[workspace.metadata.cargo-mutants]
# Only run on the core crate for faster iteration
packages = ["argos-osint-core"]
# Use embedded storage mode for tests
env = { ARGOS_SURREAL_MODE = "embedded", ARGOS_SURREAL_REQUIRED = "1" }
# Timeout per mutant (seconds)
timeout = 120
# Number of jobs (0 = auto)
jobs = 0
# Exclude test files from mutation
exclude = [
    "tests/**",
    "examples/**",
    "benches/**",
]
# Only mutate source files in src/
filter = "crates/argos-osint-core/src/**/*.rs"
