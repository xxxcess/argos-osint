name: Embedded compatibility

# Linux backend compatibility is selected by Fleetworks. Manual dispatch keeps
# the four-platform compatibility diagnostic available without installing
# backend engines in the normal Rune macOS client lanes.
on:
  workflow_call:
    inputs:
      head:
        description: Exact source revision selected by the scope planner
        type: string
        required: true
      arch:
        description: Linux architecture selected by Fleetworks (amd64, arm64 or both)
        type: string
        default: both
      scoped:
        description: Run only first-pass embedded backend checks
        type: boolean
        default: false
  workflow_dispatch:

concurrency:
  group: embedded-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No debuginfo in CI: smaller target dirs, faster codegen, and cc builds librocksdb without -g.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

permissions:
  contents: read

jobs:
  embedded:
    name: ${{ matrix.platform.name }} / embedded
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(github.event_name == 'workflow_dispatch' && inputs.head == '' && '[{"name":"Linux x86_64","os":"ubuntu-24.04"},{"name":"Linux aarch64","os":"ubuntu-24.04-arm"},{"name":"macOS arm64","os":"macos-15"},{"name":"macOS Intel","os":"macos-15-intel"}]' || inputs.arch == 'amd64' && '[{"name":"Linux x86_64","os":"ubuntu-24.04"}]' || inputs.arch == 'arm64' && '[{"name":"Linux aarch64","os":"ubuntu-24.04-arm"}]' || '[{"name":"Linux x86_64","os":"ubuntu-24.04"},{"name":"Linux aarch64","os":"ubuntu-24.04-arm"}]') }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.head || github.sha }}
          lfs: false
          persist-credentials: false
      - name: Verify selected revision
        env:
          EXPECTED_HEAD: ${{ inputs.head || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - uses: rui314/setup-mold@v1
        if: runner.os == 'Linux'
      - uses: Swatinem/rust-cache@v2
        with:
          key: embedded
          workspaces: . -> target/agents
          cache-on-failure: true
      - name: Restrict SQLite to Jobs persistence and forbid LanceDB
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys

          result = subprocess.run(
              ["cargo", "metadata", "--all-features", "--locked", "--format-version", "1"],
              check=True, stdout=subprocess.PIPE,
          )
          metadata = json.loads(result.stdout)
          packages = {package["id"]: package for package in metadata["packages"]}
          jobs_manifest = Path(metadata["workspace_root"]) / "crates/fleetworks-jobs/Cargo.toml"
          errors = []
          for package in packages.values():
              if package["name"] == "lancedb":
                  errors.append("lancedb is forbidden in the dependency graph")
          for node in metadata["resolve"]["nodes"]:
              owner = packages[node["id"]]
              for dependency in node["deps"]:
                  if packages[dependency["pkg"]]["name"] != "rusqlite":
                      continue
                  if Path(owner["manifest_path"]) != jobs_manifest:
                      errors.append(f'{owner["name"]} directly depends on rusqlite; only fleetworks-jobs may do so')
          for error in errors:
              print(f"::error::{error}")
          sys.exit(bool(errors))
          PY
      - name: Install Linux build dependencies (libclang for RocksDB, libxkbcommon for Rune)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev libxkbcommon-dev
      - name: Select Xcode libclang for RocksDB bindgen
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          clang_dir="$(dirname "$(xcrun --find clang)")/../lib"
          test -f "$clang_dir/libclang.dylib"
          printf 'LIBCLANG_PATH=%s\n' "$clang_dir" >> "$GITHUB_ENV"
      - name: Verify affected embedded backend
        if: inputs.scoped
        env:
          ARGOS_SURREAL_MODE: embedded
          ARGOS_SURREAL_REQUIRED: "1"
        shell: bash
        run: |
          set -euo pipefail
          cargo=(python3 scripts/agent_cargo.py)
          backend=(-p argos-api-host -p argos-osint-api -p argos-osint-core -p fleetworks-jobs)
          "${cargo[@]}" clippy --locked "${backend[@]}" --lib --bins -- -D warnings
          # The lifecycle test starts a real worker. Give its memory guard a fresh
          # test process without changing the backend feature graph or the guard.
          lifecycle=local_ipc::embedded::tests::ipc_lifecycle_registration_seed_and_restart_resume_preserves_job_without_duplicates
          lifecycle_log="$RUNNER_TEMP/embedded-ipc-lifecycle.log"
          "${cargo[@]}" test --locked "${backend[@]}" --lib --bins --no-fail-fast \
            -- "$lifecycle" --exact | tee "$lifecycle_log"
          grep -Fq "test $lifecycle ... ok" "$lifecycle_log"
          "${cargo[@]}" test --locked "${backend[@]}" --lib --bins --no-fail-fast -- --skip "$lifecycle"
          "${cargo[@]}" test --locked -p argos-osint-api --test classifier_activation
          "${cargo[@]}" test --locked -p argos-osint-core --features fixtures --no-fail-fast \
            --test storage_contracts --test storage_jobs --test storage_brief --test storage_brief_publish \
            --test storage_provider_pacer --test storage_provider_account --test storage_credits \
            --test storage_actor_catalog --test storage_atlas_delete --test storage_setup_jobs \
            --test storage_classifier_activation --test storage_operational_logs
      - name: Local matrix leg (embedded)
        if: '!inputs.scoped'
        run: bash scripts/local_matrix.sh --storage embedded
