<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Actor identity maintenance</title><style>body{margin:0;background:#f5f5f5;color:#2d3142;font-family:system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:32px}h1{font-family:Georgia,serif;font-weight:400}svg{width:100%;min-width:900px}.frame{overflow-x:auto}</style></head><body><main><h1>Actor identity maintenance</h1><div class="frame"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" role="img" aria-labelledby="title desc">
<title id="title">Actor identity and direct source associations</title>
<desc id="desc">All actor writers normalize names before source-scoped binding. Direct mentions count independently of Related pairs. A separate elected worker cleans historical labels through the shared local NLP worker and proposes contextual identity decisions. Cached decisions merge only after input and lease checks; old IDs survive. Missing configuration or uncertain assessments preserve separate identities. Article changes clear their contributions.</desc>

<g fill="none" stroke="#4f5d75" marker-end="url(#arrow)"><path d="M225 83 H310"/><path d="M555 83 H640"/><path d="M430 125 V190"/><path d="M555 232 H640"/><path d="M432 275 V336"/><path d="M755 275 V336"/><path d="M640 377 H555"/><path d="M310 377 H180 V125"/></g>
<g font-family="system-ui,sans-serif" fill="#2d3142" text-anchor="middle">
<text x="35" y="28" text-anchor="start" font-size="14">INGESTION / PUBLICATION</text>
<rect x="35" y="45" width="190" height="80" fill="#fff" stroke="#2d3142"/>
<text x="130" y="74" font-size="14">Atlas · Recon · Claims</text><text x="130" y="100" font-size="12">original spelling + provenance</text>
<rect x="310" y="45" width="245" height="80" fill="#fff4ee" stroke="#eb6c36"/>
<text x="432" y="73" font-size="14">Normalize → scoped bind</text><text x="432" y="99" font-size="12">aliases / identifiers / redirects</text>
<rect x="640" y="45" width="225" height="80" fill="#fff" stroke="#2d3142"/>
<text x="752" y="73" font-size="14">Direct source associations</text><text x="752" y="99" font-size="12">current mentions → article counts</text>
<text x="35" y="174" text-anchor="start" font-size="14">SEPARATE ELECTED MAINTENANCE</text>
<rect x="310" y="190" width="245" height="85" fill="#fff" stroke="#2d3142"/>
<text x="432" y="215" font-size="14">NLP labels + identity candidates</text><text x="432" y="240" font-size="12">≤100 labels · ≤8 decisions</text><text x="432" y="261" font-size="12">aliases retained · cached pairs</text>
<rect x="640" y="190" width="225" height="85" fill="#fff4ee" stroke="#eb6c36"/>
<text x="752" y="215" font-size="14">Entity Resolver</text><text x="752" y="240" font-size="12">native Decisions / chat</text><text x="752" y="261" font-size="12">same · different · uncertain</text>
<text x="445" y="309" text-anchor="start" font-size="11">same-source spelling</text>
<rect x="640" y="336" width="225" height="82" fill="#fff" stroke="#2d3142"/>
<text x="752" y="363" font-size="14">Recheck snapshot + pair lease</text><text x="752" y="388" font-size="12">only same → merge</text><text x="752" y="407" font-size="12">failure → cooldown / retry</text>
<rect x="310" y="336" width="245" height="82" fill="#fff" stroke="#2d3142"/>
<text x="432" y="364" font-size="14">Canonical actor + old IDs</text><text x="432" y="389" font-size="12">provenance preserved · reversible</text><text x="432" y="407" font-size="12">explicit split blocks re-merging</text>
<text x="35" y="452" text-anchor="start" font-size="12">Deletion updates source counts; unsupported actors and dependent edges retire and leave the index.</text>
<text x="35" y="475" text-anchor="start" font-size="12">Missing resolver / uncertain identity keeps records separate. Related suggestions still require two shared entities.</text>
</g></svg>
</div><p>Direct source associations are independent of article Related eligibility. Contextual identity assessment runs outside ingestion and outside SQLite transactions; receipts and redirects preserve audit history.</p></main></body></html>
