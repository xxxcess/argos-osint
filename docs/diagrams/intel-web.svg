<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="intel-web-title intel-web-desc">
<title id="intel-web-title">Intel web request and readiness boundaries</title>
<desc id="intel-web-desc">The browser reaches the Next.js relay on the web origin. The relay adds the API bearer server-side. Retained actor, brief, Related, and topology operations use private Brain. The gateway retains live streams.</desc>
<defs>
  <marker id="intel-web-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4f5d75"/></marker>
</defs>
<style>
  text{font-family:Geist,system-ui,sans-serif;fill:#2d3142}
  .heading{font-family:'Instrument Serif',Georgia,serif;font-size:24px}
  .label{font-size:16px;font-weight:600}
  .note{font-size:13px}
  .code{font:12px 'Geist Mono',ui-monospace,monospace}
  .zone{font-size:12px;font-weight:600;letter-spacing:1px}
  .node{fill:white;stroke:#4f5d75}
  .accent{fill:#fff6ed;stroke:#eb6c36}
  .edge,.flow{fill:none;stroke:#4f5d75;stroke-width:1.5}
  .edge{marker-end:url(#intel-web-arrow)}
</style>
<rect width="960" height="360" fill="#f5f5f5"/>
<text x="40" y="36" class="heading" text-anchor="start">Browser traffic stays on the web origin</text>
<path d="M220 124H280" class="edge"/>
<path d="M460 124H520" class="edge"/>
<path d="M700 124H760" class="edge"/>
<path d="M610 160V200H728V252H760" class="edge"/>
<path d="M840 160V232" class="edge"/>
<path d="M700 268H760" class="edge"/>
<rect x="40" y="88" width="180" height="72" rx="6" class="node"/>
<text x="130" y="121" class="label" text-anchor="middle">Intel browser</text>
<text x="130" y="139" class="note" text-anchor="middle">Loopback web origin</text>
<rect x="280" y="88" width="180" height="72" rx="6" class="accent"/>
<text x="370" y="121" class="label" text-anchor="middle">Next.js relay</text>
<text x="370" y="139" class="note" text-anchor="middle">Same-origin HTTP and WS</text>
<rect x="520" y="88" width="180" height="72" rx="6" class="accent"/>
<text x="610" y="121" class="label" text-anchor="middle">API gateway</text>
<text x="610" y="139" class="note" text-anchor="middle">Bearer · Host · Origin</text>
<rect x="760" y="88" width="160" height="72" rx="6" class="node"/>
<text x="840" y="121" class="label" text-anchor="middle">Private Brain</text>
<text x="840" y="139" class="note" text-anchor="middle">Retained operations</text>
<rect x="520" y="232" width="180" height="72" rx="6" class="node"/>
<text x="610" y="265" class="label" text-anchor="middle">Brief worker</text>
<text x="610" y="283" class="note" text-anchor="middle">Executes brief stages</text>
<rect x="760" y="232" width="160" height="72" rx="6" class="node"/>
<text x="840" y="265" class="label" text-anchor="middle">SurrealDB</text>
<text x="840" y="283" class="note" text-anchor="middle">Network datastore</text>
<text x="40" y="220" class="note" text-anchor="start">Venture waits for the owned stack</text>
<text x="40" y="242" class="note" text-anchor="start">and storage-backed API readiness.</text>
<text x="40" y="310" class="note" text-anchor="start">The API and web ports publish on host loopback.</text>
</svg>
