<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 432" role="img" aria-labelledby="venture-navigation-title venture-navigation-desc">
<title id="venture-navigation-title">External Venture operator startup and ownership</title>
<desc id="venture-navigation-desc">An external operator selects Venture's deployment workspace and configured storage target, explicitly starts or reconciles owned services and checks actual owner readiness before printing addresses. The retained web command may attach an operator terminal to Jobs or service logs. Exiting that session leaves the deployment running. Status, logs and stop operate only on the owned deployment and retain persistent data. Native application startup is a separate gateway connection and registration flow and never invokes Venture or starts this stack.</desc>
<defs>
  <marker id="venture-navigation-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4f5d75"/></marker>
</defs>
<style>
  text{font-family:Geist,system-ui,sans-serif;fill:#2d3142}
  .heading{font-family:'Instrument Serif',Georgia,serif;font-size:24px}
  .label{font-size:16px;font-weight:600}
  .note{font-size:13px}
  .code{font:12px 'Geist Mono',ui-monospace,monospace}
  .zone{font-size:12px;font-weight:600;letter-spacing:1px}
  .node{fill:white;stroke:#4f5d75}
  .accent{fill:#fff6ed;stroke:#eb6c36}
  .edge,.flow{fill:none;stroke:#4f5d75;stroke-width:1.5}
  .edge{marker-end:url(#venture-navigation-arrow)}
</style>
<rect width="960" height="432" fill="#f5f5f5"/>
<text x="40" y="36" class="heading" text-anchor="start">External operator startup and owned-stack lifecycle</text>
<path d="M228 116H272" class="edge"/>
<path d="M460 116H504" class="edge"/>
<path d="M692 116H736" class="edge"/>
<path d="M598 152V192H364V236" class="edge"/>
<path d="M828 152V212H596V236" class="edge"/>
<path d="M828 152V236" class="edge"/>
<rect x="40" y="80" width="188" height="72" rx="6" class="node"/>
<text x="134" y="113" class="label" text-anchor="middle">Operator workspace</text>
<text x="134" y="131" class="note" text-anchor="middle">Deployment configuration</text>
<rect x="272" y="80" width="188" height="72" rx="6" class="node accent"/>
<text x="366" y="113" class="label" text-anchor="middle">Start owned services</text>
<text x="366" y="131" class="note" text-anchor="middle">Explicit operator command</text>
<rect x="504" y="80" width="188" height="72" rx="6" class="node"/>
<text x="598" y="113" class="label" text-anchor="middle">Probe readiness</text>
<text x="598" y="131" class="note" text-anchor="middle">Configured owner checks</text>
<rect x="736" y="80" width="184" height="72" rx="6" class="node accent"/>
<text x="828" y="113" class="label" text-anchor="middle">Owned stack is ready</text>
<text x="828" y="131" class="note" text-anchor="middle">Print configured addresses</text>
<rect x="264" y="236" width="200" height="72" rx="6" class="node"/>
<text x="364" y="269" class="label" text-anchor="middle">Startup failure</text>
<text x="364" y="287" class="note" text-anchor="middle">Retain diagnostics and data</text>
<rect x="496" y="236" width="200" height="72" rx="6" class="node"/>
<text x="596" y="269" class="label" text-anchor="middle">Optional CLI session</text>
<text x="596" y="287" class="note" text-anchor="middle">web: attach Jobs or logs</text>
<rect x="728" y="236" width="192" height="72" rx="6" class="node"/>
<text x="824" y="269" class="label" text-anchor="middle">Operator management</text>
<text x="824" y="287" class="note" text-anchor="middle">status · logs · stop</text>
<text x="40" y="336" class="note" text-anchor="start">Exiting the operator terminal leaves the stack running; venture stop stops owned services and retains data.</text>
<text x="40" y="364" class="note">This deployment workspace is not a native origin child. Venture remains an external operator tool.</text>
<text x="40" y="404" class="note">Native startup follows native-connections: choose a gateway, authenticate and register; it starts no services.</text>
</svg>
