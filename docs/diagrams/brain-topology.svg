<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="brain-topology-title brain-topology-desc">
<title id="brain-topology-title">Argos Brain Memory Topology and Scope Analysis</title>
<desc id="brain-topology-desc">Topology projection resolves typed seed into bounded node and edge graphs with cycle scoping. Background worker analyzes scope relationships without vector index contention. Interactive TUI maps 5 presentation kinds across a 3-panel reactive layout.</desc>
