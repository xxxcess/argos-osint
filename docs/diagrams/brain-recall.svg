      <svg role="img" aria-labelledby="brain-recall-title brain-recall-desc" viewBox="0 0 800 280" xmlns="http://www.w3.org/2000/svg">
        <title id="brain-recall-title">Brain recall</title>
        <desc id="brain-recall-desc">Memories persist in SQLite. Optional MiniLM vectors live in LanceDB. Recall hybrid-ranks Jaccard and vectors, then synthesis may extract cited claims back into Brain.</desc>

        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="800" height="280" fill="#f5f5f5"/>

        <path d="M196 88 H228" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M356 88 H388" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <path d="M516 88 H548" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M676 88 H708" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M772 132 V176 H100 V88" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="36" y="48" width="160" height="80" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
        <text x="116.0" y="76" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">Write</text>
        <text x="116.0" y="94" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">SQLite memories</text>
        <rect x="228" y="48" width="128" height="80" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
        <text x="292.0" y="76" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">Embed</text>
        <text x="292.0" y="94" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">MiniLM 384-d</text>
        <rect x="388" y="48" width="128" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="452.0" y="76" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">Recall</text>
        <text x="452.0" y="94" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">hybrid rank</text>
        <rect x="548" y="48" width="128" height="80" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
        <text x="612.0" y="76" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">Packet</text>
        <text x="612.0" y="94" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">Brain resources</text>
        <rect x="708" y="48" width="128" height="80" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
        <text x="772.0" y="76" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">Extract</text>
        <text x="772.0" y="94" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">cited claims</text>
        <text x="400" y="220" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#4f5d75">ARGOS_EMBED=0 → JACCARD ONLY</text>
        <text x="400" y="252" text-anchor="middle" font-family="Instrument Serif,serif" font-size="14" font-style="italic" fill="#2d3142">A ◉ mark on an answer opens the memories that were in that prompt.</text>

      </svg>
