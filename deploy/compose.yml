x-workspace: &workspace
  type: bind
  source: ${FLEETWORKS_HOST_WORKSPACE:?Set FLEETWORKS_HOST_WORKSPACE to the initialized absolute workspace path}
  target: /workspace
  bind:
    create_host_path: false

x-runtime-environment: &runtime-environment
  ARGOS_HOME: /workspace
  FLEETWORKS_WORKSPACE: /workspace
  HOME: /workspace
  FLEETWORKS_STORAGE_URL: ${FLEETWORKS_STORAGE_URL:-ws://surrealdb:8000}
  FLEETWORKS_STORAGE_NAMESPACE: ${FLEETWORKS_STORAGE_NAMESPACE:-fleetworks}
  FLEETWORKS_STORAGE_DATABASE: ${FLEETWORKS_STORAGE_DATABASE:-fleetworks}
  FLEETWORKS_STORAGE_USERNAME: ${FLEETWORKS_STORAGE_USERNAME:-fleetworks}
  FLEETWORKS_STORAGE_PASSWORD_FILE: /run/secrets/storage_password

x-runtime: &runtime
  image: ${FLEETWORKS_RUNTIME_IMAGE:-fleetworks-runtime:local}
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    target: runtime
  user: &workspace-user "${FLEETWORKS_UID:?Set FLEETWORKS_UID to the workspace owner's numeric UID}:${FLEETWORKS_GID:?Set FLEETWORKS_GID to the workspace owner's numeric GID}"
  environment: *runtime-environment
  volumes:
    - *workspace
  # Application roles do not need the workspace's secret files or the managed
  # database's disk. Each receives only its named credential files below.
  tmpfs:
    - /tmp
    - /workspace/secrets
    - /workspace/storage
  secrets:
    - storage_password
  extra_hosts:
    - host.docker.internal=host-gateway
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 30s

services:
  bootstrap:
    <<: *runtime
    command: [--role, bootstrap]
    restart: "no"
    environment:
      <<: *runtime-environment
      FLEETWORKS_STORAGE_ROOT_USERNAME: ${FLEETWORKS_STORAGE_ROOT_USERNAME:-root}
      FLEETWORKS_STORAGE_ROOT_PASSWORD_FILE: /run/secrets/storage_root_password
    volumes:
      - <<: *workspace
        read_only: true
    secrets:
      - storage_password
      - storage_root_password
    depends_on:
      surrealdb:
        condition: service_healthy
        required: false

  api:
    <<: *runtime
    command: [--role, api, --port, "8080"]
    restart: unless-stopped
    environment:
      <<: *runtime-environment
      FLEETWORKS_API_BIND: ${FLEETWORKS_API_BIND:-0.0.0.0}
      FLEETWORKS_API_ALLOWED_HOSTS: "${FLEETWORKS_API_ALLOWED_HOSTS:-api:8080,127.0.0.1,localhost,127.0.0.1:${FLEETWORKS_API_PORT:-8080},localhost:${FLEETWORKS_API_PORT:-8080}}"
      FLEETWORKS_API_ALLOWED_ORIGINS: ${FLEETWORKS_API_ALLOWED_ORIGINS:-}
      FLEETWORKS_API_TOKEN_FILE: /run/secrets/api_token
      FLEETWORKS_API_HEALTH_HOST: "127.0.0.1:${FLEETWORKS_API_PORT:-8080}"
      FLEETWORKS_BRAIN_ORIGIN: http://brain:8080
      FLEETWORKS_INTERNAL_TOKEN_FILE: /run/secrets/brain_token
      FLEETWORKS_TOOLS_ORIGIN: http://tools:8080
      FLEETWORKS_TOOLS_TOKEN_FILE: /run/secrets/tools_token
      FLEETWORKS_CONTROL_ORIGIN: http://control:8080
      FLEETWORKS_CONTROL_TOKEN_FILE: /run/secrets/control_token
      FLEETWORKS_JOBS_ORIGIN: http://jobs:8080
      FLEETWORKS_JOBS_TOKEN_FILE: /run/secrets/jobs_token
    secrets:
      - storage_password
      - api_token
      - brain_token
      - tools_token
      - control_token
      - jobs_token
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      brain:
        condition: service_healthy
      tools:
        condition: service_healthy
      control:
        condition: service_healthy
      jobs:
        condition: service_healthy
    ports:
      - target: 8080
        published: "${FLEETWORKS_API_PORT:-8080}"
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      test: [CMD, /usr/local/bin/check-fleetworks-api]
      interval: 5s
      timeout: 4s
      start_period: 15s
      retries: 6

  brain:
    <<: *runtime
    command: [--role, brain, --port, "8080"]
    restart: unless-stopped
    environment:
      <<: *runtime-environment
      FLEETWORKS_BRAIN_BIND: 0.0.0.0
      FLEETWORKS_BRAIN_ALLOWED_HOSTS: brain:8080
      FLEETWORKS_INTERNAL_TOKEN_FILE: /run/secrets/brain_token
      FLEETWORKS_API_TOKEN_FILE: /run/secrets/brain_token
      FLEETWORKS_API_HEALTH_HOST: brain:8080
    secrets:
      - storage_password
      - brain_token
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, /usr/local/bin/check-fleetworks-api]
      interval: 5s
      timeout: 4s
      start_period: 15s
      retries: 6

  tools:
    <<: *runtime
    command: [--role, tools, --port, "8080"]
    restart: unless-stopped
    environment:
      <<: *runtime-environment
      FLEETWORKS_TOOLS_BIND: 0.0.0.0
      FLEETWORKS_TOOLS_ALLOWED_HOSTS: tools:8080
      FLEETWORKS_TOOLS_TOKEN_FILE: /run/secrets/tools_token
      FLEETWORKS_API_TOKEN_FILE: /run/secrets/tools_token
      FLEETWORKS_API_HEALTH_HOST: tools:8080
    secrets:
      - storage_password
      - tools_token
    depends_on: &private-api-startup
      bootstrap:
        condition: service_completed_successfully
    healthcheck: &private-api-healthcheck
      test: [CMD, /usr/local/bin/check-fleetworks-api]
      interval: 5s
      timeout: 4s
      start_period: 15s
      retries: 6

  control:
    <<: *runtime
    command: [--role, control, --port, "8080"]
    restart: unless-stopped
    environment:
      <<: *runtime-environment
      FLEETWORKS_CONTROL_BIND: 0.0.0.0
      FLEETWORKS_CONTROL_ALLOWED_HOSTS: control:8080
      FLEETWORKS_CONTROL_TOKEN_FILE: /run/secrets/control_token
      FLEETWORKS_API_TOKEN_FILE: /run/secrets/control_token
      FLEETWORKS_API_HEALTH_HOST: control:8080
    secrets:
      - storage_password
      - control_token
    depends_on: *private-api-startup
    healthcheck: *private-api-healthcheck

  jobs:
    <<: *runtime
    command: [--role, jobs, --port, "8080"]
    restart: unless-stopped
    environment:
      <<: *runtime-environment
      FLEETWORKS_JOBS_BIND: 0.0.0.0
      FLEETWORKS_JOBS_ALLOWED_HOSTS: jobs:8080
      FLEETWORKS_JOBS_TOKEN_FILE: /run/secrets/jobs_token
      FLEETWORKS_API_TOKEN_FILE: /run/secrets/jobs_token
      FLEETWORKS_API_HEALTH_HOST: jobs:8080
    secrets:
      - storage_password
      - jobs_token
    depends_on: *private-api-startup
    healthcheck: *private-api-healthcheck

  worker:
    <<: *runtime
    command: [--role, worker]
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  brief-worker:
    <<: *runtime
    command: [--role, brief-worker]
    restart: unless-stopped
    environment:
      <<: *runtime-environment
      FLEETWORKS_EXECUTION_ORIGIN: http://execution:8080
      FLEETWORKS_EXECUTION_TOKEN_FILE: /run/secrets/execution_token
    secrets:
      - storage_password
      - execution_token
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      execution:
        condition: service_healthy

  execution:
    <<: *runtime
    command: [--role, execution, --port, "8080"]
    restart: unless-stopped
    environment:
      <<: *runtime-environment
      FLEETWORKS_EXECUTION_BIND: 0.0.0.0
      FLEETWORKS_EXECUTION_ALLOWED_HOSTS: execution:8080
      FLEETWORKS_EXECUTION_TOKEN_FILE: /run/secrets/execution_token
      FLEETWORKS_API_TOKEN_FILE: /run/secrets/execution_token
      FLEETWORKS_API_HEALTH_HOST: execution:8080
    secrets:
      - storage_password
      - execution_token
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, /usr/local/bin/check-fleetworks-api]
      interval: 5s
      timeout: 4s
      start_period: 15s
      retries: 12

  web:
    image: ${FLEETWORKS_WEB_IMAGE:-fleetworks-web:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    user: *workspace-user
    restart: unless-stopped
    environment:
      HOME: /tmp
      PORT: "3000"
      FLEETWORKS_WEB_BIND: 0.0.0.0
      FLEETWORKS_WEB_ORIGIN: "${FLEETWORKS_WEB_ORIGIN:-http://127.0.0.1:${FLEETWORKS_WEB_PORT:-3000}}"
      FLEETWORKS_API_ORIGIN: http://api:8080
      FLEETWORKS_API_TOKEN_FILE: /run/secrets/api_token
    secrets:
      - api_token
    depends_on:
      api:
        condition: service_healthy
    ports:
      - target: 3000
        published: "${FLEETWORKS_WEB_PORT:-3000}"
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      test: [CMD, node, /usr/local/lib/fleetworks/check-web.mjs]
      interval: 5s
      timeout: 4s
      start_period: 15s
      retries: 6
    tmpfs:
      - /tmp
      - /opt/fleetworks-web/apps/web-desktop/.next/cache:mode=1777
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s

  surrealdb:
    profiles: [disk]
    image: ${FLEETWORKS_SURREAL_IMAGE:-fleetworks-surrealdb:3.3.4}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: surrealdb
    user: *workspace-user
    restart: unless-stopped
    environment:
      FLEETWORKS_STORAGE_ROOT_USERNAME: ${FLEETWORKS_STORAGE_ROOT_USERNAME:-root}
      FLEETWORKS_STORAGE_ROOT_PASSWORD_FILE: /run/secrets/storage_root_password
    volumes:
      - type: bind
        source: ${FLEETWORKS_HOST_WORKSPACE}/storage/surrealdb
        target: /data
        bind:
          create_host_path: false
    tmpfs:
      - /tmp
      - /logs
    secrets:
      - storage_root_password
    healthcheck:
      test: [CMD, /surreal, isready, --endpoint, "http://127.0.0.1:8000"]
      interval: 5s
      timeout: 4s
      start_period: 15s
      retries: 6
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s

secrets:
  api_token:
    file: ${FLEETWORKS_API_TOKEN_FILE:-${FLEETWORKS_HOST_WORKSPACE}/secrets/api-token}
  brain_token:
    file: ${FLEETWORKS_BRAIN_TOKEN_FILE:-${FLEETWORKS_HOST_WORKSPACE}/secrets/brain-token}
  tools_token:
    file: ${FLEETWORKS_TOOLS_TOKEN_FILE:-${FLEETWORKS_HOST_WORKSPACE}/secrets/tools-token}
  control_token:
    file: ${FLEETWORKS_CONTROL_TOKEN_FILE:-${FLEETWORKS_HOST_WORKSPACE}/secrets/control-token}
  jobs_token:
    file: ${FLEETWORKS_JOBS_TOKEN_FILE:-${FLEETWORKS_HOST_WORKSPACE}/secrets/jobs-token}
  execution_token:
    file: ${FLEETWORKS_EXECUTION_TOKEN_FILE:-${FLEETWORKS_HOST_WORKSPACE}/secrets/execution-token}
  storage_password:
    file: ${FLEETWORKS_STORAGE_PASSWORD_FILE:-${FLEETWORKS_HOST_WORKSPACE}/secrets/storage-password}
  storage_root_password:
    file: ${FLEETWORKS_STORAGE_ROOT_PASSWORD_FILE:-${FLEETWORKS_HOST_WORKSPACE}/secrets/storage-root-password}
