<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 402" role="img" aria-labelledby="atlas-pipeline-title atlas-pipeline-desc">
<title id="atlas-pipeline-title">Atlas collection, admission, and derivatives</title>
<desc id="atlas-pipeline-desc">Atlas submits a durable cycle through the Fleetworks API. RabbitMQ wakes the worker, and SurrealDB owns delivery state and outcomes. Rust-BERT admits up to two qualifying domains; admitted occurrences schedule independent derivative work.</desc>
<defs>
  <marker id="atlas-pipeline-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4f5d75"/></marker>
</defs>
<style>
  text{font-family:Geist,system-ui,sans-serif;fill:#2d3142}
  .heading{font-family:'Instrument Serif',Georgia,serif;font-size:24px}
  .label{font-size:16px;font-weight:600}
  .note{font-size:13px}
  .code{font:12px 'Geist Mono',ui-monospace,monospace}
  .zone{font-size:12px;font-weight:600;letter-spacing:1px}
  .node{fill:white;stroke:#4f5d75}
  .accent{fill:#fff6ed;stroke:#eb6c36}
  .edge,.flow{fill:none;stroke:#4f5d75;stroke-width:1.5}
  .edge{marker-end:url(#atlas-pipeline-arrow)}
</style>
<rect width="960" height="402" fill="#f5f5f5"/>
