[package]
name = "fleetworks-assistant-bert"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

# Keep LibTorch outside the gateway and native client dependency graphs.
[workspace]

[dependencies]
anyhow = "1"
libc = "0.2"
rust-bert = { version = "=0.22.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tch = "=0.14.0"
