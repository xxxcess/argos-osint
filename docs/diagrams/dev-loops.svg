<text x="952" y="390" class="note">Native / web / API / storage evidence</text>
<text x="952" y="418" class="note">Selected fixtures + inspect images</text>
<text x="952" y="446" class="note">Widen to required integration gates</text>

<rect x="936" y="584" width="336" height="136" rx="6" class="node"/>
<text x="952" y="616" class="label">Explicit owned recreation</text>
<text x="952" y="646" class="note">Dedicated workspace / project / ports</text>
<text x="952" y="674" class="note">Use the selected image tag / digest</text>
<text x="952" y="702" class="note">Retain data and unrelated images</text>

<text x="48" y="892" class="minor">Preserve useful debug / BuildKit caches, data and images; isolate review work from the user's running stack.</text>
<text x="48" y="920" class="minor">Native app startup connects to the gateway; direct Docker commands own backend lifecycle.</text>
