<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="native-workstation-layout-title native-workstation-layout-desc">
<title id="native-workstation-layout-title">Native navigation and selected-view composition</title>
<desc id="native-workstation-layout-desc">Six sidebar destinations share one selected content area. The gateway header opens Status without another navigation item; Current Setup Gateway uses URL/check; approved pairing and Keychain remain unimplemented. This is a layout schematic, not runtime approval.</desc>
<style>text{font-family:Geist,Arial,sans-serif;fill:#242424}.zone{font-size:14px;letter-spacing:1.4px;fill:#666}.label{font-size:20px;font-weight:600}.note{font-size:16px;fill:#555}.small{font-size:14px;fill:#666}.node{fill:#fff;stroke:#aaa;stroke-width:1}.focus{fill:#fff4ee;stroke:#eb6c36;stroke-width:2}.wire{fill:none;stroke:#555;stroke-width:2;marker-end:url(#arrow)}.lane{fill:#fafafa;stroke:#ddd;stroke-width:1}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs>
<rect width="1200" height="720" fill="#fff"/>
<rect x="40" y="56" width="1120" height="592" rx="6" fill="#fff" stroke="#777"/><path d="M 40 124 H 1160" stroke="#bbb"/><path d="M 320 124 V 648" stroke="#bbb"/>
<text x="64" y="98" class="label">Gateway / status header</text><text x="484" y="98" class="note">Opens Workstation Status</text><rect x="952" y="72" width="184" height="36" rx="6" class="focus"/><text x="970" y="97" class="note">Setup Gateway</text><text x="64" y="163" class="zone">COLLAPSIBLE SIDEBAR</text><rect x="56" y="188" width="248" height="44" rx="6" class="focus"/><text x="72" y="216" class="note">DB Seed &amp; Train</text><text x="72" y="276" class="note">News Cycles</text><text x="72" y="336" class="note">Brain Search</text><text x="72" y="396" class="note">OSINT Tools</text><text x="72" y="456" class="note">Model Assignments</text><text x="72" y="516" class="note">Jobs &amp; Logs</text><text x="352" y="164" class="zone">ONLY SELECTED DESTINATION</text><rect x="352" y="196" width="756" height="160" rx="6" class="node"/>
<text x="368" y="228" class="label">DB Seed &amp; Train</text>
<text x="368" y="260" class="note">Configured seed, index-build and Natural candidate triggers</text>
<text x="368" y="286" class="note">Read-only operation and dataset metadata</text>
<text x="368" y="312" class="note">Permission / revision / readiness reasons stay beside each action</text>
<path d="M 352 404 H 1108" stroke="#bbb"/><text x="352" y="444" class="label">Compact windows use one column.</text><text x="352" y="480" class="note">Ordinary list/detail navigation replaces side-by-side panes.</text><text x="352" y="516" class="note">One scroll owner per pane; wrapped text; independent visible focus.</text><text x="352" y="580" class="small">Status uses Native Client / Gateway Backend / Host Resources cards.</text>
<text x="40" y="696" class="small">Actual Rune views, keyboard/input and narrow/wide states require their own inspected evidence.</text>
</svg>
