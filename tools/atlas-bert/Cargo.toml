[package]
name = "argos-atlas-bert"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

# Keep LibTorch's build graph separate from the Argos workspace.
[workspace]

[dependencies]
anyhow = "1"
rust-bert = { version = "=0.22.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tch = "=0.14.0"
