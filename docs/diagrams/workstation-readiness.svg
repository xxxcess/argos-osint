<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="workstation-readiness-title workstation-readiness-desc">
<title id="workstation-readiness-title">Readiness, configured inputs and durable native maintenance</title>
<desc id="workstation-readiness-desc">Readiness is a bounded observation through configured owners, never a download, seed, train, indexing or service startup side effect. Native maintenance uses operator-configured revision-bound inputs and distinguishes accepted jobs from completed effects. Natural training, activation and verified Rust-BERT inference remain separate facts.</desc>
<style>text{font-family:Geist,Arial,sans-serif;fill:#242424}.zone{font-size:14px;letter-spacing:1.4px;fill:#666}.label{font-size:20px;font-weight:600}.note{font-size:16px;fill:#555}.small{font-size:14px;fill:#666}.node{fill:#fff;stroke:#aaa;stroke-width:1}.focus{fill:#fff4ee;stroke:#eb6c36;stroke-width:2}.wire{fill:none;stroke:#555;stroke-width:2;marker-end:url(#arrow)}.lane{fill:#fafafa;stroke:#ddd;stroke-width:1}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs>
<rect width="1200" height="720" fill="#fff"/>
<text x="40" y="48" class="zone">READ-ONLY OBSERVATIONS · PERMISSION AND FRESHNESS ARE SEPARATE</text><rect x="40" y="88" width="332" height="148" rx="6" class="focus"/>
<text x="56" y="120" class="label">Workstation Status</text>
<text x="56" y="152" class="note">Gateway, registration, services</text>
<text x="56" y="178" class="note">Timestamped readiness checks</text>
<text x="56" y="204" class="note">Optional API-host metrics</text>
<rect x="432" y="88" width="332" height="148" rx="6" class="node"/>
<text x="448" y="120" class="label">Backend-owned observations</text>
<text x="448" y="152" class="note">Catalog and reader-visible index</text>
<text x="448" y="178" class="note">Natural candidate vs activation</text>
<text x="448" y="204" class="note">Rust-BERT inference separately</text>
<rect x="824" y="88" width="336" height="148" rx="6" class="node"/>
<text x="840" y="120" class="label">Partial and stale states</text>
<text x="840" y="152" class="note">Unknown is not zero or success</text>
<text x="840" y="178" class="note">No work is started by a GET</text>
<text x="840" y="204" class="note">Optional failure is local to action</text>
<path d="M 372 160 H 432" class="wire"/>
<path d="M 764 160 H 824" class="wire"/>
<text x="40" y="300" class="zone">DB SEED &amp; TRAIN · CONFIGURED INPUTS AND DURABLE ACCEPTANCE</text><rect x="40" y="344" width="332" height="148" rx="6" class="node"/>
<text x="56" y="376" class="label">Operator-configured inputs</text>
<text x="56" y="408" class="note">Validated staged DatasetRef</text>
<text x="56" y="434" class="note">Exact configuration revision</text>
<text x="56" y="460" class="note">No native picker or upload</text>
<rect x="432" y="344" width="332" height="148" rx="6" class="focus"/>
<text x="448" y="376" class="label">Allowed explicit trigger</text>
<text x="448" y="408" class="note">Actor seed / index / Natural train</text>
<text x="448" y="434" class="note">Current permission and context</text>
<text x="448" y="460" class="note">Missing or stale input disables</text>
<rect x="824" y="344" width="336" height="148" rx="6" class="node"/>
<text x="840" y="376" class="label">Durable workstation job</text>
<text x="840" y="408" class="note">Receipt means queued, not done</text>
<text x="840" y="434" class="note">Safe result through Jobs</text>
<text x="840" y="460" class="note">Training does not activate</text>
<path d="M 372 416 H 432" class="wire"/>
<path d="M 764 416 H 824" class="wire"/>
<path d="M 40 552 H 1160" stroke="#bbb"/><text x="40" y="592" class="label">Candidate activation remains a separate authorized backend API.</text><text x="40" y="626" class="note">The native control allowlist exposes no activation, dataset upload or global activity toolbar.</text>
<text x="40" y="696" class="small">Finite visible/focused reads preserve unavailable, denied, stale and failed states explicitly.</text>
</svg>
