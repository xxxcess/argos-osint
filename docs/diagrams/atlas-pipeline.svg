      <svg role="img" aria-labelledby="atlas-pipeline-title atlas-pipeline-desc" viewBox="0 0 880 240" xmlns="http://www.w3.org/2000/svg">
        <title id="atlas-pipeline-title">Atlas news cycle</title>
        <desc id="atlas-pipeline-desc">Discovery fills a 48-hour window, countries are scored into heat bands, then regional headlines are pulled for the kept bands. Pause stores a cursor; Resume continues the same run.</desc>

        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="880" height="240" fill="#f5f5f5"/>

        <path d="M148 88 H176" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M300 88 H328" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M452 88 H480" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <path d="M604 88 H632" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M756 88 H784" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="24" y="48" width="124" height="80" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
        <text x="86.0" y="76" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">GNews</text>
        <text x="86.0" y="94" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">phase 1 search</text>
        <rect x="176" y="48" width="124" height="80" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
        <text x="238.0" y="76" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">NewsData</text>
        <text x="238.0" y="94" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">phase 1 latest</text>
        <rect x="328" y="48" width="124" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="390.0" y="76" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">Score</text>
        <text x="390.0" y="94" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">4 heat bands</text>
        <rect x="480" y="48" width="124" height="80" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
        <text x="542.0" y="76" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">NewsAPI</text>
        <text x="542.0" y="94" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">phase 2</text>
        <rect x="632" y="48" width="124" height="80" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
        <text x="694.0" y="76" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">Currents</text>
        <text x="694.0" y="94" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">phase 2</text>
        <rect x="784" y="48" width="72" height="80" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
        <text x="820.0" y="76" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">Feed</text>
        <text x="820.0" y="94" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">session</text>
        <text x="440" y="176" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#4f5d75">DROP BOTTOM 20%  ·  QUOTA LEDGER PER PROVIDER</text>
        <text x="440" y="208" text-anchor="middle" font-family="Instrument Serif,serif" font-size="14" font-style="italic" fill="#2d3142">History recolours the Braille world map from the selected cycle.</text>

