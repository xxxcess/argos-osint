<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="team-title team-desc">
<title id="team-title">Agent handoffs with continuous documentation</title>
<desc id="team-desc">Architect scopes a phase. At scheduled phase checkpoints, coder integrates child edits, then calls Scribe to update documentation before tester verifies. Reports return through coder to architect. Behavior fixes trigger another scoped documentation review. Scribe is a leaf role.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4f5d75"/></marker></defs>
<rect width="960" height="400" fill="#f5f5f5"/>
<g fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"><path d="M216 100H280"/><path d="M456 100H520"/><path d="M608 144V208H456"/><path d="M368 252V292H696V252"/><path d="M784 208H912V360H128V144"/></g>
<g fill="white" stroke="#4f5d75"><rect x="40" y="56" width="176" height="88" rx="6"/><rect x="280" y="56" width="176" height="88" rx="6"/><rect x="520" y="56" width="176" height="88" rx="6"/><rect x="280" y="164" width="176" height="88" rx="6" stroke="#eb6c36" stroke-width="2"/><rect x="608" y="164" width="176" height="88" rx="6"/></g>
<g fill="#2d3142" font-family="Geist,system-ui,sans-serif" text-anchor="middle"><text x="128" y="92" font-size="20">Architect</text><text x="128" y="120" font-size="13">Scope · accept phase</text><text x="368" y="92" font-size="20">Coder</text><text x="368" y="120" font-size="13">Assign · integrate</text><text x="608" y="92" font-size="20">Child coders</text><text x="608" y="120" font-size="13">Edit · format</text><text x="368" y="200" font-size="20">Scribe</text><text x="368" y="228" font-size="13">Code review → wiki</text><text x="696" y="200" font-size="20">Tester</text><text x="696" y="228" font-size="13">Verify final tree</text><text x="532" y="316" font-size="13">Coder owns sequential calls and forwards evidence to architect.</text><text x="480" y="384" font-size="13">Behavior fixes repeat the affected Scribe pass. Scribe never delegates.</text></g>
</svg>
