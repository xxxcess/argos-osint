<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="brain-topology-title brain-topology-desc">
<title id="brain-topology-title">Brain topology and neighborhood summaries</title>
<desc id="brain-topology-desc">A canonical Brain memory ID or retained brief seed opens a bounded topology snapshot. The Intel desktop presents a 3D graph and an accessible list, with a deterministic neighborhood summary when available.</desc>
<defs>
  <marker id="brain-topology-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4f5d75"/></marker>
</defs>
<style>
  text{font-family:Geist,system-ui,sans-serif;fill:#2d3142}
  .heading{font-family:'Instrument Serif',Georgia,serif;font-size:24px}
  .label{font-size:16px;font-weight:600}
  .note{font-size:13px}
  .code{font:12px 'Geist Mono',ui-monospace,monospace}
  .zone{font-size:12px;font-weight:600;letter-spacing:1px}
  .node{fill:white;stroke:#4f5d75}
  .accent{fill:#fff6ed;stroke:#eb6c36}
  .edge,.flow{fill:none;stroke:#4f5d75;stroke-width:1.5}
  .edge{marker-end:url(#brain-topology-arrow)}
</style>
<rect width="960" height="420" fill="#f5f5f5"/>
<text x="40" y="36" class="heading" text-anchor="start">Inspect retained connections and request a summary</text>
<path d="M232 116H284" class="edge"/>
<path d="M476 116H528" class="edge"/>
<path d="M720 116H768" class="edge"/>
<path d="M844 152V220H348V264" class="edge"/>
<path d="M444 300H508" class="edge"/>
<path d="M700 300H764" class="edge"/>
<rect x="40" y="80" width="192" height="72" rx="6" class="node"/>
<text x="136" y="104" class="label" text-anchor="middle">Choose a seed</text>
<text x="136" y="122" class="note" text-anchor="middle">Actor · claim · inference</text>
<text x="136" y="140" class="note" text-anchor="middle">or extracted brief</text>
<rect x="284" y="80" width="192" height="72" rx="6" class="node"/>
<text x="380" y="113" class="label" text-anchor="middle">Private Brain</text>
<text x="380" y="131" class="note" text-anchor="middle">Validate and resolve seed</text>
<rect x="528" y="80" width="192" height="72" rx="6" class="node"/>
<text x="624" y="113" class="label" text-anchor="middle">Bounded snapshot</text>
<text x="624" y="131" class="note" text-anchor="middle">Typed nodes · evidence edges</text>
<rect x="768" y="80" width="152" height="72" rx="6" class="accent"/>
<text x="844" y="113" class="label" text-anchor="middle">Intel desktop</text>
<text x="844" y="131" class="note" text-anchor="middle">3D graph + list</text>
<rect x="252" y="264" width="192" height="72" rx="6" class="node"/>
<text x="348" y="297" class="label" text-anchor="middle">Fallback summary</text>
<text x="348" y="315" class="note" text-anchor="middle">Deterministic evidence facets</text>
<rect x="508" y="264" width="192" height="72" rx="6" class="accent"/>
<text x="604" y="297" class="label" text-anchor="middle">Generate explicitly</text>
<text x="604" y="315" class="note" text-anchor="middle">Exact evidence and route</text>
<rect x="764" y="264" width="156" height="72" rx="6" class="node"/>
<text x="842" y="297" class="label" text-anchor="middle">Validate result</text>
<text x="842" y="315" class="note" text-anchor="middle">Keep fallback on failure</text>
<text x="40" y="380" class="note" text-anchor="start">Navigation reads retained evidence. Generate is a separate action.</text>
</svg>
