<!doctype html><html lang="en"><meta charset="utf-8"><title>Actor catalog</title><style>body{margin:0;background:#f5f5f5}main{max-width:1200px;margin:auto}svg{width:100%;height:auto}</style><main><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">Actor catalog seeding and deterministic association</title><desc id="desc">Venture probes seed readiness in a child. A seed child validates CSV and commits actor batches with a completion receipt. Article names and strong aliases match canonical actors; ambiguous and unknown names do not create actors.</desc>

<text x="32" y="38" class="head">Static actor catalog · Source identity, not evidence of involvement</text>
<rect x="32" y="75" width="260" height="110" class="box"/><text x="48" y="101" class="label">Venture service root</text><text x="48" y="127" class="note">Short-lived readiness probe</text><text x="48" y="150" class="note">Seed DB if incomplete or empty</text><text x="48" y="172" class="note">No repository retained by parent</text>

<path d="M490 185V231H162V185" class="line"/><text x="360" y="219" class="note">Retry committed IDs; exit returns to Venture</text>
<rect x="32" y="280" width="260" height="105" class="box"/><text x="48" y="308" class="label">Article + cleaned body</text><text x="48" y="335" class="note">Commit metadata; retry body NLP next</text><text x="48" y="359" class="note">Byte spans + clean artifact hash</text>
