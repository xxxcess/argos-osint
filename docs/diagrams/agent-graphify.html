<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Agent exploration</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; }
    html,body { margin:0; background:var(--paper); color:var(--ink); font-family:Geist,system-ui,sans-serif; }
    main { max-width:920px; margin:0 auto; padding:40px 24px 64px; }
    .eyebrow { font-family:"Geist Mono",ui-monospace,monospace; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
    h1 { font-family:"Instrument Serif",serif; font-weight:400; font-size:1.75rem; margin:.4rem 0 .5rem; }
    p.lede { color:var(--muted); max-width:40rem; margin:0 0 1.25rem; font-size:15px; line-height:1.5; }
    .frame { overflow-x:auto; }
    svg { min-width:800px; display:block; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Process</div>
    <h1>Agent exploration</h1>
    <p class="lede">Query the code graph before a broad search. Write a named plan under .planning/. After edits, update the graph. Track graph.json, manifest.json, and GRAPH_REPORT.md only.</p>
    <div class="frame">
      <svg role="img" aria-labelledby="agent-graphify-title agent-graphify-desc" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg">
        <title id="agent-graphify-title">Agent exploration</title>
        <desc id="agent-graphify-desc">Query the code graph before a broad search. Write a named plan under .planning/. After edits, update the graph. Track graph.json, manifest.json, and GRAPH_REPORT.md only.</desc>

        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="800" height="220" fill="#f5f5f5"/>

        <path d="M148 88 H176" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M300 88 H328" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <path d="M452 88 H480" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M604 88 H632" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="24" y="48" width="124" height="80" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
        <text x="86.0" y="76" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">Query</text>
        <text x="86.0" y="94" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">graphify</text>
        <rect x="176" y="48" width="124" height="80" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
        <text x="238.0" y="76" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">Read</text>
        <text x="238.0" y="94" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">source_location</text>
        <rect x="328" y="48" width="124" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="390.0" y="76" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">Plan</text>
        <text x="390.0" y="94" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">.planning/</text>
        <rect x="480" y="48" width="124" height="80" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
        <text x="542.0" y="76" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">Edit</text>
        <text x="542.0" y="94" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">crates/</text>
        <rect x="632" y="48" width="144" height="80" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
        <text x="704.0" y="76" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">Update</text>
        <text x="704.0" y="94" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">graphify update</text>
        <text x="400" y="188" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">findings.md holds untrusted web text · task_plan.md is the orchestrator</text>

      </svg>
    </div>
  </main>
</body>
</html>
