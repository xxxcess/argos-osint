<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="classifier-runtime-title classifier-runtime-desc">
<title id="classifier-runtime-title">Pinned Rust-BERT classification on Linux</title>
<desc id="classifier-runtime-desc">Atlas pins an exact Linux worker, MNLI checkpoint and threshold before fresh collection. The private Linux classifier keeps the Rust-BERT worker warm and returns six independent domain scores for Atlas admission. Optional Natural training and explicit activation are separate. Native AMD64 and ARM64 real-checkpoint execution remains pending evidence; this source diagram records no runtime pass.</desc>
<defs>
  <marker id="classifier-runtime-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4f5d75"/></marker>
</defs>
<style>
  text{font-family:Geist,system-ui,sans-serif;fill:#2d3142}
  .heading{font-family:'Instrument Serif',Georgia,serif;font-size:24px}
  .label{font-size:16px;font-weight:600}
  .note{font-size:13px}
  .code{font:12px 'Geist Mono',ui-monospace,monospace}
  .zone{font-size:12px;font-weight:600;letter-spacing:1px}
  .node{fill:white;stroke:#4f5d75}
  .accent{fill:#fff6ed;stroke:#eb6c36}
  .edge,.flow{fill:none;stroke:#4f5d75;stroke-width:1.5}
  .edge{marker-end:url(#classifier-runtime-arrow)}
</style>
<rect width="960" height="420" fill="#f5f5f5"/>
<text x="40" y="36" class="heading" text-anchor="start">Fresh Atlas cycles use the private Linux Rust-BERT service</text>
<path d="M216 124H272" class="edge"/>
<path d="M476 124H532" class="edge"/>
<path d="M720 124H768" class="edge"/>
<path d="M844 164V216H380V236" class="edge"/>
<path d="M476 272H532" class="edge"/>
<rect x="40" y="84" width="176" height="80" rx="6" class="node"/>
<text x="128" y="121" class="label" text-anchor="middle">Linux Atlas worker</text>
<text x="128" y="139" class="note" text-anchor="middle">Authenticated batch calls</text>
<rect x="272" y="84" width="204" height="80" rx="6" class="accent"/>
<text x="374" y="121" class="label" text-anchor="middle">Private classifier</text>
<text x="374" y="139" class="note" text-anchor="middle">Linux / exact model pin</text>
<rect x="532" y="84" width="188" height="80" rx="6" class="node"/>
<text x="626" y="121" class="label" text-anchor="middle">Rust-BERT worker</text>
<text x="626" y="139" class="note" text-anchor="middle">Linux AMD64 / ARM64</text>
<rect x="768" y="84" width="152" height="80" rx="6" class="node"/>
<text x="844" y="121" class="label" text-anchor="middle">MNLI model</text>
<text x="844" y="139" class="note" text-anchor="middle">Pinned checkpoint</text>
<rect x="272" y="236" width="204" height="72" rx="6" class="node"/>
<text x="374" y="269" class="label" text-anchor="middle">Domain scores</text>
<text x="374" y="287" class="note" text-anchor="middle">Six independent scores</text>
<rect x="532" y="236" width="264" height="72" rx="6" class="accent"/>
<text x="664" y="269" class="label" text-anchor="middle">Atlas admission</text>
<text x="664" y="287" class="note" text-anchor="middle">Zero, one, or two qualifying domains</text>
<text x="558" y="204" class="note" text-anchor="start">Score article titles and descriptions</text>
<text x="40" y="344" class="note">Mac pages use the gateway; the backend owns the worker, native libraries and checkpoint.</text>
<text x="40" y="372" class="note">Optional Natural training / activation does not retrain Rust-BERT or change fresh Atlas routing.</text>
<text x="40" y="400" class="note">Real inference on both Linux architectures and installed Mac GUI evidence remain pending and separate.</text>
</svg>
