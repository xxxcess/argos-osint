<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="brain-recall-title brain-recall-desc">
<title id="brain-recall-title">Brain recall</title><desc id="brain-recall-desc">SurrealDB recall fences vector hits by model, generation, text revision, lifecycle and kind. When too few vector hits survive, a bounded lexical scan supplies Jaccard matches. Original evidence admission remains a separate downstream step before inference.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4f5d75"/></marker></defs>
<rect width="960" height="460" fill="#f5f5f5"/>
<style>text{font-family:Geist,system-ui,sans-serif;fill:#2d3142}.label{font-size:18px}.note{font-size:13px}.line{fill:none;stroke:#4f5d75;stroke-width:2;marker-end:url(#arrow)}</style>
<rect x="32" y="36" width="240" height="88" rx="6" fill="white" stroke="#4f5d75"/>
<text x="152.0" y="64" text-anchor="middle" class="label">Recall query</text>
<text x="152.0" y="87" text-anchor="middle" class="note">Text + optional MiniLM vector</text>
<text x="152.0" y="105" text-anchor="middle" class="note">Opt-out / empty → no reads</text>
<path d="M272 80H336" class="line"/>
<rect x="336" y="36" width="272" height="88" rx="6" fill="white" stroke="#eb6c36"/>
<text x="472.0" y="64" text-anchor="middle" class="label">DISKANN candidates</text>
<text x="472.0" y="87" text-anchor="middle" class="note">Current model + generation</text>
<text x="472.0" y="105" text-anchor="middle" class="note">Active kind + revision fence</text>
<path d="M608 80H672" class="line"/>
<rect x="672" y="36" width="256" height="88" rx="6" fill="white" stroke="#4f5d75"/>
<text x="800.0" y="64" text-anchor="middle" class="label">Lexical top-up</text>
<text x="800.0" y="87" text-anchor="middle" class="note">If vector hits are insufficient</text>
<text x="800.0" y="105" text-anchor="middle" class="note">Jaccard · scan ≤4,096 rows</text>
<path d="M800 124V188H480V216" class="line"/>
<rect x="312" y="216" width="336" height="88" rx="6" fill="white" stroke="#eb6c36"/>
<text x="480.0" y="244" text-anchor="middle" class="label">Bounded recall result</text>
<text x="480.0" y="267" text-anchor="middle" class="note">Vectors first; deduplicated lexical hits</text>
<text x="480.0" y="285" text-anchor="middle" class="note">≤5 memories · ≤1,500 tokens</text>
<text x="480" y="352" text-anchor="middle" class="note">Default kinds: Claim and Inference. Explicit allowed_kinds admits structural records.</text>
<text x="480" y="380" text-anchor="middle" class="note">No query vector or vector-search failure → lexical fallback; lexical database errors propagate.</text>
<text x="480" y="408" text-anchor="middle" class="note">Memory records and 384-dimensional embedding rows both live in SurrealDB.</text>
</svg>
