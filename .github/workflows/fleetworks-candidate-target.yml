name: Package and verify one Linux backend target

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      runner:
        type: string
        required: true
      include-web:
        type: boolean
        default: false
      expected-head:
        type: string
        required: true

permissions:
  contents: read

env:
  CANDIDATE_TARGET: ${{ inputs.target }}
  EXPECTED_HEAD: ${{ inputs.expected-head }}
  FLEETWORKS_HEAD: ${{ github.sha }}
  INCLUDE_WEB: ${{ inputs.include-web }}

jobs:
  package:
    name: Build and export native images
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 65
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      manifest-sha256: ${{ steps.package.outputs.manifest-sha256 }}
    steps:
      - name: Require requested revision
        run: test "$EXPECTED_HEAD" = "$FLEETWORKS_HEAD"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build and export only production images
        id: package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FLEETWORKS_HEAD"
          web=()
          if [[ "$INCLUDE_WEB" == true ]]; then web=(--web); fi
          python3 scripts/fleetworks_candidate_images.py pack "${web[@]}" \
            --directory "$RUNNER_TEMP/fleetworks-image-candidate" \
            --revision "$FLEETWORKS_HEAD" --target "$CANDIDATE_TARGET" --github-output "$GITHUB_OUTPUT"
      - name: Upload immutable image candidate
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fleetworks-images-${{ inputs.target }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fleetworks-image-candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  verify:
    name: Smoke downloaded image IDs
    needs: package
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require the exact image artifact ID
        env:
          IMAGE_ARTIFACT_ID: ${{ needs.package.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FLEETWORKS_HEAD"
          [[ "$IMAGE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
      - name: Download the exact image archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: ${{ runner.temp }}/fleetworks-image-candidate
          digest-mismatch: error
      - name: Verify downloaded images through standalone scoped Compose
        env:
          MANIFEST_SHA256: ${{ needs.package.outputs.manifest-sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          web=()
          if [[ "$INCLUDE_WEB" == true ]]; then web=(--web); fi
          python3 scripts/fleetworks_candidate_images.py verify "${web[@]}" \
            --directory "$RUNNER_TEMP/fleetworks-image-candidate" --manifest-sha256 "$MANIFEST_SHA256" \
            --revision "$FLEETWORKS_HEAD" --target "$CANDIDATE_TARGET" | tee "$RUNNER_TEMP/backend-smoke.log"
      - name: Retain actual backend smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fleetworks-backend-evidence-${{ inputs.target }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/backend-smoke.log
            .agent-scratch/native-review/candidate-*/public-smoke-*.json
          if-no-files-found: error
          retention-days: 14
