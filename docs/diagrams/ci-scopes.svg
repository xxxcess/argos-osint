<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="ci-scopes-title ci-scopes-desc">
<title id="ci-scopes-title">Fleetworks scoped checks and publication</title>
<desc id="ci-scopes-desc">Each PR update selects affected Linux x86_64 app and AMD64 backend checks for the exact head. After first-pass CI succeeds, a second dispatch checks the remaining affected platforms and web. Trusted pushes stage selected dual-architecture images and publish verified artifacts to nightly or stable.</desc>
<defs><marker id="ci-scopes-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4f5d75"/></marker></defs>
<style>text{font-family:Geist,system-ui,sans-serif;fill:#2d3142}.heading{font-family:'Instrument Serif',Georgia,serif;font-size:28px}.label{font-size:20px;font-weight:600}.note{font-size:16px}.code{font:14px 'Geist Mono',ui-monospace,monospace}.zone{font-size:13px;font-weight:600;letter-spacing:1px}.minor{font-size:14px;fill:#4f5d75}.node,.pending{fill:#fff;stroke:#4f5d75;stroke-width:1.5}.accent{fill:#fff6ed;stroke:#eb6c36;stroke-width:1.5}.pending{stroke-dasharray:6 4}.edge,.later,.flow{fill:none;stroke:#4f5d75;stroke-width:1.5}.later{stroke-dasharray:6 4}.edge,.later{marker-end:url(#ci-scopes-arrow)}</style>
<rect width="1280" height="720" fill="#f5f5f5"/>
<text x="32" y="36" class="heading">Exact source → selected checks → trusted publication</text>
<text x="32" y="64" class="zone">FIRST-PASS LINUX CI → SECOND-PASS PLATFORM CHECKS · TRUSTED PUSHES PUBLISH</text>
<path d="M304 406H336V142H368" class="edge"/>
<path d="M880 142H912V142H944" class="edge"/>
<path d="M304 406H336V274H368" class="edge"/>
<path d="M880 274H912V142H944" class="edge"/>
<path d="M304 406H336V406H368" class="edge"/>
<path d="M880 406H912V142H944" class="edge"/>
<path d="M304 406H336V538H368" class="edge"/>
<path d="M880 538H912V142H944" class="edge"/>
<path d="M1096 196V264" class="edge"/>
<path d="M1096 392V440" class="edge"/>
<rect x="32" y="340" width="272" height="132" rx="6" class="accent"/>
<text x="48" y="372" class="label">Scope planner</text>
<text x="48" y="400" class="note">Exact event head + Git diff</text>
<text x="48" y="424" class="note">PR or trusted branch push</text>
<text x="48" y="448" class="note">Dependencies select lanes</text>
<rect x="368" y="88" width="512" height="108" rx="6" class="node"/>
<text x="384" y="120" class="label">Native desktop</text>
<text x="384" y="148" class="note">First: Linux x86_64 debug app + Rune evidence</text>
<text x="384" y="172" class="note">Second: affected Intel and Apple Silicon Mac apps</text>
<rect x="368" y="220" width="512" height="108" rx="6" class="node"/>
<text x="384" y="252" class="label">Linux backend + affected storage</text>
<text x="384" y="280" class="note">First: AMD64 · second: ARM64 when selected</text>
<text x="384" y="304" class="note">Scoped Buildx or Depot build, then exact-image smoke</text>
<rect x="368" y="352" width="512" height="108" rx="6" class="node"/>
<text x="384" y="384" class="label">RN Web · web / web_dev</text>
<text x="384" y="412" class="note">Second: affected web checks and web image</text>
<text x="384" y="436" class="note">Relay/config changes select dependency closure</text>
<rect x="368" y="484" width="512" height="108" rx="6" class="node"/>
<text x="384" y="516" class="label">Linux classifier · bert</text>
<text x="384" y="544" class="note">First: AMD64 · second: ARM64 when selected</text>
<text x="384" y="568" class="note">Build / link / units / real checkpoint / bundle</text>
<rect x="944" y="88" width="304" height="108" rx="6" class="node"/>
<text x="960" y="120" class="label">Source checks</text>
<text x="960" y="148" class="note">Every selected lane succeeds</text>
<text x="960" y="172" class="note">Missing/failed results block</text>
<rect x="944" y="264" width="304" height="128" rx="6" class="node"/>
<text x="960" y="296" class="label">Trusted image staging</text>
<text x="960" y="324" class="note">Selected images only</text>
<text x="960" y="348" class="note">Build → smoke → push + tar.gz</text>
<text x="960" y="372" class="note">Native AMD64 + ARM64</text>
<rect x="944" y="440" width="304" height="152" rx="6" class="accent"/>
<text x="960" y="472" class="label">Publish → required</text>
<text x="960" y="500" class="note">Mac ZIPs + image/BERT bundles</text>
<text x="960" y="524" class="note">GHCR manifests + release.json</text>
<text x="960" y="548" class="note">nightly / stable channels</text>
<text x="960" y="572" class="note">PR: required, no publication</text>
<text x="32" y="640" class="minor">PR opened, updated or reopened targets dev, nightly or main. Dispatch pass two for the same head after first-pass CI succeeds.</text>
<text x="32" y="668" class="minor">Publication widens from the last published ancestor; first publication selects all, docs-only skips after a baseline.</text>
<text x="32" y="696" class="minor">The manual embedded diagnostic retains four platforms. Second-pass review runs do not publish.</text>
</svg>
