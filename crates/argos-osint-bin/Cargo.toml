[package]
name = "argos-osint-bin"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Terminal shell for Argos"
rust-version.workspace = true

[[bin]]
name = "argos"
path = "src/main.rs"

[features]
default = ["embedded", "nlp"]
nlp = ["argos-osint-core/nlp", "argos-osint-api/nlp"]
surreal = ["argos-osint-core/surreal"]
embedded = ["surreal", "argos-osint-core/embedded", "argos-osint-api/embedded"]
server = ["surreal", "argos-osint-core/server", "argos-osint-api/server"]

[dependencies]
argos-osint-api = { path = "../argos-osint-api", default-features = false }
axum = "0.8.8"
anyhow.workspace = true
argos-osint-core = { path = "../argos-osint-core", default-features = false }
chrono.workspace = true
clap.workspace = true
crossterm.workspace = true
ratatui.workspace = true
reqwest.workspace = true
rpassword.workspace = true
serde_json.workspace = true
serde.workspace = true
tokio.workspace = true
url.workspace = true
unicode-segmentation = "1.12"
unicode-width = "0.2"

[dev-dependencies]
argos-osint-core = { path = "../argos-osint-core", default-features = false, features = ["fixtures"] }
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
