      <svg role="img" aria-labelledby="recon-bindings-title recon-bindings-desc" viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg">
        <title id="recon-bindings-title">Binding and grounding</title>
        <desc id="recon-bindings-desc">Every tool input maps to a binding kind. Ungrounded inputs skip the step. Hunter accepts values only from the prompt, Firecrawl, SociaVault, or earlier Hunter calls.</desc>

        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="800" height="240" fill="#f5f5f5"/>

        <path d="M148 88 H176" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M300 88 H328" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <path d="M452 88 H480" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M604 88 H632" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="24" y="48" width="124" height="80" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
        <text x="86.0" y="76" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">Prompt</text>
        <text x="86.0" y="94" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">entities</text>
        <rect x="176" y="48" width="124" height="80" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
        <text x="238.0" y="76" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">Kinds</text>
        <text x="238.0" y="94" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">tool_io.rs</text>
        <rect x="328" y="48" width="124" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="390.0" y="76" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">Binder</text>
        <text x="390.0" y="94" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">evidence id</text>
        <rect x="480" y="48" width="124" height="80" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
        <text x="542.0" y="76" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">Step</text>
        <text x="542.0" y="94" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">run or skip</text>
        <rect x="632" y="48" width="144" height="80" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
        <text x="704.0" y="76" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">Executor</text>
        <text x="704.0" y="94" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">sequential HTTP</text>
        <text x="400" y="176" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#4f5d75">SKIP WHEN INPUT CANNOT BE TRACED</text>
        <text x="400" y="208" text-anchor="middle" font-family="Instrument Serif,serif" font-size="14" font-style="italic" fill="#2d3142">Search queries stay short: entity plus at most one qualifier.</text>

      </svg>
