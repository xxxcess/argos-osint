<rect x="570" y="18" width="194" height="78" rx="6" fill="#fff" stroke="#2d3142"/>
<text x="667" y="45">Claim associations</text><text x="667" y="67" font-size="11">Actors · Sources</text><text x="667" y="85" font-size="11" fill="#4f5d75">shared snapshot · tab offsets</text>
