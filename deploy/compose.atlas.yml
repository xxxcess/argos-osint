services:
  bootstrap:
    environment:
      FLEETWORKS_ATLAS_DISPATCH: "1"

  atlas:
    extends:
      file: compose.yml
      service: worker
    command: [/usr/local/bin/argos-api-host, --role, atlas-worker]
    environment:
      FLEETWORKS_QUEUE_NAME: ${FLEETWORKS_QUEUE_NAME:-fleetworks.atlas}
      FLEETWORKS_NLP_ORIGIN: http://nlp:8080
      FLEETWORKS_CLASSIFIER_ORIGIN: http://classifier:8080
      FLEETWORKS_INTERNAL_TOKEN_FILE: /run/secrets/internal_token
      # Collection uses news credentials, not the model execution service.
      FLEETWORKS_EXECUTION_ORIGIN: ""
    secrets:
      - internal_token
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      jobs:
        condition: service_healthy
      nlp:
        condition: service_healthy
      classifier:
        condition: service_healthy

  nlp: &private-engine
    image: ${FLEETWORKS_RUNTIME_IMAGE:-fleetworks-runtime:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: runtime
      args:
        FLEETWORKS_CORE_OPT_LEVEL: ${FLEETWORKS_CORE_OPT_LEVEL:-1}
    user: "${FLEETWORKS_UID:?Set FLEETWORKS_UID}:${FLEETWORKS_GID:?Set FLEETWORKS_GID}"
    command: [--role, nlp, --port, "8080"]
    environment:
      FLEETWORKS_NLP_BIND: 0.0.0.0
      FLEETWORKS_NLP_ALLOWED_HOSTS: nlp:8080,127.0.0.1:8080
      FLEETWORKS_INTERNAL_TOKEN_FILE: /run/secrets/internal_token
      FLEETWORKS_API_TOKEN_FILE: /run/secrets/internal_token
      FLEETWORKS_API_HEALTH_HOST: "127.0.0.1:8080"
    secrets:
      - internal_token
    healthcheck:
      test: [CMD, /usr/local/bin/check-fleetworks-api]
      interval: 5s
      timeout: 4s
      start_period: 15s
      retries: 6
    tmpfs:
      - /tmp
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 20s

  classifier:
    <<: *private-engine
    command: [--role, classifier, --port, "8080"]
    environment:
      ARGOS_HOME: /workspace
      FLEETWORKS_WORKSPACE: /workspace
      FLEETWORKS_CLASSIFIER_BIND: 0.0.0.0
      FLEETWORKS_CLASSIFIER_ALLOWED_HOSTS: classifier:8080,127.0.0.1:8080
      FLEETWORKS_INTERNAL_TOKEN_FILE: /run/secrets/internal_token
      FLEETWORKS_API_TOKEN_FILE: /run/secrets/internal_token
      FLEETWORKS_API_HEALTH_HOST: "127.0.0.1:8080"
      LD_LIBRARY_PATH: /workspace/models/atlas-bert/lib
    volumes:
      - type: bind
        source: ${FLEETWORKS_HOST_WORKSPACE}
        target: /workspace
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp
      - /workspace/secrets
      - /workspace/storage

secrets:
  internal_token:
    file: ${FLEETWORKS_INTERNAL_TOKEN_FILE:-${FLEETWORKS_HOST_WORKSPACE}/secrets/internal-token}
