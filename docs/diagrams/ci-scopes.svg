<text x="48" y="372" class="label">Scope planner</text>
<text x="48" y="400" class="code">Exact SHA + Git diff</text>
<text x="48" y="424" class="note">Dependencies select lanes</text>
<text x="48" y="448" class="note">components=native: both Macs</text>
<rect x="368" y="88" width="512" height="108" rx="6" class="node"/>
