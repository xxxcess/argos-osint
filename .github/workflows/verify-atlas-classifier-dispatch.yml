name: Atlas classifier follow-up dispatch
on:
  push:
    branches: [verify/atlas-zero-shot-intel]
    paths: ['.github/workflows/verify-atlas-classifier-dispatch.yml']
permissions:
  actions: write
jobs:
  dispatch:
    if: ${{ github.event.head_commit.message == 'Dispatch Atlas classifier follow-up matrix' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch the full build matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
