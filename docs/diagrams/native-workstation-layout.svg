<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="native-workstation-layout-title native-workstation-layout-desc">
<title id="native-workstation-layout-title">Native workstation shell and settings composition</title>
<desc id="native-workstation-layout-desc">A compact left operations sidebar, selected destination in the central scroll area, and a read-only context rail on wide windows. Workstation Settings opens a centered category and content dialog. Narrow windows hide the context rail while keeping the same controls.</desc>
<style>text{font-family:Geist,Arial,sans-serif;fill:#242424}.zone{font-size:13px;letter-spacing:1.2px;fill:#666}.label{font-size:20px;font-weight:600}.note{font-size:15px;fill:#444}.small{font-size:13px;fill:#666}.node{fill:#fff;stroke:#aaa;stroke-width:1}.focus{fill:#fff4ee;stroke:#eb6c36;stroke-width:2}.lane{fill:#fafafa;stroke:#ddd;stroke-width:1}.pill{fill:#f4f4f4;stroke:#ccc;stroke-width:1}</style>
