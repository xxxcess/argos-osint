name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded pushes to the same PR cancel the older run (main always completes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No debuginfo in CI: smaller target dirs (cache fits the 10 GB repo quota),
  # faster codegen/link, and cc builds librocksdb without -g.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, os: ubuntu-24.04, embedded: true }
          - { name: macOS Apple Silicon (arm64), os: macos-14, embedded: true }
          - { name: Linux aarch64, os: ubuntu-24.04-arm, embedded: false }
          # Slowest runner (~55-60 min cold). Runs on pushes to main only; see macos-intel job.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - uses: rui314/setup-mold@v1
        if: runner.os == 'Linux'
      - uses: Swatinem/rust-cache@v2
        with:
          # Smaller (debug=0) caches + 3 per-PR jobs instead of 4 keep the repo under
          # its 10 GB cache quota (was 10.29 GB, so entries were being evicted).
          cache-on-failure: true
      - name: Show which protoc the build will use
        run: |
          uname -sm
          cargo fetch --locked
          tools/protoc --version
      - name: Install libclang (RocksDB bindgen)
        if: runner.os == 'Linux' && matrix.embedded
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Storage dependency check (default links no SurrealDB)
        run: python3 scripts/check_storage_deps.py
      # Default feature set: compile + lint only (its tests are a subset of the NLP run).
      - name: Clippy (default, no LanceDB)
        run: cargo clippy --workspace --all-targets --locked --no-default-features -- -D warnings
      - name: Clippy (NLP)
        run: cargo clippy --workspace --all-targets --locked --no-default-features --features nlp -- -D warnings
      # Exactly the feature set + --workspace that test_surreal.py uses, so the
      # librocksdb-sys build-script output is reused by the test step (it was
      # compiled twice before: ~8-10 min each). `embedded` implies `surreal`.
      - name: Clippy (SurrealDB ${{ matrix.embedded && 'embedded' || 'remote' }})
        run: cargo clippy --workspace --all-targets --locked --no-default-features --features ${{ matrix.embedded && 'embedded' || 'surreal' }} -- -D warnings
      # Single test run; replaces separate Build + default Test + NLP Test.
      - name: Test (NLP enabled; offline; no LanceDB/embeddings)
        run: cargo test --workspace --locked --no-default-features --features nlp

      - name: Pinned SurrealDB hashes match design.md
        shell: bash
        run: |
          set -euo pipefail
          hashes=$(grep -oE '"[0-9a-f]{64}"' scripts/test_surreal.py | tr -d '"' | sort -u)
          test "$(echo "$hashes" | wc -l)" -eq 4
          for h in $hashes; do
            grep -q "$h" .planning/2026-10-22-surrealdb/design.md || { echo "hash $h not in design.md"; exit 1; }
          done
      - name: Cache SurrealDB 3.3.4 server binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/argos-surreal
          key: surreal-3.3.4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/test_surreal.py') }}
      - name: Install SurrealDB 3.3.4 server (SHA-256 verified)
        run: python3 scripts/test_surreal.py --mode server --fetch-only
      - name: Storage contracts (server mode, real 3.3.4 disk server)
        run: python3 scripts/test_surreal.py --mode server --cargo cargo
      # Requires the test_surreal.py patch (--workspace instead of -p argos-osint-core)
      # so this reuses the librocksdb-sys build from the clippy step instead of rebuilding it.
      - name: Storage contracts (embedded RocksDB mode)
        if: matrix.embedded
        run: python3 scripts/test_surreal.py --mode embedded --cargo cargo

  # Full original coverage on Intel Mac, only after merge to main (or manual label later).
  macos-intel:
    name: macOS Intel (x86_64)
    if: github.event_name == 'push'
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked && tools/protoc --version
      - run: cargo clippy --workspace --all-targets --locked --no-default-features -- -D warnings
      - run: cargo clippy --workspace --all-targets --locked --no-default-features --features nlp -- -D warnings
      - run: cargo clippy --workspace --all-targets --locked --no-default-features --features embedded -- -D warnings
      - run: cargo test --workspace --locked --no-default-features --features nlp
      - uses: actions/cache@v4
        with:
          path: ~/.cache/argos-surreal
          key: surreal-3.3.4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/test_surreal.py') }}
      - run: python3 scripts/test_surreal.py --mode both --cargo cargo
