[package]
name = "fleetworks-desktop"
description = "API-only native Fleetworks control hub for macOS"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
sha2.workspace = true
clap.workspace = true
fleetworks-contracts = { path = "../../crates/fleetworks-contracts" }
fleetworks-workstation = { path = "../../crates/fleetworks-workstation" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "fs", "io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
getrandom = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
rune.workspace = true
rune-kit.workspace = true
libc = "0.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSAccessibility"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSURL", "NSPathUtilities", "NSFileManager", "NSError"] }

[dev-dependencies]
tempfile.workspace = true
