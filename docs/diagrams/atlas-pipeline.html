<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Atlas news cycle</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; }
    html,body { margin:0; background:var(--paper); color:var(--ink); font-family:Geist,system-ui,sans-serif; }
    main { max-width:920px; margin:0 auto; padding:40px 24px 64px; }
    .eyebrow { font-family:"Geist Mono",ui-monospace,monospace; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
    h1 { font-family:"Instrument Serif",serif; font-weight:400; font-size:1.75rem; margin:.4rem 0 .5rem; }
    p.lede { color:var(--muted); max-width:40rem; margin:0 0 1.25rem; font-size:15px; line-height:1.5; }
    .frame { overflow-x:auto; }
    svg { min-width:940px; display:block; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Process</div>
    <h1>Atlas news cycle</h1>
    <p class="lede">Classifier is the only model role in collection-v1. Native entities and publisher priors join classification before local Related matching; article analysis begins independently in Intel. Pause retains receipts and Resume retries unresolved work.</p>
    <div class="frame">
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 940 430">
<title id="title">Atlas classification-only cycle</title><desc id="desc">Native news acquisition joins Classifier batches and local entity/publisher metadata before tentative Related matching. Pause retains receipts. Required classification failure blocks or partially completes; metadata failures produce warnings. Intel analysis is independently selected.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#4f5d75"/></marker></defs>
<rect width="940" height="430" fill="#f5f5f5"/>
<g fill="none" stroke="#4f5d75" marker-end="url(#arrow)"><path d="M224 130 H265 V80 H300"/><path d="M224 130 H265 V190 H300"/><path d="M530 80 H570 V135 H610"/><path d="M530 190 H570 V135 H610"/><path d="M735 175 V230"/><path d="M735 300 V335"/></g>
<g font-family="Geist,system-ui,sans-serif" fill="#2d3142" text-anchor="middle">
<rect x="24" y="90" width="200" height="80" rx="5" fill="#fff" stroke="#2d3142"/><text x="124" y="118" font-size="15">Native acquisition</text><text x="124" y="140" font-size="11">Discovery → regional coverage</text><text x="124" y="157" font-size="11">Quotas · dedupe · retained articles</text>
<rect x="300" y="40" width="230" height="80" rx="5" fill="#fff" stroke="#eb6c36"/><text x="415" y="68" font-size="15">Classifier only</text><text x="415" y="89" font-size="11">8 articles · 32 KiB · exact IDs</text><text x="415" y="107" font-size="11">Shared admission / retries / receipts</text>
<rect x="300" y="150" width="230" height="80" rx="5" fill="#fff" stroke="#2d3142"/><text x="415" y="178" font-size="15">Local metadata</text><text x="415" y="199" font-size="11">Complete title / description mentions</text><text x="415" y="217" font-size="11">Native WP:RSP publisher prior</text>
<rect x="610" y="95" width="250" height="80" rx="5" fill="#fff" stroke="#eb6c36"/><text x="735" y="122" font-size="15">Related article leads</text><text x="735" y="143" font-size="11">Verified spans · posting lists</text><text x="735" y="161" font-size="11">At least one recognized category</text>
<rect x="610" y="230" width="250" height="70" rx="5" fill="#fff" stroke="#2d3142"/><text x="735" y="257" font-size="15">Local finalization</text><text x="735" y="280" font-size="11">Article / metadata coverage · warnings</text>
<rect x="610" y="335" width="250" height="65" rx="5" fill="#fff" stroke="#2d3142"/><text x="735" y="360" font-size="15">Explicit Intel selection</text><text x="735" y="382" font-size="11">Independent article analysis / evidence</text>
<text x="282" y="290" font-size="12">Pause → stored receipts → Resume</text><text x="282" y="315" font-size="12">Required classification: completed / blocked / partial / failed</text><text x="282" y="346" font-size="12">No cycle claims, Brain publication or vector writes</text><text x="282" y="372" font-size="12">Shared mentions grant no corroboration or graph edge</text>
</g></svg>
    </div>
  </main>
</body>
</html>
