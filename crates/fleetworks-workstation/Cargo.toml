[package]
name = "fleetworks-workstation"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Fleetworks workstation identity, protected settings and local recovery"

[dependencies]
anyhow.workspace = true
fleetworks-contracts = { path = "../fleetworks-contracts" }
getrandom = "0.4"
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
toml.workspace = true
unicase = "=2.9.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", default-features = false }
