name: CI

on:
  push:
    branches: [main]
  pull_request:
    # No builds on PR pushes (synchronize): CI runs when a PR is opened, reopened or
    # marked ready for review (drafts skipped), when the `ci:full` label is added
    # (end of a feature, fix or review-fix round; results show in the PR's checks),
    # and on every push to main.
    types: [opened, reopened, ready_for_review, labeled]
  # Manual full-matrix run on any branch: `gh workflow run ci.yml --ref <branch>`.
  # Runs on a branch only; they don't appear in a PR's checks, so PRs use `ci:full`.
  workflow_dispatch:
    inputs:
      atlas_bert_intel_only:
        description: Build and test only the Atlas BERT worker on Intel macOS with the pinned checkpoint
        type: boolean
        default: false

# A newer PR event or dispatch on the same PR/branch cancels the older run (main pushes always complete).
concurrency:
  # Adding any other label gets its own group, so it never cancels a real run.
  group: ci-${{ github.workflow }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'ci:full') && format('skip-{0}', github.run_id) || github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.ref_name) || github.sha }}${{ inputs.atlas_bert_intel_only && '-atlas-bert' || '' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No debuginfo in CI: smaller target dirs (cache fits the 10 GB repo quota),
  # faster codegen/link, and cc builds librocksdb without -g.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

permissions:
  contents: read

jobs:
  atlas-bert-intel:
    if: github.event_name == 'workflow_dispatch' && inputs.atlas_bert_intel_only
    uses: ./.github/workflows/atlas-bert.yml
    with:
      intel_only: true
      intel_runtime: true
  build:
    name: ${{ matrix.platform.name }} / ${{ matrix.storage }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: Linux x86_64, os: ubuntu-24.04 }
          - { name: Linux aarch64, os: ubuntu-24.04-arm }
          - { name: macOS arm64, os: macos-15 }
          - { name: macOS Intel, os: macos-15-intel }
        storage: [embedded, server]
    if: >-
      !(github.event_name == 'workflow_dispatch' && inputs.atlas_bert_intel_only) &&
      (github.event_name != 'pull_request' ||
       (!github.event.pull_request.draft &&
        (github.event.action != 'labeled' || github.event.label.name == 'ci:full')))
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # Storage contracts seed synthetic catalogs; datasets.yml checks the full catalog once.
          lfs: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - uses: rui314/setup-mold@v1
        if: runner.os == 'Linux'
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache per OS x storage leg: embedded and server compile different feature sets.
          key: ${{ matrix.storage }}
          # local_matrix.sh builds through scripts/agent_cargo.py into target/agents.
          workspaces: . -> target/agents
          cache-on-failure: true
      - name: No SQLite or LanceDB in the dependency graph
        shell: bash
        run: |
          set -euo pipefail
          for c in rusqlite lancedb; do
            if cargo tree --workspace --all-features -e normal,build -i "$c" --locked >/dev/null 2>&1; then
              echo "::error::$c is still in the dependency graph"; exit 1
            fi
          done

      # ---- Embedded legs: exactly what a local `cargo` build runs (default features = embedded RocksDB).
      - name: Install libclang (RocksDB bindgen)
        if: runner.os == 'Linux' && matrix.storage == 'embedded'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      # Same entry point as a local run: default-feature clippy, full cargo test, embedded contracts.
      - name: Local matrix leg (embedded)
        if: matrix.storage == 'embedded'
        run: bash scripts/local_matrix.sh --storage embedded

      # ---- Server legs: network client only, against the pinned SurrealDB server.
      - name: Cache the pinned SurrealDB server binary
        if: matrix.storage == 'server'
        uses: actions/cache@v4
        with:
          path: ~/.cache/argos-surreal
          key: surreal-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/surrealdb-release.json', 'scripts/test_surreal.py') }}
      - name: Resolve the pinned SurrealDB server
        if: matrix.storage == 'server'
        id: surreal
        shell: bash
        run: |
          set -euo pipefail
          output="$(python3 scripts/test_surreal.py --mode server --fetch-only)"
          printf '%s\n' "$output"
          binary="$(printf '%s\n' "$output" | sed -n 's/^test-surreal: server binary //p')"
          test -x "$binary" || { echo '::error::Pinned SurrealDB executable not found'; exit 1; }
          printf 'binary=%s\n' "$binary" >> "$GITHUB_OUTPUT"
      # Same entry point as a local run: server-feature clippy + server contracts (no full unit tests).
      - name: Local matrix leg (server)
        if: matrix.storage == 'server'
        env:
          SURREAL_BIN: ${{ steps.surreal.outputs.binary }}
        run: bash scripts/local_matrix.sh --storage server --surreal-bin "$SURREAL_BIN"
