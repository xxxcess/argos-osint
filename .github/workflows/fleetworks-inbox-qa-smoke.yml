name: Verify Fleetworks Inbox QA in the packaged Embedded app

on:
  workflow_call:
    inputs:
      head:
        type: string
        required: true
      target:
        type: string
        required: true
      runner:
        type: string
        required: true
      release-version:
        type: string
        default: ""
      release-asset:
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

env:
  FLEETWORKS_HEAD: ${{ inputs.head }}
  QA_TARGET: ${{ inputs.target }}
  RELEASE_VERSION: ${{ inputs.release-version }}
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  embedded:
    name: Packaged Embedded inference offline
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.head }}
          persist-credentials: false
          lfs: false
      - name: Select the exact worker pack
        id: pack
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FLEETWORKS_HEAD"
          python3 -B .github/scripts/inbox_qa_artifact.py --family "Fleetworks-Inbox-QA-Pack-$QA_TARGET"
      - name: Download the worker pack and verify its Actions digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.pack.outputs.id }}
          path: ${{ runner.temp }}/inbox-qa-pack
          digest-mismatch: error
      - name: Require the downloaded archive and digest receipt at the artifact root
        shell: bash
        run: |
          set -euo pipefail
          pack="$RUNNER_TEMP/inbox-qa-pack"
          if [[ ! -f "$pack/Fleetworks-Inbox-QA-Pack-$QA_TARGET.tar.gz" || ! -f "$pack/digests.json" ]]; then
            echo '::error::The verified Inbox QA artifact must contain its archive and digest receipt at the root'
            exit 1
          fi
      - name: Select the exact Native app package
        id: app
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          profile=debug
          if [[ -n "$RELEASE_VERSION" ]]; then profile=release; fi
          case "$QA_TARGET:$profile" in
            x86_64-unknown-linux-gnu:*) family="Fleetworks-Linux-Desktop-App-x86_64-$profile" ;;
            *-apple-darwin:release) family="Fleetworks-macOS-Desktop-App-$QA_TARGET" ;;
            *-apple-darwin:debug) family="Fleetworks-macOS-Desktop-App-debug-$QA_TARGET" ;;
            *) echo 'Unrecognized Native app target'; exit 1 ;;
          esac
          printf 'profile=%s\n' "$profile" >> "$GITHUB_OUTPUT"
          python3 -B .github/scripts/inbox_qa_artifact.py --family "$family"
      - name: Download the verified Native archive by artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.app.outputs.id }}
          path: ${{ runner.temp }}/inbox-qa-native
          digest-mismatch: error
      - name: Select the exact streaming fixture worker
        id: stream_gate
        env:
          GH_TOKEN: ${{ github.token }}
          PACK_ATTEMPT: ${{ steps.pack.outputs.attempt }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B .github/scripts/inbox_qa_artifact.py --family "Fleetworks-Inbox-QA-Stream-Gate-$QA_TARGET"
          grep -Fx "attempt=$PACK_ATTEMPT" "$GITHUB_OUTPUT"
      - name: Download the fixture worker with a verified Actions digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.stream_gate.outputs.id }}
          path: ${{ runner.temp }}/inbox-qa-stream-gate
          digest-mismatch: error
      - name: Exercise real inference and cancellation through the packaged companion
        env:
          PACK_ATTEMPT: ${{ steps.pack.outputs.attempt }}
          APP_ATTEMPT: ${{ steps.app.outputs.attempt }}
          PROFILE: ${{ steps.app.outputs.profile }}
          DEPOT_NATIVE_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/nightly' && vars.FLEETWORKS_CI_PROVIDER == 'depot' && vars.DEPOT_NIGHTLY_NATIVE_ENABLED == 'true' }}
          QA_NIGHTLY_RELEASE: ${{ inputs.release-asset && github.event_name == 'push' && github.ref == 'refs/heads/nightly' }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          native="$RUNNER_TEMP/inbox-qa-native"
          pack="$RUNNER_TEMP/inbox-qa-pack"
          extracted="$RUNNER_TEMP/inbox-qa-extracted"
          evidence="$RUNNER_TEMP/inbox-qa-evidence"
          gate="$RUNNER_TEMP/inbox-qa-stream-gate/qa_stream_gate"
          test -f "$gate"
          test ! -L "$gate"
          chmod 0755 "$gate"
          mkdir -p "$evidence" "$RUNNER_TEMP/inbox-qa-empty-home"
          archives=("$native"/Fleetworks-*.tar.gz "$native"/Fleetworks-*.zip)
          manifests=("$native"/*.manifest.json)
          test "${#archives[@]}" = 1
          test "${#manifests[@]}" = 1
          version="${RELEASE_VERSION:-$(cat version.txt)}"
          if [[ "$QA_TARGET:$PROFILE:$DEPOT_NATIVE_RELEASE" == x86_64-unknown-linux-gnu:release:true ]]; then
            # The exact cross-job Actions artifact encloses the native Depot
            # archive with Depot's internal run identity.
            jq -e --arg head "$FLEETWORKS_HEAD" '.revision == $head and .dirty == false and .profile == "release"' \
              "${manifests[0]}" >/dev/null
          else
            jq -e --arg head "$FLEETWORKS_HEAD" --arg run "$GITHUB_RUN_ID" --arg attempt "$APP_ATTEMPT" \
              '.revision == $head and .run_id == $run and .run_attempt == $attempt and .dirty == false' \
              "${manifests[0]}" >/dev/null
          fi
          jq -e --arg head "$FLEETWORKS_HEAD" --arg run "$GITHUB_RUN_ID" --argjson attempt "$PACK_ATTEMPT" \
            --arg target "$QA_TARGET" \
            '.source_sha == $head and .run_id == $run and .run_attempt == $attempt and .target == $target' "$pack/digests.json" >/dev/null
          read -r digest _ < "${archives[0]}.sha256"
          rune_revision="$(python3 -B -c 'import sys; sys.path.insert(0,"scripts"); from fleetworks_candidate import locked_rune_revision; print(locked_rune_revision())')"
          python3 -B scripts/fleetworks_candidate.py verify-native --archive "${archives[0]}" --sha256 "$digest" \
            --revision "$FLEETWORKS_HEAD" --target "$QA_TARGET" --profile "$PROFILE" --version "$version" \
            --rune-revision "$rune_revision" --require-clean --directory "$extracted"

          app="$extracted/Fleetworks.app"
          # On macOS the production QA worker applies its own fail-closed
          # sandbox-exec profile; nesting profiles can deny child startup.
          offline=(env)
          if [[ "$QA_TARGET" == x86_64-unknown-linux-gnu ]]; then
            app="$extracted/Fleetworks-linux-x86_64"
            offline=(sudo -- unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- /usr/bin/env)
          fi
          "${offline[@]}" HOME="$RUNNER_TEMP/inbox-qa-empty-home" PYTHONDONTWRITEBYTECODE=1 \
            python3 -B scripts/fleetworks_qa_smoke.py embedded --app "$app" \
            --archive "$pack/Fleetworks-Inbox-QA-Pack-$QA_TARGET.tar.gz" --digests "$pack/digests.json" \
            --gated-worker "$gate" | tee "$evidence/embedded-$QA_TARGET.json"
          python3 -B .github/scripts/inbox_qa_smoke_receipt.py \
            --evidence "$evidence/embedded-$QA_TARGET.json" --target "$QA_TARGET" --head "$FLEETWORKS_HEAD"
          cp "$pack/digests.json" "$evidence/pack-digests-$QA_TARGET.json"
          if [[ "$QA_NIGHTLY_RELEASE" == true ]]; then
            test "$PROFILE" = release
            test -n "$RELEASE_VERSION"
            archive="Fleetworks-Inbox-QA-Pack-$QA_TARGET.tar.gz"
            release="$RUNNER_TEMP/inbox-qa-release"
            mkdir -p "$release"
            jq --arg archive "$archive" --arg version "$RELEASE_VERSION" --arg native "$digest" \
              --slurpfile smoke "$evidence/embedded-$QA_TARGET.json" '
              {target, source_sha, model_revision, manifest_sha256, archive_sha256,
               archive: $archive, version: $version, native_archive_sha256: $native, status: "passed"}
              + ($smoke[0] | {runtime, transport_attestation, model_pid_count, terminal_state,
                              terminal_events, cancelled_terminal_state, cancelled_terminal_events})
            ' "$pack/digests.json" > "$release/$archive.digests.json"
            ln "$pack/$archive" "$release/$archive"
          fi
      - name: Verify visible Embedded streaming in the packaged Linux window
        if: inputs.target == 'x86_64-unknown-linux-gnu' && inputs.release-version == ''
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            at-spi2-core python3-pyatspi libglib2.0-bin dbus-daemon xvfb xauth scrot xdotool \
            libvulkan1 mesa-vulkan-drivers libxkbcommon-x11-0
          pack="$RUNNER_TEMP/inbox-qa-pack"
          gate="$RUNNER_TEMP/inbox-qa-stream-gate/qa_stream_gate"
          sudo -- unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- /usr/bin/env \
            HOME="$RUNNER_TEMP/inbox-qa-empty-home" PYTHONDONTWRITEBYTECODE=1 \
            dbus-run-session -- xvfb-run --auto-servernum --server-args='-screen 0 1440x900x24 -nolisten tcp' \
            /usr/bin/python3 -B scripts/fleetworks_qa_linux_gui.py \
            --app "$RUNNER_TEMP/inbox-qa-extracted/Fleetworks-linux-x86_64" \
            --archive "$pack/Fleetworks-Inbox-QA-Pack-$QA_TARGET.tar.gz" --digests "$pack/digests.json" \
            --gated-worker "$gate" --output "$RUNNER_TEMP/inbox-qa-evidence/linux-graphical-streaming"
          python3 -B .github/scripts/inbox_qa_smoke_receipt.py --graphical \
            --evidence "$RUNNER_TEMP/inbox-qa-evidence/linux-graphical-streaming/streaming.json" \
            --target "$QA_TARGET" --head "$FLEETWORKS_HEAD"
      - name: Stage the smoke-verified pack for the immutable nightly release
        if: inputs.release-asset && github.event_name == 'push' && github.ref == 'refs/heads/nightly'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Fleetworks-Inbox-QA-Embedded-Release-${{ inputs.target }}-${{ inputs.head }}-${{ github.run_id }}.${{ github.run_attempt }}
          path: ${{ runner.temp }}/inbox-qa-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain Embedded runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Fleetworks-Inbox-QA-Embedded-${{ inputs.target }}-${{ inputs.head }}-${{ github.run_id }}.${{ github.run_attempt }}
          path: ${{ runner.temp }}/inbox-qa-evidence/
          if-no-files-found: ignore
          retention-days: 14
