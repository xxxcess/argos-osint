<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 944" role="img" aria-labelledby="dev-loops-title dev-loops-desc">
<title id="dev-loops-title">Fleetworks development loops: affected checks and explicit deployment</title>
<desc id="dev-loops-desc">The external change planner maps changed paths or selected components to verification scopes and affected image targets. Native client work follows host validation, scoped shared debug Cargo, complete app packaging and explicit GUI or fixture review. Web source uses mounted app and package files with HMR and affected browser checks. Shared API and worker code uses the runtime image; the private actor index uses its separate search-index image. Dependency, Dockerfile, relay, configuration and Compose changes select the affected image or deployment loop. Image changes require explicit recreation of only the isolated owned services before affected behavior is verified. Dedicated workspace, project and ports protect the user stack while preserving existing data, useful images and reusable caches. Selected exact-revision hosted gates supply the relevant Mac and Linux platform evidence. Native app packaging and direct Docker operation are separate supported workflows.</desc>
<defs><marker id="dev-loops-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4f5d75"/></marker></defs>
<style>text{font-family:Geist,system-ui,sans-serif;fill:#2d3142}.label{font-size:20px;font-weight:600}.note{font-size:16px}.zone{font-size:13px;font-weight:600;letter-spacing:1px}.node{fill:#fff;stroke:#4f5d75}.accent{fill:#fff6ed;stroke:#eb6c36}.edge{fill:none;stroke:#4f5d75;stroke-width:2;marker-end:url(#dev-loops-arrow)}.minor{fill:#4f5d75;font-size:14px}.code{font-family:'Geist Mono',ui-monospace,monospace;font-size:14px}</style>
