<text x="960" y="448" class="note">Unselected lanes must be skipped</text>
<text x="32" y="772" class="minor">Auto: changed paths widen through dependencies. Native dispatch explicitly selects both Macs.</text>
<text x="32" y="800" class="minor">Docs/diagram-only auto changes select no runtime lane; full or unreadable comparisons widen selection.</text>
<text x="32" y="828" class="minor">The separate embedded.yml Mac engine matrix is intentionally retained until compatibility retirement passes.</text>
