<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 852" role="img" aria-labelledby="ci-scopes-title ci-scopes-desc">
<title id="ci-scopes-title">Fleetworks scoped verification</title>
<desc id="ci-scopes-desc">At an exact source SHA, the planner selects Mac desktop, Linux backend, web, Linux classifier and retained operator compatibility lanes from changed-path dependencies. Native component dispatch selects both Macs. The required aggregate fails selected missing or failed jobs. Documentation-only auto changes skip runtime lanes. The separate embedded macOS compatibility matrix remains until its retirement gates pass. This is workflow structure, not evidence that any run passed.</desc>
<defs><marker id="ci-scopes-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4f5d75"/></marker></defs>
<style>text{font-family:Geist,system-ui,sans-serif;fill:#2d3142}.heading{font-family:'Instrument Serif',Georgia,serif;font-size:28px}.label{font-size:20px;font-weight:600}.note{font-size:16px}.code{font:14px 'Geist Mono',ui-monospace,monospace}.zone{font-size:13px;font-weight:600;letter-spacing:1px}.minor{font-size:14px;fill:#4f5d75}.node,.pending{fill:#fff;stroke:#4f5d75;stroke-width:1.5}.accent{fill:#fff6ed;stroke:#eb6c36;stroke-width:1.5}.pending{stroke-dasharray:6 4}.edge,.later,.flow{fill:none;stroke:#4f5d75;stroke-width:1.5}.later{stroke-dasharray:6 4}.edge,.later{marker-end:url(#ci-scopes-arrow)}</style>
