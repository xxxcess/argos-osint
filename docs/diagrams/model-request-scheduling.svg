<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="model-request-scheduling-title model-request-scheduling-desc" viewBox="0 0 900 700">
<title id="model-request-scheduling-title">Provider request scheduling</title>
<desc id="model-request-scheduling-desc">Workflow retries and direct compatibility calls converge on compilation and one process-wide FIFO pacing queue per provider before HTTP sends. Rate limits and overloads extend the provider cooldown. A stalled route falls through to the next route and an interactive wall-clock cap bounds the operation. Validation returns a result or hands failure back to the retry owner.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#4f5d75"/></marker></defs>
<rect width="900" height="700" fill="#f5f5f5"/>
<g fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)">
<path d="M264 78H336"/><path d="M452 116V168"/>
<path d="M144 116V204H336"/>
<path d="M452 240V296"/><path d="M452 408V460"/>
<path d="M568 496H672"/><path d="M762 532V584"/>
<path d="M762 460V144H592V78H568"/>
<path d="M336 496H288V352H336"/>
</g>
<rect x="24" y="40" width="240" height="76" rx="6" fill="#ffffff" stroke="#2d3142"/>
<text x="144.0" y="65" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="14" font-weight="600" fill="#2d3142">Argos model callers</text>
<text x="144.0" y="85" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="10" fill="#4f5d75">Intel · Recon · Atlas · Brain</text>
<text x="144.0" y="103" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="10" fill="#4f5d75">all models and accounts</text>
<rect x="336" y="40" width="232" height="76" rx="6" fill="#fff3eb" stroke="#eb6c36"/>
<text x="452.0" y="65" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="14" font-weight="600" fill="#2d3142">Route retry owner</text>
<text x="452.0" y="85" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="10" fill="#4f5d75">account concurrency + priority</text>
<text x="452.0" y="103" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="10" fill="#4f5d75">stall → next route · retry · stop</text>
<rect x="336" y="168" width="232" height="72" rx="6" fill="#ffffff" stroke="#2d3142"/>
<text x="452.0" y="193" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="14" font-weight="600" fill="#2d3142">Compile and authorize</text>
<text x="452.0" y="213" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="10" fill="#4f5d75">adapter + response contract</text>
<text x="452.0" y="231" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="10" fill="#4f5d75">provider output defaults</text>
<rect x="336" y="296" width="232" height="112" rx="6" fill="#fff3eb" stroke="#eb6c36"/>
<text x="452.0" y="321" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="14" font-weight="600" fill="#2d3142">Provider FIFO queues</text>
<text x="452.0" y="341" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="10" fill="#4f5d75">OpenRouter 20 RPM / 3s</text>
<text x="452.0" y="359" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="10" fill="#4f5d75">Google 10 RPM / 6s</text>
<text x="452.0" y="377" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="10" fill="#4f5d75">Nvidia 40 RPM / 1.5s</text>
<text x="452.0" y="395" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="10" fill="#4f5d75">independent clocks; no bursts</text>
<rect x="336" y="460" width="232" height="72" rx="6" fill="#ffffff" stroke="#2d3142"/>
<text x="452.0" y="485" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="14" font-weight="600" fill="#2d3142">One HTTP send</text>
<text x="452.0" y="505" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="10" fill="#4f5d75">stream · chat · Decisions</text>
<text x="452.0" y="523" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="10" fill="#4f5d75">wire deadlines start here</text>
<rect x="672" y="460" width="180" height="72" rx="6" fill="#ffffff" stroke="#2d3142"/>
<text x="762.0" y="485" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="14" font-weight="600" fill="#2d3142">Validate response</text>
<text x="762.0" y="505" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="10" fill="#4f5d75">schema + evidence</text>
<text x="762.0" y="523" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="10" fill="#4f5d75">failure → retry owner</text>
<rect x="672" y="584" width="180" height="60" rx="6" fill="#ffffff" stroke="#2d3142"/>
<text x="762.0" y="609" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="14" font-weight="600" fill="#2d3142">Return valid result</text>
<text x="762.0" y="629" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="10" fill="#4f5d75">publish behind task fence</text>
<text x="80" y="188" font-family="Geist,system-ui,sans-serif" font-size="11" fill="#4f5d75">direct compatibility calls</text>
<text x="30" y="388" font-family="Geist,system-ui,sans-serif" font-size="11" fill="#4f5d75">429 / 503 / stream error</text>
<text x="44" y="407" font-family="Geist,system-ui,sans-serif" font-size="11" fill="#4f5d75">extend provider cooldown</text>
<text x="612" y="169" font-family="Geist,system-ui,sans-serif" font-size="11" fill="#4f5d75">failure</text>
<text x="612" y="187" font-family="Geist,system-ui,sans-serif" font-size="11" fill="#4f5d75">retry / fallback</text>
<text x="588" y="487" font-family="Geist,system-ui,sans-serif" font-size="11" fill="#4f5d75">response</text>
<text x="24" y="670" font-family="Geist,system-ui,sans-serif" font-size="12" fill="#4f5d75">Queue waits are cancellable. Retry-After extends pacing; exhausted or terminal routes return an error.</text>
<text x="24" y="650" font-family="Geist,system-ui,sans-serif" font-size="12" fill="#4f5d75">Interactive operations carry a wall-clock cap (600s; 900s thinking) over queue, pacing, backoff and attempts; a stall skips to the next route.</text>
<text x="24" y="690" font-family="Geist,system-ui,sans-serif" font-size="12" fill="#4f5d75">Process-local policy; external traffic, token/day quotas and provider outages remain outside this clock.</text>
</svg>
