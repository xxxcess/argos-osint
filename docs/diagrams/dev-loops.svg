<text x="436" y="166" class="note">Host checks → shared debug → .app / manifest</text>
<text x="436" y="194" class="note">Explicit open or selected same-view fixture</text>

<rect x="420" y="264" width="444" height="112" rx="6" class="node"/>
<text x="436" y="296" class="label">Web source: HMR + affected checks</text>
<text x="436" y="326" class="note">Mounted app / package source; browser live reload</text>
<text x="436" y="354" class="note">Relay / config / dependency inputs may rebuild</text>

<rect x="420" y="424" width="444" height="112" rx="6" class="node"/>
<text x="436" y="456" class="label">Shared runtime image</text>
<text x="436" y="486" class="note">API / private services / durable workers</text>
<text x="436" y="514" class="note">Focused host checks, then build the changed image</text>

