<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OSINT catalog</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; }
    html,body { margin:0; background:var(--paper); color:var(--ink); font-family:Geist,system-ui,sans-serif; }
    main { max-width:920px; margin:0 auto; padding:40px 24px 64px; }
    .eyebrow { font-family:"Geist Mono",ui-monospace,monospace; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
    h1 { font-family:"Instrument Serif",serif; font-weight:400; font-size:1.75rem; margin:.4rem 0 .5rem; }
    p.lede { color:var(--muted); max-width:40rem; margin:0 0 1.25rem; font-size:15px; line-height:1.5; }
    .frame { overflow-x:auto; }
    svg { min-width:800px; display:block; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Nested</div>
    <h1>OSINT catalog</h1>
    <p class="lede">Firecrawl, SociaVault, and Hunter are primary. Gap-fillers never feed Hunter. Context tools (news, legal) run only when the prompt asks for them.</p>
    <div class="frame">
      <svg role="img" aria-labelledby="osint-providers-title osint-providers-desc" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
        <title id="osint-providers-title">OSINT catalog</title>
        <desc id="osint-providers-desc">Firecrawl, SociaVault, and Hunter are primary. Gap-fillers never feed Hunter. Context tools (news, legal) run only when the prompt asks for them.</desc>

        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="800" height="300" fill="#f5f5f5"/>

        <rect x="40" y="28" width="720" height="236" rx="8" fill="rgba(45,49,66,0.015)" stroke="rgba(45,49,66,0.30)"/>
        <rect x="48" y="20" width="88" height="16" fill="#f5f5f5"/>
        <text x="56" y="32" font-family="Geist Mono,ui-monospace,monospace" font-size="8" letter-spacing="0.14em" fill="#7a8399">CATALOG</text>
        <rect x="72" y="56" width="656" height="120" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <rect x="80" y="48" width="72" height="16" fill="#f5f5f5"/>
        <text x="88" y="60" font-family="Geist Mono,ui-monospace,monospace" font-size="8" letter-spacing="0.14em" fill="#eb6c36">PRIMARY</text>
        <text x="180" y="108" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">Firecrawl</text>
        <text x="180" y="126" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">search · scrape</text>
        <text x="400" y="108" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">SociaVault</text>
        <text x="400" y="126" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">profiles · search</text>
        <text x="620" y="108" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">Hunter</text>
        <text x="620" y="126" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">prompt / primary only</text>
        <text x="220" y="220" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">Gap-fillers</text>
        <text x="220" y="238" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">DNS · RDAP · archives</text>
        <text x="560" y="220" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">Context</text>
        <text x="560" y="238" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">NewsAPI · CourtListener</text>

      </svg>
    </div>
  </main>
</body>
</html>
