name: Fleetworks

# Scoped checks share one event-head planner. Backend engines stay in Linux
# lanes; Rune Mac lanes build only the native client.
on:
  push:
    branches: [dev, nightly, main]
  pull_request:
    branches: [dev, nightly, main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      mode:
        description: Run every hosted check or compare an exact base
        type: choice
        options: [full, pr]
        default: full
      base:
        description: Exact comparison commit for pr mode
        type: string
      head:
        description: Expected checked-out commit for an exact dispatch
        type: string
      components:
        description: Explicit native selects both Mac apps; auto uses the shared change planner
        type: choice
        options: [auto, native, backend, all]
        default: auto

permissions:
  contents: read
  actions: read

concurrency:
  group: fleetworks-${{ github.event_name }}-${{ github.event_name == 'push' && github.ref != 'refs/heads/nightly' && 'stable' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  FLEETWORKS_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  scope:
    name: Select verification scopes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      head: ${{ steps.release.outputs.head }}
      desktop: ${{ steps.release.outputs.desktop }}
      server: ${{ steps.release.outputs.server }}
      compose: ${{ steps.release.outputs.compose }}
      queue: ${{ steps.release.outputs.queue }}
      storage: ${{ steps.release.outputs.storage }}
      bert: ${{ steps.release.outputs.bert }}
      web: ${{ steps.release.outputs.web }}
      web_dev: ${{ steps.release.outputs.web_dev }}
      images: ${{ steps.release.outputs.images }}
      image_targets: ${{ steps.release.outputs.image_targets }}
      image_arch_json: ${{ steps.release.outputs.image_arch_json }}
      full: ${{ steps.release.outputs.full }}
      publish: ${{ steps.release.outputs.publish }}
      release_version: ${{ steps.release.outputs.version }}
      release_tag: ${{ steps.release.outputs.tag }}
      release_image_tag: ${{ steps.release.outputs.image_tag }}
      release_plan: ${{ steps.release.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.FLEETWORKS_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check documentation and repository policy
        run: |
          python3 scripts/fleetworks_doc_links.py
          node scripts/release_check.mjs versions
          node scripts/release_check.mjs event
          node --test .opencode/tests/*.test.mjs
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Classify changes at the event head
        id: plan
        env:
          FLEETWORKS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_BASE: ${{ inputs.base }}
          DISPATCH_HEAD: ${{ inputs.head }}
          DISPATCH_COMPONENTS: ${{ inputs.components }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$DISPATCH_HEAD" && "$DISPATCH_HEAD" != "$FLEETWORKS_HEAD" ]]; then
            echo '::error::Dispatch ref moved away from the requested revision'
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "${DISPATCH_COMPONENTS:-auto}" != auto ]]; then
            if [[ ! "$DISPATCH_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
              echo '::error::Explicit component dispatch requires an exact expected head SHA'
              exit 1
            fi
          fi
          python3 -B -m unittest discover -s scripts -p 'test_fleetworks_*.py'
          mode=pr
          event="$GITHUB_EVENT_NAME"
          base="$FLEETWORKS_BASE"
          if [[ "$event" == schedule || ( "$event" == workflow_dispatch && "$DISPATCH_MODE" != pr ) ]]; then
            mode=full
          elif [[ "$event" == workflow_dispatch ]]; then
            if [[ ! "$DISPATCH_BASE" =~ ^[0-9a-f]{40}$ || "$DISPATCH_BASE" =~ ^0+$ ]]; then
              echo '::error::Scoped dispatch requires an exact comparison SHA'
              exit 1
            fi
            event=pull_request
            base="$DISPATCH_BASE"
          fi
          python3 scripts/fleetworks_verify.py "$mode" \
            --event "$event" --base "$base" \
            --head "$FLEETWORKS_HEAD" --components "${DISPATCH_COMPONENTS:-auto}" \
            --github-output "$GITHUB_OUTPUT" --json-output "$RUNNER_TEMP/scope.json"
          printf 'head=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Plan source-scoped branch publication
        id: release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          temporary = Path(os.environ["RUNNER_TEMP"])
          scope = json.loads((temporary / "scope.json").read_text())
          # A scoped manual dispatch compares like a PR, but cannot publish.
          scope["event"] = os.environ["GITHUB_EVENT_NAME"]
          (temporary / "release-scope.json").write_text(json.dumps(scope))
          subprocess.run([sys.executable, "scripts/fleetworks_release.py", "plan",
              "--event", scope["event"], "--ref", os.environ["GITHUB_REF"],
              "--head", os.environ["FLEETWORKS_HEAD"], "--base", scope["base"] or "",
              "--scope-plan", str(temporary / "release-scope.json"),
              "--json-output", str(temporary / "release.json"),
              "--github-output", os.environ["GITHUB_OUTPUT"]], check=True)
          plan = json.loads((temporary / "release.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("plan=" + json.dumps(plan, separators=(",", ":")), file=output)
          PY

  desktop:
    name: Mac app / ${{ matrix.target }}
    needs: scope
    if: needs.scope.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
    uses: ./.github/workflows/fleetworks-native.yml
    with:
      expected-head: ${{ needs.scope.outputs.head }}
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}
      release-version: ${{ needs.scope.outputs.publish == 'true' && needs.scope.outputs.release_version || '' }}

  embedded:
    name: Affected embedded storage / Linux AMD64 and ARM64
    needs: scope
    if: needs.scope.outputs.storage == 'true'
    uses: ./.github/workflows/embedded.yml
    with:
      head: ${{ needs.scope.outputs.head }}

  server:
    name: Backend suite / Linux ${{ matrix.arch }}
    needs: scope
    if: needs.scope.outputs.server == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            machine: x86_64
            target: x86_64-unknown-linux-gnu
            executable: 'ELF 64-bit.*x86-64'
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
            target: aarch64-unknown-linux-gnu
            executable: 'ELF 64-bit.*(aarch64|ARM aarch64)'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      EXPECTED_MACHINE: ${{ matrix.machine }}
      EXPECTED_TARGET: ${{ matrix.target }}
      EXPECTED_EXECUTABLE: ${{ matrix.executable }}
      REVIEW_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.FLEETWORKS_HEAD }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Install libclang for the embedded delivery queue
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Resolve pinned isolated datastore before API tests
        id: surreal
        shell: bash
        run: |
          set -euo pipefail
          binary="$(python3 scripts/test_surreal.py --mode server --fetch-only |
            sed -n 's/^test-surreal: server binary //p')"
          test -x "$binary"
          printf 'binary=%s\n' "$binary" >> "$GITHUB_OUTPUT"
          printf 'ARGOS_SURREAL_BIN=%s\nARGOS_SURREAL_MODE=server\nARGOS_SURREAL_REQUIRED=1\n' "$binary" >> "$GITHUB_ENV"
      - name: Check, build, and test the backend
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FLEETWORKS_HEAD"
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_TARGET"
          rustc --version | grep -q '^rustc 1\.95\.0 '
          cargo fmt --all -- --check
          features=(--no-default-features --features server,nlp,classifier)
          python3 scripts/fleetworks_verify.py timed --phase server-check -- \
            python3 scripts/agent_cargo.py check --timings --locked -p argos-api-host "${features[@]}"
          python3 scripts/fleetworks_verify.py timed --phase server-build -- \
            python3 scripts/agent_cargo.py build --timings --locked -p argos-api-host --bin argos-api-host "${features[@]}"
          file target/agents/debug/argos-api-host | grep -Ei "$EXPECTED_EXECUTABLE"
          python3 scripts/fleetworks_verify.py timed --phase server-test -- \
            python3 scripts/agent_cargo.py test --timings --locked -p argos-api-host -p argos-osint-api \
              "${features[@]}" --bin argos-api-host --lib
          verify_core_tests() {
            local phase="$1" filter="$2" log
            log="$RUNNER_TEMP/fleetworks-$phase.log"
            python3 scripts/fleetworks_verify.py timed --phase "$phase" -- \
              python3 scripts/agent_cargo.py test --timings --locked -p argos-osint-core \
                "${features[@]}" --features fixtures --lib "$filter" | tee "$log"
            if ! grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored' "$log"; then
              echo "::error::The required $filter tests did not pass"
              exit 1
            fi
          }
          verify_core_tests execution-transport-test provider_attempt::remote::tests
          verify_core_tests config-commit-test config_commit::tests
      - name: Exercise bootstrap and network service roles on loopback
        shell: bash
        run: |
          set -euo pipefail
          test -x "$ARGOS_SURREAL_BIN"
          python3 scripts/fleetworks_verify.py timed --phase network-smoke -- \
            python3 scripts/fleetworks_network_smoke.py --host target/agents/debug/argos-api-host --surreal "$ARGOS_SURREAL_BIN"
      - name: Run pinned disk storage contracts
        if: needs.scope.outputs.full == 'true'
        env:
          SURREAL_BIN: ${{ steps.surreal.outputs.binary }}
        run: |
          python3 scripts/fleetworks_verify.py timed --phase storage-contracts -- \
            python3 scripts/test_surreal.py --mode server --bin "$SURREAL_BIN" --timings
      - name: Test affected storage and brief recovery contracts
        if: needs.scope.outputs.storage == 'true' && needs.scope.outputs.full != 'true'
        env:
          ARGOS_SURREAL_MODE: server
          ARGOS_SURREAL_REQUIRED: "1"
          ARGOS_SURREAL_BIN: ${{ steps.surreal.outputs.binary }}
        shell: bash
        run: |
          set -euo pipefail
          unset SURREAL_USER SURREAL_PASS
          test -x "$ARGOS_SURREAL_BIN"
          python3 scripts/fleetworks_verify.py timed --phase storage-affected -- \
            python3 scripts/agent_cargo.py test --timings --locked -p argos-osint-core \
              --no-default-features --features server,nlp,classifier,fixtures \
              --test storage_contracts --test storage_jobs --test storage_brief --test storage_brief_publish \
              --test storage_provider_pacer --test storage_provider_account --test storage_credits \
              --test storage_actor_catalog --test storage_atlas_delete
      - name: Test shared Atlas provider quota reservations
        if: needs.scope.outputs.queue == 'true' && needs.scope.outputs.full != 'true'
        env:
          ARGOS_SURREAL_MODE: server
          ARGOS_SURREAL_REQUIRED: "1"
          ARGOS_SURREAL_BIN: ${{ steps.surreal.outputs.binary }}
        shell: bash
        run: |
          set -euo pipefail
          unset SURREAL_USER SURREAL_PASS
          test -x "$ARGOS_SURREAL_BIN"
          log="$RUNNER_TEMP/fleetworks-atlas-quota-test.log"
          python3 scripts/agent_cargo.py test --locked -p argos-osint-core \
            --no-default-features --features server,nlp,classifier,fixtures --test storage_atlas \
            quota_reservations_share_daily_account_caps -- --exact --nocapture | tee "$log"
          if ! grep -Fq 'test result: ok. 1 passed; 0 failed; 0 ignored' "$log"; then
            echo '::error::The required Atlas quota reservation test did not pass'
            exit 1
          fi
      - name: Exercise SQLite jobs and embedded queue dispatch
        if: needs.scope.outputs.queue == 'true'
        timeout-minutes: 12
        env:
          SURREAL_BIN: ${{ steps.surreal.outputs.binary }}
        shell: bash
        run: |
          set -euo pipefail
          # Keep the server feature graph: a Jobs-only selection rebuilds RocksDB's C++ archive.
          python3 scripts/agent_cargo.py test --locked -p argos-api-host -p fleetworks-jobs \
            --no-default-features --features server,nlp,classifier
          python3 scripts/fleetworks_verify.py timed --phase queue-smoke -- \
            python3 scripts/fleetworks_atlas_smoke.py \
              --host target/agents/debug/argos-api-host --surreal "$SURREAL_BIN"
      - name: Validate scoped standalone Compose and optional overlays
        shell: bash
        run: |
          set -euo pipefail
          review="config-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$REVIEW_ARCH"
          python3 deploy/native_review.py init --name "$review" --api-port 18091 --web-port 18092 --platform "linux/$REVIEW_ARCH"
          workspace="$(python3 deploy/native_review.py value --name "$review" --field workspace)"
          base=(docker compose --env-file "$workspace/compose.env" -f deploy/compose.native-review.yml)
          "${base[@]}" config --quiet
          "${base[@]}" -f deploy/compose.yml config --quiet
          "${base[@]}" -f deploy/compose.yml -f deploy/compose.dev.yml config --quiet
          "${base[@]}" -f deploy/compose.atlas.yml config --quiet
      - name: Retain server phase timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fleetworks-server-timings-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/fleetworks-timings.jsonl
            target/agents/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7

  images:
    name: Image checks / Linux ${{ matrix.arch }}
    needs: scope
    if: needs.scope.outputs.images == 'true' && needs.scope.outputs.publish != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.scope.outputs.head }}
          persist-credentials: false
          lfs: false
      - name: Test selected private search contracts
        if: contains(needs.scope.outputs.image_targets, 'search-index')
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          python3 scripts/agent_cargo.py test --locked --no-default-features -p fleetworks-search-index
      - name: Build selected image closure and smoke exact container IDs
        env:
          IMAGE_TARGETS: ${{ needs.scope.outputs.image_targets }}
          IMAGE_ARCH: ${{ matrix.arch }}
          OWNER: ${{ github.repository_owner }}
          COMPOSE_SELECTED: ${{ needs.scope.outputs.compose }}
        shell: bash
        run: |
          set -euo pipefail
          compose=()
          if [[ "$COMPOSE_SELECTED" == true ]]; then compose=(--compose); fi
          python3 -B -m unittest discover -s deploy -p 'test_*.py'
          python3 .github/scripts/release_images.py --revision "$FLEETWORKS_HEAD" \
            --version "$(cat version.txt)" --image-tag "review-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --targets "$IMAGE_TARGETS" --arch "$IMAGE_ARCH" --registry "ghcr.io/${OWNER,,}" \
            --directory "$RUNNER_TEMP/image-checks" "${compose[@]}"
      - name: Retain exact image smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fleetworks-image-checks-${{ matrix.arch }}-${{ github.run_id }}.${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/image-checks/*.json
            .agent-scratch/native-review/images-*/public-smoke-*.json
          if-no-files-found: ignore
          retention-days: 7

  compose:
    name: Packaged Compose / ${{ matrix.name }}
    needs: scope
    if: needs.scope.outputs.compose == 'true' && needs.scope.outputs.images != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AMD64
            runner: ubuntu-24.04
            arch: amd64
            machine: x86_64
            executable: 'ELF 64-bit.*x86-64'
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            arch: arm64
            machine: aarch64
            executable: 'ELF 64-bit.*(aarch64|ARM aarch64)'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.FLEETWORKS_HEAD }}
          persist-credentials: false
      - name: Exercise standalone packaged backend and selected Web
        env:
          REVIEW_ARCH: ${{ matrix.arch }}
          INCLUDE_WEB: ${{ needs.scope.outputs.web }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FLEETWORKS_HEAD"
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          test "$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')" = "linux/$REVIEW_ARCH"
          python3 -B -m unittest discover -s deploy -p 'test_*.py'
          web=()
          if [[ "$INCLUDE_WEB" == true ]]; then web=(--web); fi
          python3 scripts/fleetworks_verify.py timed --phase compose-build-and-smoke -- \
            python3 deploy/verify.py --name "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$REVIEW_ARCH" \
              --platform "linux/$REVIEW_ARCH" "${web[@]}" --atlas --source-journey
      - name: Exercise packaged development Web readiness
        if: needs.scope.outputs.full == 'true' && needs.scope.outputs.web_dev == 'true' && matrix.arch == 'amd64'
        run: |
          python3 scripts/fleetworks_verify.py timed --phase compose-dev-smoke -- \
            python3 deploy/verify.py --name "dev-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --platform linux/amd64 --web --dev
      - name: Retain Compose phase timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fleetworks-compose-timings-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/fleetworks-timings.jsonl
            .agent-scratch/native-review/ci-*/public-smoke-*.json
          if-no-files-found: ignore
          retention-days: 7

  bert:
    name: Atlas BERT runtime / Linux AMD64 and ARM64
    needs: scope
    if: needs.scope.outputs.bert == 'true'
    uses: ./.github/workflows/atlas-bert.yml
    with:
      head: ${{ github.event.pull_request.head.sha || github.sha }}

  web:
    name: Scoped web
    needs: scope
    if: needs.scope.outputs.web == 'true'
    uses: ./.github/workflows/intel-web.yml
    with:
      head: ${{ github.event.pull_request.head.sha || github.sha }}
      development: ${{ needs.scope.outputs.web_dev == 'true' }}

  source_checks:
    name: Fleetworks source checks
    needs: [scope, desktop, server, embedded, compose, bert, web, images]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require success for every selected scope
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          DESKTOP_SELECTED: ${{ needs.scope.outputs.desktop }}
          SERVER_SELECTED: ${{ needs.scope.outputs.server }}
          COMPOSE_SELECTED: ${{ needs.scope.outputs.compose == 'true' && needs.scope.outputs.images != 'true' }}
          BERT_SELECTED: ${{ needs.scope.outputs.bert }}
          WEB_SELECTED: ${{ needs.scope.outputs.web }}
          WEB_DEV_SELECTED: ${{ needs.scope.outputs.web_dev }}
          IMAGES_SELECTED: ${{ needs.scope.outputs.images == 'true' && needs.scope.outputs.publish != 'true' }}
          RELEASE_IMAGES_SELECTED: ${{ needs.scope.outputs.images == 'true' && needs.scope.outputs.publish == 'true' }}
          IMAGE_TARGETS: ${{ needs.scope.outputs.image_targets }}
          QUEUE_SELECTED: ${{ needs.scope.outputs.queue }}
          STORAGE_SELECTED: ${{ needs.scope.outputs.storage }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          SERVER_RESULT: ${{ needs.server.result }}
          EMBEDDED_RESULT: ${{ needs.embedded.result }}
          COMPOSE_RESULT: ${{ needs.compose.result }}
          BERT_RESULT: ${{ needs.bert.result }}
          WEB_RESULT: ${{ needs.web.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'Fleetworks revision `%s`\n\n' "$FLEETWORKS_HEAD" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$SCOPE_RESULT" != success ]]; then
            echo "::error::Scope planning finished with $SCOPE_RESULT"
            printf 'Scope planning: %s\n' "${SCOPE_RESULT:-missing}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          verify() {
            printf '%s: selected=%s result=%s\n' "$1" "${2:-missing}" "${3:-missing}" >> "$GITHUB_STEP_SUMMARY"
            case "$2:$3" in
              true:success|false:skipped) ;;
              *) echo "::error::$1 selected=${2:-missing} result=${3:-missing}"; return 1 ;;
            esac
          }
          failed=0
          for value in "$QUEUE_SELECTED" "$STORAGE_SELECTED"; do
            case "$value:$SERVER_SELECTED" in
              true:true|false:true|false:false) ;;
              *) echo '::error::Queue and storage scopes need the server gate'; failed=1 ;;
            esac
          done
          case "$WEB_DEV_SELECTED:$WEB_SELECTED" in
            true:true|false:true|false:false) ;;
            *) echo '::error::Development browser scope needs the web gate'; failed=1 ;;
          esac
          verify desktop "$DESKTOP_SELECTED" "$DESKTOP_RESULT" || failed=1
          verify server "$SERVER_SELECTED" "$SERVER_RESULT" || failed=1
          verify embedded "$STORAGE_SELECTED" "$EMBEDDED_RESULT" || failed=1
          verify compose "$COMPOSE_SELECTED" "$COMPOSE_RESULT" || failed=1
          verify bert "$BERT_SELECTED" "$BERT_RESULT" || failed=1
          verify web "$WEB_SELECTED" "$WEB_RESULT" || failed=1
          verify images "$IMAGES_SELECTED" "$IMAGES_RESULT" || failed=1
          printf 'Server images: %s\n' "${IMAGE_TARGETS:-none}" >> "$GITHUB_STEP_SUMMARY"
          printf 'Queue selected: %s. Storage selected: %s. Development browser selected: %s.\n' \
            "${QUEUE_SELECTED:-missing}" "${STORAGE_SELECTED:-missing}" \
            "${WEB_DEV_SELECTED:-missing}" >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"

  release_images:
    name: Verified release image staging
    needs: [scope, source_checks]
    if: needs.source_checks.result == 'success' && needs.scope.outputs.publish == 'true' && needs.scope.outputs.images == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/fleetworks-release-images.yml
    with:
      head: ${{ needs.scope.outputs.head }}
      version: ${{ needs.scope.outputs.release_version }}
      image-tag: ${{ needs.scope.outputs.release_image_tag }}
      image-targets: ${{ needs.scope.outputs.image_targets }}
      compose: ${{ needs.scope.outputs.compose == 'true' }}

  prepublish:
    name: Fleetworks artifact checks
    needs: [scope, source_checks, release_images]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require source checks and every selected release image
        env:
          SOURCE_RESULT: ${{ needs.source_checks.result }}
          IMAGES_SELECTED: ${{ needs.scope.outputs.publish == 'true' && needs.scope.outputs.images == 'true' }}
          IMAGE_RESULT: ${{ needs.release_images.result }}
        run: |
          test "$SOURCE_RESULT" = success
          case "$IMAGES_SELECTED:$IMAGE_RESULT" in
            true:success|false:skipped) ;;
            *) exit 1 ;;
          esac

  publish:
    name: Publish verified version and channel
    needs: [scope, prepublish]
    if: needs.prepublish.result == 'success' && needs.scope.outputs.publish == 'true' && github.event_name == 'push' && contains(fromJson('["refs/heads/dev","refs/heads/nightly","refs/heads/main"]'), github.ref)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.scope.outputs.head }}
          persist-credentials: false
      - name: Download current-run verified native archives
        if: fromJson(needs.scope.outputs.release_plan).native
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Fleetworks-app-*-${{ github.run_id }}.${{ github.run_attempt }}
          path: ${{ runner.temp }}/release
          digest-mismatch: error
      - name: Download current-run verified Linux digests
        if: needs.scope.outputs.images == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fleetworks-release-images-*-${{ github.run_id }}.${{ github.run_attempt }}
          path: ${{ runner.temp }}/release
          digest-mismatch: error
      - name: Promote only the verified source plan
        env:
          RELEASE_PLAN: ${{ needs.scope.outputs.release_plan }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          mkdir -p "$RUNNER_TEMP/release"
          printf '%s\n' "$RELEASE_PLAN" > "$RUNNER_TEMP/release-plan.json"
          python3 .github/scripts/publish_release.py --plan "$RUNNER_TEMP/release-plan.json" \
            --directory "$RUNNER_TEMP/release"

  required:
    name: Fleetworks required
    needs: [scope, prepublish, publish]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected check and publication
        env:
          CHECKS_RESULT: ${{ needs.prepublish.result }}
          PUBLISH_SELECTED: ${{ needs.scope.outputs.publish }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          test "$CHECKS_RESULT" = success
          case "$PUBLISH_SELECTED:$PUBLISH_RESULT" in
            true:success|false:skipped) ;;
            *) exit 1 ;;
          esac
