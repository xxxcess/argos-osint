<!DOCTYPE html>

<body><main><h1>Argos Topology Scope Summary</h1><div class="frame"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="topology-scope-summary-title topology-scope-summary-desc">
<title id="topology-scope-summary-title">Argos Topology Scope Summary</title>
<desc id="topology-scope-summary-desc">An accepted topology snapshot yields a scope key, graph version and an instant deterministic markdown summary. A read-only worker plans: it reuses a saved summary for the same digest, throttles churn, cools down failures, or generates through the Summarization role. Results are saved per digest; only the current digest is displayed, a late result for an old scope is saved but not shown, and failures show the shared failure card.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4f5d75"/></marker></defs>
<rect width="900" height="450" fill="#f5f5f5"/>
<g fill="none" stroke="#4f5d75" marker-end="url(#arrow)">
<path d="M200 80 H250"/><path d="M450 80 H500"/><path d="M700 80 H740"/>
<path d="M350 120 V200"/><path d="M450 245 H500"/><path d="M350 290 V340"/>
<path d="M600 290 V340" stroke-dasharray="4 3"/><path d="M450 375 H500" stroke-dasharray="4 3"/>
<path d="M700 245 H810 V120"/><path d="M350 410 V428 H810 V410" stroke-dasharray="4 3"/>
</g>
<g font-family="Geist,system-ui,sans-serif" font-size="13" fill="#2d3142" text-anchor="middle">
<text x="475" y="190" font-size="11" fill="#4f5d75">save / reuse</text>
<text x="375" y="320" font-size="11" fill="#4f5d75">Generate</text>

<text x="110.0" y="66">Accepted snapshot</text>
<text x="110.0" y="86" font-size="11">seed · depth · cycle · filters</text>
<text x="110.0" y="104" font-size="11" fill="#4f5d75">recenter = new seed key</text>
<rect x="250" y="40" width="200" height="80" rx="6" fill="#fff" stroke="#2d3142"/>
<text x="350.0" y="66">Scope key + graph version</text>
<text x="350.0" y="86" font-size="11">content hashes of visible scope</text>
<text x="350.0" y="104" font-size="11" fill="#4f5d75">digest adds model + prompt</text>
<rect x="500" y="40" width="200" height="80" rx="6" fill="#fff4ee" stroke="#eb6c36"/>
<text x="600.0" y="66">Deterministic markdown</text>
<text x="600.0" y="86" font-size="11">pure · instant · no-model fallback</text>
<text x="600.0" y="104" font-size="11" fill="#4f5d75">In scope · Connections · Caveats</text>
<rect x="740" y="40" width="140" height="80" rx="6" fill="#fff" stroke="#2d3142"/>
<text x="810.0" y="66">Scope summary</text>
<text x="810.0" y="86" font-size="11">panel / Summary page</text>
<text x="810.0" y="104" font-size="11" fill="#4f5d75">scrolls independently</text>
<rect x="250" y="200" width="200" height="90" rx="6" fill="#fff" stroke="#2d3142"/>
<text x="350.0" y="226">Plan (read-only worker)</text>
<text x="350.0" y="246" font-size="11">reuse exact digest ≤ 7 days</text>
<text x="350.0" y="264" font-size="11" fill="#4f5d75">throttle 10 min · cooldown 2 min</text>
<rect x="500" y="200" width="200" height="90" rx="6" fill="#fff4ee" stroke="#eb6c36"/>
<text x="600.0" y="226">topology_scope_summaries</text>
