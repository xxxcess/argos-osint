name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded pushes to the same PR cancel the older run (main always completes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No debuginfo in CI: smaller target dirs (cache fits the 10 GB repo quota),
  # faster codegen/link, and cc builds librocksdb without -g.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  build:
    name: ${{ matrix.platform.name }} / ${{ matrix.storage }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: Linux x86_64, os: ubuntu-24.04 }
          - { name: Linux aarch64, os: ubuntu-24.04-arm }
          - { name: macOS arm64, os: macos-14 }
          - { name: macOS Intel, os: macos-15-intel }
        storage: [embedded, server]
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - uses: rui314/setup-mold@v1
        if: runner.os == 'Linux'
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache per OS x storage leg: embedded and server compile different feature sets.
          key: ${{ matrix.storage }}
          cache-on-failure: true
      - name: Show which protoc the build will use
        run: |
          uname -sm
          cargo fetch --locked
          tools/protoc --version

      # ---- Embedded legs: exactly what a local `cargo` build runs (default features = embedded RocksDB).
      - name: Install libclang (RocksDB bindgen)
        if: runner.os == 'Linux' && matrix.storage == 'embedded'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      # Same entry point as a local run: default-feature clippy, full cargo test, embedded contracts.
      - name: Local matrix leg (embedded)
        if: matrix.storage == 'embedded'
        run: bash scripts/local_matrix.sh --storage embedded

      # ---- Server legs: network client only, against a real pinned SurrealDB 3.3.4 server.
      - name: Pinned SurrealDB hashes match design.md
        if: matrix.storage == 'server'
        shell: bash
        run: |
          set -euo pipefail
          hashes=$(grep -oE '"[0-9a-f]{64}"' scripts/test_surreal.py | tr -d '"' | sort -u)
          test "$(echo "$hashes" | wc -l)" -eq 4
          for h in $hashes; do
            grep -q "$h" .planning/2026-10-22-surrealdb/design.md || { echo "hash $h not in design.md"; exit 1; }
          done
      - name: Cache SurrealDB 3.3.4 server binary
        if: matrix.storage == 'server'
        uses: actions/cache@v4
        with:
          path: ~/.cache/argos-surreal
          key: surreal-3.3.4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/test_surreal.py') }}
      - name: Install SurrealDB 3.3.4 server (SHA-256 verified)
        if: matrix.storage == 'server'
        run: python3 scripts/test_surreal.py --mode server --fetch-only
      # Same entry point as a local run: server-feature clippy + server contracts (no full unit tests).
      - name: Local matrix leg (server)
        if: matrix.storage == 'server'
        shell: bash
        run: |
          set -euo pipefail
          bin=$(find ~/.cache/argos-surreal -path '*3.3.4-*' -type f -name surreal | head -n1)
          test -x "$bin" || { echo "fetched SurrealDB binary not found"; exit 1; }
          bash scripts/local_matrix.sh --storage server --surreal-bin "$bin"
