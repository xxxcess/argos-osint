name: Package and verify one Fleetworks target

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      runner:
        type: string
        required: true
      expected-head:
        type: string
        required: true

permissions:
  contents: read

env:
  CANDIDATE_TARGET: ${{ inputs.target }}
  EXPECTED_HEAD: ${{ inputs.expected-head }}
  FLEETWORKS_HEAD: ${{ github.sha }}

jobs:
  package:
    name: Build and package
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - name: Require requested revision
        shell: bash
        run: test "$EXPECTED_HEAD" = "$FLEETWORKS_HEAD"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Build locked native release binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FLEETWORKS_HEAD"
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$CANDIDATE_TARGET"
          rustc --version | grep -q '^rustc 1\.95\.0 '
          node scripts/release_check.mjs versions
          python3 scripts/agent_cargo.py build --locked --release --bins -p fleetworks-venture -p fleetworks-cli
      - name: Write archive, commit manifest and checksums
        id: package
        run: |
          python3 scripts/fleetworks_candidate.py pack \
            --directory "$RUNNER_TEMP/fleetworks-candidate" --binaries target/agents/release \
            --revision "$FLEETWORKS_HEAD" --target "$CANDIDATE_TARGET" --github-output "$GITHUB_OUTPUT"
      - name: Upload immutable candidate
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fleetworks-cli-${{ inputs.target }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fleetworks-candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  verify:
    name: Verify downloaded binaries
    needs: package
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact package identity
        env:
          ARTIFACT_ID: ${{ needs.package.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FLEETWORKS_HEAD"
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
      - name: Download the package job's artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: ${{ runner.temp }}/fleetworks-candidate
          digest-mismatch: error
      - name: Verify archive and execute extracted clients
        env:
          CANDIDATE_SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          python3 scripts/fleetworks_candidate.py verify \
            --directory "$RUNNER_TEMP/fleetworks-candidate" --revision "$FLEETWORKS_HEAD" \
            --target "$CANDIDATE_TARGET" --sha256 "$CANDIDATE_SHA256"

  package_images:
    name: Build and export native images
    if: endsWith(inputs.target, '-linux-gnu')
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 65
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      manifest-sha256: ${{ steps.package.outputs.manifest-sha256 }}
    steps:
      - name: Require requested revision
        run: test "$EXPECTED_HEAD" = "$FLEETWORKS_HEAD"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build and export only production images
        id: package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FLEETWORKS_HEAD"
          python3 scripts/fleetworks_candidate_images.py pack \
            --directory "$RUNNER_TEMP/fleetworks-image-candidate" \
            --revision "$FLEETWORKS_HEAD" --target "$CANDIDATE_TARGET" --github-output "$GITHUB_OUTPUT"
      - name: Upload immutable image candidate
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fleetworks-images-${{ inputs.target }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fleetworks-image-candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  verify_images:
    name: Smoke downloaded image IDs
    if: endsWith(inputs.target, '-linux-gnu')
    needs: [package, package_images]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require both exact artifact IDs
        env:
          CLI_ARTIFACT_ID: ${{ needs.package.outputs.artifact-id }}
          IMAGE_ARTIFACT_ID: ${{ needs.package_images.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FLEETWORKS_HEAD"
          [[ "$CLI_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$IMAGE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
      - name: Download the exact Venture and CLI bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: ${{ runner.temp }}/fleetworks-candidate
          digest-mismatch: error
      - name: Download the exact image archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package_images.outputs.artifact-id }}
          path: ${{ runner.temp }}/fleetworks-image-candidate
          digest-mismatch: error
      - name: Resolve pinned SurrealDB for host and external storage checks
        if: inputs.target == 'x86_64-unknown-linux-gnu'
        id: surreal
        shell: bash
        run: |
          set -euo pipefail
          binary="$(python3 scripts/test_surreal.py --mode server --fetch-only |
            sed -n 's/^test-surreal: server binary //p')"
          test -x "$binary"
          printf 'binary=%s\n' "$binary" >> "$GITHUB_OUTPUT"
      - name: Verify archive identities and run Venture without builds or pulls
        env:
          CLI_SHA256: ${{ needs.package.outputs.sha256 }}
          MANIFEST_SHA256: ${{ needs.package_images.outputs.manifest-sha256 }}
          SURREAL_BIN: ${{ steps.surreal.outputs.binary }}
        shell: bash
        run: |
          set -euo pipefail
          host_checks=()
          if [[ "$CANDIDATE_TARGET" == x86_64-unknown-linux-gnu ]]; then
            test -x "$SURREAL_BIN"
            host_checks=(--surreal "$SURREAL_BIN")
          fi
          python3 scripts/fleetworks_candidate_images.py verify \
            --directory "$RUNNER_TEMP/fleetworks-image-candidate" --manifest-sha256 "$MANIFEST_SHA256" \
            --cli-directory "$RUNNER_TEMP/fleetworks-candidate" --cli-sha256 "$CLI_SHA256" \
            --revision "$FLEETWORKS_HEAD" --target "$CANDIDATE_TARGET" "${host_checks[@]}"
