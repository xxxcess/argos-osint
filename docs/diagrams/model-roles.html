<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Models and roles</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; }
    html,body { margin:0; background:var(--paper); color:var(--ink); font-family:Geist,system-ui,sans-serif; }
    main { max-width:920px; margin:0 auto; padding:40px 24px 64px; }
    .eyebrow { font-family:"Geist Mono",ui-monospace,monospace; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
    h1 { font-family:"Instrument Serif",serif; font-weight:400; font-size:1.75rem; margin:.4rem 0 .5rem; }
    p.lede { color:var(--muted); max-width:40rem; margin:0 0 1.25rem; font-size:15px; line-height:1.5; }
    .frame { overflow-x:auto; }
    svg { min-width:800px; display:block; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Architecture</div>
    <h1>Models and roles</h1>
    <p class="lede">auth.json holds accounts. config.toml holds independent role assignments. Saving a key never writes a default. Legacy Grok and OpenAI stay until the user reassigns them.</p>
    <div class="frame">
      <svg role="img" aria-labelledby="model-roles-title model-roles-desc" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
        <title id="model-roles-title">Models and roles</title>
        <desc id="model-roles-desc">auth.json holds accounts. config.toml holds independent role assignments. Saving a key never writes a default. Legacy Grok and OpenAI stay until the user reassigns them.</desc>

        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="800" height="300" fill="#f5f5f5"/>

        <path d="M400 116 V140" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <path d="M180 116 V140" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M620 116 V140" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M180 224 V248" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M400 224 V248" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M620 224 V248" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="100" y="32" width="160" height="80" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
        <text x="180.0" y="60" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">OpenRouter</text>
        <text x="180.0" y="78" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">key + catalog</text>
        <rect x="320" y="32" width="160" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="400.0" y="60" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">Defaults</text>
        <text x="400.0" y="78" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">role selector</text>
        <rect x="540" y="32" width="160" height="80" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
        <text x="620.0" y="60" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">Google / Nvidia</text>
        <text x="620.0" y="78" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">OpenAI-compat</text>
        <rect x="100" y="144" width="160" height="80" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
        <text x="180.0" y="172" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">Recon</text>
        <text x="180.0" y="190" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">directives</text>
        <rect x="320" y="144" width="160" height="80" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
        <text x="400.0" y="172" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">Tool picker</text>
        <text x="400.0" y="190" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">Jev or chat</text>
        <rect x="540" y="144" width="160" height="80" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
        <text x="620.0" y="172" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">Synthesis</text>
        <text x="620.0" y="190" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">cited answer</text>
        <text x="400" y="276" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">classifier · summarization · harness roles also live in config.toml</text>

      </svg>
    </div>
  </main>
</body>
</html>
