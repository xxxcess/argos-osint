[package]
name = "argos-osint-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Brain recall, hardware, and providers for Argos"
rust-version.workspace = true

[dependencies]
fleetworks-contracts = { path = "../fleetworks-contracts" }
tracing = "0.1"
anyhow.workspace = true
aho-corasick = "1.1"
csv = "1.4"
chrono.workspace = true
dirs.workspace = true
futures-util.workspace = true
fleetworks-jobs = { path = "../fleetworks-jobs" }
regex.workspace = true
rquickjs = { workspace = true, optional = true }
reqwest.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
strsim.workspace = true
surrealdb = { workspace = true, optional = true }
sysinfo.workspace = true
tokio.workspace = true
tempfile.workspace = true
tokenizers.workspace = true
toml.workspace = true
tract-onnx.workspace = true
url.workspace = true
scraper.workspace = true
webpki-roots = { version = "1", optional = true }

[features]
# A local build runs Argos on embedded SurrealDB (RocksDB on disk, no network).
default = ["embedded", "nlp", "classifier"]
nlp = ["dep:rquickjs"]
# Local six-domain classifier (QuickJS + Natural engine). Independent of `nlp`.
classifier = ["dep:rquickjs"]
# SurrealDB storage API without an engine; pick `embedded` and/or `server`.
surreal = ["dep:surrealdb"]
# Embedded RocksDB engine in-process (single owner per Argos home). Default.
embedded = ["surreal", "surrealdb/kv-rocksdb"]
# WebSocket client for per-home loopback and authenticated Fleetworks storage.
server = ["surreal", "surrealdb/protocol-ws", "surrealdb/rustls", "dep:rustls", "dep:webpki-roots"]
# Shared backend test fixtures. Never enabled in release builds.
fixtures = []
# Paused-time Tokio tests (`tokio::time::pause`).
test-util = ["tokio/test-util"]

[dev-dependencies]
tempfile.workspace = true
proptest = "1.4"

[target.'cfg(unix)'.dependencies]
# Thread CPU clock for test budgets and non-blocking process status/signals.
libc = "0.2"
