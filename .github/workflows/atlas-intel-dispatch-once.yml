name: Dispatch Atlas Intel check

on:
  push:
    branches: [feat/atlas-zero-shot]
    paths: ['.github/workflows/atlas-intel-dispatch-once.yml']

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch check-only Intel macOS CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f atlas_bert_intel_only=true
