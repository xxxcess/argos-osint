<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 572" role="img" aria-labelledby="persistence-title persistence-desc">
<title id="persistence-title">Fleetworks network storage selections · planned target</title>
<desc id="persistence-desc">Bootstrap applies the schema and provisions the scoped runtime account. Domain services use one workspace SurrealDB endpoint; in the planned target, Jobs alone opens SQLite operational state and an embedded RocksDB queue. Venture can manage the database in Compose or on the host, or use an operator-managed external server.</desc>
<defs>
  <marker id="persistence-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4f5d75"/></marker>
</defs>
<style>
  text{font-family:Geist,system-ui,sans-serif;fill:#2d3142}
  .heading{font-family:'Instrument Serif',Georgia,serif;font-size:24px}
  .label{font-size:16px;font-weight:600}
  .note{font-size:13px}
  .code{font:12px 'Geist Mono',ui-monospace,monospace}
  .zone{font-size:12px;font-weight:600;letter-spacing:1px}
  .node{fill:white;stroke:#4f5d75}
  .accent{fill:#fff6ed;stroke:#eb6c36}
  .edge,.flow{fill:none;stroke:#4f5d75;stroke-width:1.5}
  .edge{marker-end:url(#persistence-arrow)}
</style>
<rect width="960" height="572" fill="#f5f5f5"/>
<text x="40" y="36" class="heading" text-anchor="start">Planned split: domain endpoint + Jobs-owned local stores</text>
<path d="M264 112H364" class="edge"/>
<path d="M696 112H596" class="edge"/>
<path d="M480 148V216H144" class="flow"/>
<path d="M480 216H808" class="flow"/>
<path d="M144 216V248" class="edge"/>
<path d="M368 216V248" class="edge"/>
<path d="M592 216V248" class="edge"/>
<path d="M808 216V248" class="edge"/>
<rect x="40" y="76" width="224" height="72" rx="6" class="node"/>
<text x="152" y="109" class="label" text-anchor="middle">Schema bootstrap</text>
<text x="152" y="127" class="note" text-anchor="middle">Root credential · one-shot</text>
<rect x="364" y="76" width="232" height="72" rx="6" class="accent"/>
<text x="480" y="109" class="label" text-anchor="middle">Domain endpoint</text>
<text x="480" y="127" class="note" text-anchor="middle">SurrealDB WebSocket</text>
<rect x="696" y="76" width="224" height="72" rx="6" class="node"/>
<text x="808" y="109" class="label" text-anchor="middle">Domain services</text>
<text x="808" y="127" class="note" text-anchor="middle">Scoped database account</text>
<rect x="40" y="248" width="208" height="88" rx="6" class="node"/>
<text x="144" y="280" class="label" text-anchor="middle">Compose disk</text>
<text x="144" y="298" class="note" text-anchor="middle">Owned container</text>
<text x="144" y="316" class="note" text-anchor="middle">Persistent workspace disk</text>
<rect x="264" y="248" width="208" height="88" rx="6" class="node"/>
<text x="368" y="280" class="label" text-anchor="middle">Local Process / host disk</text>
<text x="368" y="298" class="note" text-anchor="middle">Owned server process</text>
<text x="368" y="316" class="note" text-anchor="middle">Persistent workspace disk</text>
<rect x="488" y="248" width="208" height="88" rx="6" class="node"/>
<text x="592" y="280" class="label" text-anchor="middle">Host memory</text>
<text x="592" y="298" class="note" text-anchor="middle">Owned server process</text>
<text x="592" y="316" class="note" text-anchor="middle">New identity on restart</text>
<rect x="712" y="248" width="208" height="88" rx="6" class="node"/>
<text x="816" y="280" class="label" text-anchor="middle">Local Net / external</text>
<text x="816" y="298" class="note" text-anchor="middle">Operator-managed server</text>
<text x="816" y="316" class="note" text-anchor="middle">Use wss:// off-host</text>
<text x="40" y="364" class="note" text-anchor="start">Domain modes above. Jobs storage stays local and disk-backed in every mode.</text>
<path d="M808 148V184H940V404H164V420" class="edge"/>
<path d="M288 460H400" class="edge"/>
<rect x="40" y="420" width="248" height="80" rx="6" class="accent"/>
<text x="164" y="452" class="label" text-anchor="middle">Jobs process</text>
<text x="164" y="474" class="note" text-anchor="middle">Authenticated Jobs HTTP</text>
<rect x="400" y="420" width="520" height="80" rx="6" class="node"/>
<text x="660" y="452" class="label" text-anchor="middle">SQLite job state + RocksDB queue</text>
<text x="660" y="474" class="note" text-anchor="middle">Only Jobs opens workspace storage/jobs/</text>
<text x="40" y="548" class="note">Target ownership; production scheduling and telemetry still use SurrealDB.</text>
</svg>
