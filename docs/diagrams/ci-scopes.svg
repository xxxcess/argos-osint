<text x="384" y="148" class="note">Intel + Apple Silicon; app/workspace/contracts units</text>
<text x="384" y="172" class="note">Selected Rune fixtures + release .app ZIPs</text>
<rect x="368" y="220" width="512" height="108" rx="6" class="node"/>
<text x="384" y="252" class="label">Linux backend · service scopes</text>
<text x="384" y="280" class="note">Services / search / storage / queue / selected images</text>
<text x="384" y="304" class="note">Affected checks; image and Compose smoke when selected</text>
<rect x="368" y="352" width="512" height="108" rx="6" class="node"/>
<text x="384" y="384" class="label">Web · web / web_dev</text>
<text x="384" y="412" class="note">React + browser / Connect / relay / topology</text>
<text x="384" y="436" class="note">Web build and development smoke when selected</text>
