<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="workspace-lifecycle-title workspace-lifecycle-desc">
<title id="workspace-lifecycle-title">Protected workstation setup and recovery</title>
<desc id="workspace-lifecycle-desc">Settings initialization, credential provisioning and authenticated registration are separate steps. The coordinated migration preserves identity and history while fencing old writers. A lost mutation response keeps its exact original handle and cannot be replaced by new work.</desc>
<style>text{font-family:Geist,Arial,sans-serif;fill:#242424}.zone{font-size:14px;letter-spacing:1.4px;fill:#666}.label{font-size:20px;font-weight:600}.note{font-size:16px;fill:#555}.small{font-size:14px;fill:#666}.node{fill:#fff;stroke:#aaa;stroke-width:1}.focus{fill:#fff4ee;stroke:#eb6c36;stroke-width:2}.wire{fill:none;stroke:#555;stroke-width:2;marker-end:url(#arrow)}.lane{fill:#fafafa;stroke:#ddd;stroke-width:1}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs>
<rect width="1200" height="720" fill="#fff"/>
<text x="40" y="48" class="zone">SETTINGS → PROVISIONING → EXPLICIT CONNECTION</text>
<rect x="40" y="88" width="332" height="148" rx="6" class="node"/>
<text x="56" y="120" class="label">Open protected settings</text>
<text x="56" y="152" class="note">Verify installation and catalog</text>
<text x="56" y="178" class="note">Do not create default children</text>
<text x="56" y="204" class="note">Preserve legacy folders/journals</text>
<rect x="432" y="88" width="332" height="148" rx="6" class="focus"/>
<text x="448" y="120" class="label">Provision exact origin</text>
<text x="448" y="152" class="note">Private token-file reference</text>
<text x="448" y="178" class="note">Locked revisioned atomic write</text>
<text x="448" y="204" class="note">No GUI, network or services</text>
<rect x="824" y="88" width="336" height="148" rx="6" class="node"/>
<text x="840" y="120" class="label">Gateway URL check</text>
<text x="840" y="152" class="note">Authenticate and check versions</text>
<text x="840" y="178" class="note">Register/reuse installation</text>
<text x="840" y="204" class="note">Optional services stay distinct</text>
<path d="M 372 160 H 432" class="wire"/>
<path d="M 764 160 H 824" class="wire"/>
<rect x="40" y="336" width="332" height="148" rx="6" class="node"/>
<text x="56" y="368" class="label">Forward migration</text>
<text x="56" y="400" class="note">Preserve workstation IDs</text>
<text x="56" y="426" class="note">Retain old registration mappings</text>
<text x="56" y="452" class="note">Fence incompatible writers</text>
<rect x="432" y="336" width="332" height="148" rx="6" class="focus"/>
<text x="448" y="368" class="label">Current workstation context</text>
<text x="448" y="400" class="note">Connect ID = opaque identity</text>
<text x="448" y="426" class="note">New browser Connect required</text>
<text x="448" y="452" class="note">No active workspace fields</text>
<rect x="824" y="336" width="336" height="148" rx="6" class="node"/>
<text x="840" y="368" class="label">Uncertain request recovery</text>
<text x="840" y="400" class="note">Original request/body/context</text>
<text x="840" y="426" class="note">Read-only historical lookup</text>
<text x="840" y="452" class="note">Unknown stays unresolved</text>
<path d="M 992 236 V 284 H 598 V 336" class="wire"/>
<path d="M 372 410 H 432" class="wire"/>
<path d="M 764 410 H 824" class="wire"/>
<path d="M 40 556 H 1160" stroke="#bbb"/><text x="40" y="592" class="label">Historical child folder lifecycle is preserved, not resumed by normal startup.</text><text x="40" y="626" class="note">Migration and setup never delete user folders or turn missing receipts into successful cleanup.</text>
<text x="40" y="696" class="small">Independent backend deployment and actual installed-app/dual-Mac verification remain separate.</text>
</svg>
