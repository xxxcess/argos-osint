<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="workspace-title workspace-desc">
<title id="workspace-title">Native workstation identity and shared backend</title>
<desc id="workspace-desc">The Mac owns protected installation settings and exact-origin credential references. The gateway resolves a stable workstation identity and enforces resource permissions and activity membership. Existing child folders remain historical data, not active identity.</desc>
<style>text{font-family:Geist,Arial,sans-serif;fill:#242424}.zone{font-size:14px;letter-spacing:1.4px;fill:#666}.label{font-size:20px;font-weight:600}.note{font-size:16px;fill:#555}.small{font-size:14px;fill:#666}.node{fill:#fff;stroke:#aaa;stroke-width:1}.focus{fill:#fff4ee;stroke:#eb6c36;stroke-width:2}.wire{fill:none;stroke:#555;stroke-width:2;marker-end:url(#arrow)}.lane{fill:#fafafa;stroke:#ddd;stroke-width:1}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs>
<rect width="1200" height="720" fill="#fff"/>
<rect x="24" y="72" width="536" height="566" class="lane"/><rect x="640" y="72" width="536" height="566" class="lane"/>
<text x="40" y="48" class="zone">MAC · PROTECTED INSTALLATION</text><text x="656" y="48" class="zone">GATEWAY · AUTHENTICATED DEPLOYMENT</text>
<rect x="48" y="96" width="488" height="136" rx="6" class="focus"/>
<text x="64" y="128" class="label">Fleetworks Desktop</text>
<text x="64" y="160" class="note">Six destinations + Status and URL setup</text>
<text x="64" y="186" class="note">Rune API client; no backend startup</text>
<rect x="48" y="292" width="488" height="148" rx="6" class="node"/>
<text x="64" y="324" class="label">OS home / .fleetworks</text>
<text x="64" y="356" class="note">Installation marker and private settings</text>
<text x="64" y="382" class="note">Exact-origin credential file references</text>
<text x="64" y="408" class="note">No new default child folder</text>
<rect x="48" y="492" width="488" height="120" rx="6" class="node"/>
<text x="64" y="524" class="label">Preserved historical records</text>
<text x="64" y="556" class="note">Existing folders, journals and old receipts</text>
<text x="64" y="582" class="note">No active folder or Trash controls</text>
<rect x="664" y="96" width="488" height="148" rx="6" class="focus"/>
<text x="680" y="128" class="label">Registered workstation</text>
<text x="680" y="160" class="note">Stable opaque workstation ID = Connect ID</text>
<text x="680" y="186" class="note">Authenticated scope + installation hash</text>
<text x="680" y="212" class="note">IP is optional mutable metadata</text>
<rect x="664" y="304" width="488" height="120" rx="6" class="node"/>
<text x="680" y="336" class="label">Shared backend resources</text>
<text x="680" y="368" class="note">Actors, search, models and credentials</text>
<text x="680" y="394" class="note">Permissions define resource access</text>
<rect x="664" y="484" width="488" height="128" rx="6" class="node"/>
<text x="680" y="516" class="label">Durable jobs and associations</text>
<text x="680" y="548" class="note">Immutable creator + requester membership</text>
<text x="680" y="574" class="note">Private details stay independently guarded</text>
<path d="M 536 164 H 664" class="wire"/>
<path d="M 292 232 V 292" class="wire"/>
<path d="M 908 244 V 304" class="wire"/>
<path d="M 908 424 V 484" class="wire"/>
<text x="570" y="140" class="small">Current proof</text><text x="56" y="670" class="note">Independent operators own deployment files, containers and private backend stores.</text>
<text x="40" y="696" class="small">A Connect ID selects an existing workstation. It is never a credential.</text>
</svg>
