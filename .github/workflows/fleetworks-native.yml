name: Build and verify one Fleetworks Mac app

on:
  workflow_call:
    inputs:
      expected-head:
        type: string
        required: true
      target:
        type: string
        required: true
      runner:
        type: string
        required: true
    outputs:
      artifact-id:
        value: ${{ jobs.package.outputs.artifact-id }}
      artifact-url:
        value: ${{ jobs.package.outputs.artifact-url }}
      sha256:
        value: ${{ jobs.package.outputs.sha256 }}
      evidence-url:
        value: ${{ jobs.package.outputs.evidence-url }}

# No signing, release, PR-comment or package-write credentials are available.
# Native build/fixture jobs never install Docker, Node or backend engines.
permissions:
  contents: read
  actions: read

env:
  FLEETWORKS_HEAD: ${{ inputs.expected-head }}
  NATIVE_TARGET: ${{ inputs.target }}
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: 1

jobs:
  package:
    name: Native app and real-view fixtures
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
      sha256: ${{ steps.package.outputs.sha256 }}
      rune-revision: ${{ steps.package.outputs.rune-revision }}
      evidence-url: ${{ steps.evidence.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected-head }}
          persist-credentials: false
          lfs: false
      - name: Resolve exact source and repository toolchain
        id: pin
        env:
          SELECTED_RUNNER: ${{ inputs.runner }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FLEETWORKS_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$FLEETWORKS_HEAD"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          pairs = {
              "x86_64-apple-darwin": "macos-15-intel",
              "aarch64-apple-darwin": "macos-15",
          }
          if pairs.get(os.environ["NATIVE_TARGET"]) != os.environ["SELECTED_RUNNER"]:
              raise SystemExit("Selected Mac target/runner pair is unsupported")
          match = re.search(r'^channel\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"', Path("rust-toolchain.toml").read_text(), re.M)
          if not match:
              raise SystemExit("Repository requires an explicit Rust toolchain pin")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("version=" + match[1], file=output)
          PY
      - name: Install the selected repository toolchain
        env:
          TOOLCHAIN: ${{ steps.pin.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt --target "$NATIVE_TARGET"
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$NATIVE_TARGET"
          test "$(rustc -vV | sed -n 's/^release: //p')" = "$TOOLCHAIN"
          xcode-select -p
          xcrun --sdk macosx --show-sdk-path
          python3 scripts/fleetworks_verify.py platform --format json
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ inputs.target }}-${{ steps.pin.outputs.version }}-${{ hashFiles('Cargo.lock', 'apps/fleetworks-desktop/Cargo.toml') }}
          workspaces: . -> target/agents
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Run scoped desktop tests and build one fixture executable
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/fleetworks-native-evidence"
          mkdir -p "$evidence"
          cargo fmt -p fleetworks-desktop -- --check
          python3 scripts/agent_cargo.py test --locked -p fleetworks-desktop \
            --target "$NATIVE_TARGET" | tee "$evidence/unit-tests.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$evidence/unit-tests.log"
          python3 scripts/agent_cargo.py build --locked -p fleetworks-desktop \
            --example native_fixture --target "$NATIVE_TARGET" \
            --message-format=json-render-diagnostics > "$evidence/cargo-fixture.jsonl"
      - name: Render the actual shared views and scripted actor selection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import platform
          import re
          import struct
          import subprocess
          import tempfile
          import sys
          sys.path.insert(0, "scripts")
          from fleetworks_candidate import locked_rune_revision, sha256

          output = Path(os.environ["RUNNER_TEMP"]) / "fleetworks-native-evidence"
          messages = [json.loads(line) for line in (output / "cargo-fixture.jsonl").read_text().splitlines() if line.strip()]
          executables = {item["executable"] for item in messages
                         if item.get("reason") == "compiler-artifact"
                         and item.get("target", {}).get("name") == "native_fixture"
                         and "example" in item.get("target", {}).get("kind", [])
                         and item.get("executable")}
          if len(executables) != 1 or not any(item.get("reason") == "build-finished" and item.get("success") is True for item in messages):
              raise SystemExit("A successful build must identify exactly one native_fixture executable")
          executable = Path(executables.pop())
          if not executable.is_absolute() or not executable.is_file():
              raise SystemExit("Fixture compiler-artifact path is unavailable")
          scenes = ["workstation-offline", "atlas-offline", "brain-search-ready", "brain-dossier",
                    "brain-search-indexing", "brain-search-error", "tools-offline", "models-setup",
                    "profile-setup", "workspaces-offline", "jobs-offline"]
          records = []
          with tempfile.TemporaryDirectory(prefix="fleetworks-fixture-home-", dir=os.environ["RUNNER_TEMP"]) as home:
              environment = {**os.environ, "HOME": home}
              listing = subprocess.run([str(executable), "--list-scenes"], env=environment,
                                       check=True, text=True, capture_output=True, timeout=30)
              (output / "scenes.txt").write_text(listing.stdout)
              if not set(scenes).issubset(set(re.findall(r"[A-Za-z0-9_-]+", listing.stdout))):
                  raise SystemExit("Selected scene names are missing; zero/unmatched captures cannot pass")
              cases = [(scene, size, scale, None) for scene in scenes for size, scale in [("1280x800", 2), ("640x480", 1)]]
              cases.append(("brain-search-ready", "1280x800", 2,
                            "apps/fleetworks-desktop/tests/fixtures/scripts/brain-search-open.json"))
              for scene, size, scale, script in cases:
                  label = f"{scene}-{size}-{scale}x" + ("-selection" if script else "")
                  png, tree = output / (label + ".png"), output / (label + ".tree.json")
                  command = [str(executable), "--scene", scene, "--size", size, "--scale", str(scale),
                             "--at", "1.0" if script else "0", "--snap", str(png), "--tree", str(tree)]
                  if script:
                      command += ["--script", script, "--trace", str(output / (label + ".trace.jsonl"))]
                  result = subprocess.run(command, env=environment, text=True, capture_output=True, timeout=90)
                  (output / (label + ".log")).write_text(result.stdout + result.stderr)
                  if result.returncode:
                      raise SystemExit(f"Rune renderer failed for {label}; missing adapter/render support is not a pass")
                  header = png.read_bytes()[:24] if png.is_file() else b""
                  if len(header) < 24 or header[:8] != b"\x89PNG\r\n\x1a\n":
                      raise SystemExit(f"Missing/invalid rendered PNG for {label}")
                  expected = tuple(int(value) * scale for value in size.split("x"))
                  if struct.unpack(">II", header[16:24]) != expected:
                      raise SystemExit(f"Rendered dimensions do not match selected profile for {label}")
                  tree_text = tree.read_text() if tree.is_file() else ""
                  if not tree_text or not json.loads(tree_text) or "fixture-marker" not in tree_text:
                      raise SystemExit(f"Missing/invalid production-view fixture tree for {label}")
                  if script and "dossier-name" not in tree_text:
                      raise SystemExit("Scripted actor selection did not reach the dossier view")
                  records.append({"scene": scene, "size": size, "scale": scale, "script": script,
                                  "png": png.name, "png_sha256": sha256(png), "tree": tree.name,
                                  "exit": result.returncode, "png_generated": True,
                                  "visual_inspection": "pending", "gui_launch": "not_run"})
          manifest = {"source_revision": os.environ["FLEETWORKS_HEAD"], "dirty": False,
                      "rune_revision": locked_rune_revision(), "target": os.environ["NATIVE_TARGET"],
                      "os": platform.platform(), "fixture_sha256": sha256(executable),
                      "renderer": "Rune headless renderer; adapter diagnostics retained in per-capture logs",
                      "fonts": "pinned Rune embedded-fonts build feature", "theme": "Fleetworks charcoal/gold/ivory",
                      "virtual_clock": True, "unit_tests": "passed; see unit-tests.log", "captures": records,
                      "visual_inspection": "pending", "downloaded_app_gui_launch": "pending"}
          (output / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
      - name: Build and package the complete local-review app
        id: package
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/fleetworks-native-candidate"
          python3 scripts/fleetworks_candidate.py build-native --agent \
            --target "$NATIVE_TARGET" --profile release --output "$output" \
            --revision "$FLEETWORKS_HEAD" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --archive --require-clean
          CANDIDATE_DIRECTORY="$output" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from fleetworks_candidate import locked_rune_revision, sha256
          directory = Path(os.environ["CANDIDATE_DIRECTORY"])
          archives = list(directory.glob("Fleetworks-*.zip"))
          if len(archives) != 1:
              raise SystemExit("Exactly one versioned app ZIP is required")
          manifest = json.loads((directory / "Fleetworks.app.manifest.json").read_text())
          if manifest["revision"] != os.environ["FLEETWORKS_HEAD"] or manifest["dirty"] is not False:
              raise SystemExit("Candidate source identity differs from the selected exact revision")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("sha256=" + sha256(archives[0]), file=output)
              print("rune-revision=" + locked_rune_revision(), file=output)
          PY
      - name: Upload immutable app ZIP, manifest and checksum
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Fleetworks-app-${{ inputs.target }}-${{ inputs.expected-head }}-${{ github.run_id }}.${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fleetworks-native-candidate/Fleetworks-*.zip
            ${{ runner.temp }}/fleetworks-native-candidate/Fleetworks-*.zip.sha256
            ${{ runner.temp }}/fleetworks-native-candidate/Fleetworks.app.manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain real-view evidence and original failures
        id: evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Fleetworks-native-evidence-${{ inputs.target }}-${{ inputs.expected-head }}-${{ github.run_id }}.${{ github.run_attempt }}
          path: ${{ runner.temp }}/fleetworks-native-evidence/
          if-no-files-found: ignore
          retention-days: 14

  verify:
    name: Verify exact downloaded app bytes
    needs: package
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected-head }}
          persist-credentials: false
          lfs: false
      - name: Require exact artifact and source identity
        env:
          ARTIFACT_ID: ${{ needs.package.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FLEETWORKS_HEAD"
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: ${{ runner.temp }}/fleetworks-native-download
          digest-mismatch: error
      - name: Verify downloaded ZIP without installing or launching it
        env:
          EXPECTED_SHA256: ${{ needs.package.outputs.sha256 }}
          RUNE_REVISION: ${{ needs.package.outputs.rune-revision }}
        shell: bash
        run: |
          set -euo pipefail
          archives=("$RUNNER_TEMP"/fleetworks-native-download/Fleetworks-*.zip)
          test "${#archives[@]}" = 1
          python3 scripts/fleetworks_candidate.py verify-native --archive "${archives[0]}" \
            --sha256 "$EXPECTED_SHA256" --revision "$FLEETWORKS_HEAD" \
            --target "$NATIVE_TARGET" --profile release --rune-revision "$RUNE_REVISION" \
            --require-clean --directory "$RUNNER_TEMP/fleetworks-native-extracted"
      - name: Record actual review URLs and verification limits
        env:
          APP_URL: ${{ needs.package.outputs.artifact-url }}
          EVIDENCE_URL: ${{ needs.package.outputs.evidence-url }}
          EXPECTED_SHA256: ${{ needs.package.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APP_URL"
          test -n "$EVIDENCE_URL"
          {
            printf 'Fleetworks `%s` / `%s`\n\n' "$FLEETWORKS_HEAD" "$NATIVE_TARGET"
            printf -- '- [Download exact app artifact](%s); SHA-256 `%s`.\n' "$APP_URL" "$EXPECTED_SHA256"
            printf -- '- [Real-view PNG/tree/test evidence](%s). Actions retention: 14 days.\n' "$EVIDENCE_URL"
            printf -- '- Bundle architecture, libraries, identity and checksums passed on downloaded bytes.\n'
            printf -- '- PNGs generated; human visual inspection and matching-hardware GUI launch remain pending.\n'
            printf -- '- Unsigned review candidate; notarization, minimum-macOS testing and publication remain pending.\n'
          } >> "$GITHUB_STEP_SUMMARY"
