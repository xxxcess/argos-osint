<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="ci-scopes-title ci-scopes-desc">
<title id="ci-scopes-title">Fleetworks scoped verification</title>
<desc id="ci-scopes-desc">The workflow checks out the exact event revision, selects affected jobs, and reports their combined result. Manual runs and unavailable comparisons select all scopes. Docs-only changes can pass scope planning without runtime jobs.</desc>
<defs>
  <marker id="ci-scopes-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4f5d75"/></marker>
</defs>
<style>
  text{font-family:Geist,system-ui,sans-serif;fill:#2d3142}
  .heading{font-family:'Instrument Serif',Georgia,serif;font-size:24px}
  .label{font-size:16px;font-weight:600}
  .note{font-size:13px}
  .code{font:12px 'Geist Mono',ui-monospace,monospace}
  .zone{font-size:12px;font-weight:600;letter-spacing:1px}
  .node{fill:white;stroke:#4f5d75}
  .accent{fill:#fff6ed;stroke:#eb6c36}
  .edge,.flow{fill:none;stroke:#4f5d75;stroke-width:1.5}
  .edge{marker-end:url(#ci-scopes-arrow)}
</style>
<rect width="960" height="420" fill="#f5f5f5"/>
<text x="40" y="36" class="heading" text-anchor="start">Exact revision → affected checks → required result</text>
<path d="M240 212H280V92H320" class="edge"/>
<path d="M280 212V172H320" class="edge"/>
<path d="M280 212V252H320" class="edge"/>
<path d="M280 252V332H320" class="edge"/>
<path d="M640 92H680V212H720" class="edge"/>
<path d="M640 172H680" class="flow"/>
<path d="M640 252H680V212" class="flow"/>
<path d="M640 332H680V252" class="flow"/>
<rect x="40" y="172" width="200" height="80" rx="6" class="accent"/>
<text x="140" y="209" class="label" text-anchor="middle">Scope planner</text>
<text x="140" y="227" class="note" text-anchor="middle">Git diff at event head</text>
<rect x="320" y="60" width="320" height="64" rx="6" class="node"/>
<text x="480" y="89" class="label" text-anchor="middle">Native clients</text>
<text x="480" y="107" class="note" text-anchor="middle">Linux AMD64 · Intel macOS</text>
<rect x="320" y="140" width="320" height="64" rx="6" class="node"/>
<text x="480" y="169" class="label" text-anchor="middle">Services</text>
<text x="480" y="187" class="note" text-anchor="middle">Linux ARM64 · selected server images</text>
<rect x="320" y="220" width="320" height="64" rx="6" class="node"/>
<text x="480" y="249" class="label" text-anchor="middle">Packaged Compose</text>
<text x="480" y="267" class="note" text-anchor="middle">Linux ARM64 and AMD64</text>
<rect x="320" y="300" width="320" height="64" rx="6" class="node"/>
<text x="480" y="329" class="label" text-anchor="middle">Rust-BERT runtime</text>
<text x="480" y="347" class="note" text-anchor="middle">Real checkpoint inference on Intel macOS</text>
<rect x="720" y="172" width="200" height="80" rx="6" class="accent"/>
<text x="820" y="209" class="label" text-anchor="middle">Fleetworks required</text>
<text x="820" y="227" class="note" text-anchor="middle">Require selected jobs</text>
<text x="40" y="396" class="note" text-anchor="start">A required check fails when a selected job does not succeed.</text>
</svg>
