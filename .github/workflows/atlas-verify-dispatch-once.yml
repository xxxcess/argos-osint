name: Dispatch corrected Atlas matrix
on:
  push:
    branches: [verify/atlas-zero-shot-intel]
    paths: ['.github/workflows/atlas-verify-dispatch-once.yml']
permissions:
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch the eight-leg CI matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
