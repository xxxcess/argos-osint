<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="native-connections-title native-connections-desc">
<title id="native-connections-title">Native setup and workstation browser connection</title>
<desc id="native-connections-desc">Exact-origin provisioning is separate from the URL-only connection flow. Authenticated registration returns a stable workstation ID; the independently authenticated browser resolves that existing identity and revalidates its own session. No folder/IP selection or backend startup occurs.</desc>
<style>text{font-family:Geist,Arial,sans-serif;fill:#242424}.zone{font-size:14px;letter-spacing:1.4px;fill:#666}.label{font-size:20px;font-weight:600}.note{font-size:16px;fill:#555}.small{font-size:14px;fill:#666}.node{fill:#fff;stroke:#aaa;stroke-width:1}.focus{fill:#fff4ee;stroke:#eb6c36;stroke-width:2}.wire{fill:none;stroke:#555;stroke-width:2;marker-end:url(#arrow)}.lane{fill:#fafafa;stroke:#ddd;stroke-width:1}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs>
<rect width="1200" height="720" fill="#fff"/>
<text x="40" y="48" class="zone">NATIVE · EXACT-ORIGIN CREDENTIAL AND STABLE INSTALLATION</text><rect x="40" y="88" width="332" height="148" rx="6" class="node"/>
<text x="56" y="120" class="label">Provision protected binding</text>
<text x="56" y="152" class="note">App executable provisioning mode</text>
<text x="56" y="178" class="note">Existing private token-file reference</text>
<text x="56" y="204" class="note">No GUI, network or service startup</text>
<rect x="432" y="88" width="332" height="148" rx="6" class="focus"/>
<text x="448" y="120" class="label">Gateway URL</text>
<text x="448" y="152" class="note">Normalize one HTTP(S) origin</text>
<text x="448" y="178" class="note">Resolve only that origin credential</text>
<text x="448" y="204" class="note">Missing/replaced binding is an error</text>
<rect x="824" y="88" width="336" height="148" rx="6" class="node"/>
<text x="840" y="120" class="label">Connectivity and registration</text>
<text x="840" y="152" class="note">Authenticate; check compatibility</text>
<text x="840" y="178" class="note">Ensure protected installation</text>
<text x="840" y="204" class="note">IP metadata remains optional</text>
<path d="M 372 160 H 432" class="wire"/>
<path d="M 764 160 H 824" class="wire"/>
<text x="40" y="300" class="zone">BROWSER · INDEPENDENT WEBRELAY AUTHORITY</text><rect x="40" y="344" width="332" height="148" rx="6" class="node"/>
<text x="56" y="376" class="label">Workstation Status</text>
<text x="56" y="408" class="note">Read-only selectable Connect ID</text>
<text x="56" y="434" class="note">Opaque backend workstation ID</text>
<text x="56" y="460" class="note">No folder or interface selection</text>
<rect x="432" y="344" width="332" height="148" rx="6" class="focus"/>
<text x="448" y="376" class="label">Intel Web Connect</text>
<text x="448" y="408" class="note">Enter an existing workstation ID</text>
<text x="448" y="434" class="note">WebRelay resolves registration</text>
<text x="448" y="460" class="note">ID itself grants no authority</text>
<rect x="824" y="344" width="336" height="148" rx="6" class="node"/>
<text x="840" y="376" class="label">Protected session</text>
<text x="840" y="408" class="note">HttpOnly fleetworks_connect_v2</text>
<text x="840" y="434" class="note">Current context and epoch fences</text>
<text x="840" y="460" class="note">Native app may close</text>
<path d="M 992 236 V 324 H 206 V 344" class="wire"/>
<path d="M 372 416 H 432" class="wire"/>
<path d="M 764 416 H 824" class="wire"/>
<path d="M 40 552 H 1160" stroke="#bbb"/><text x="40" y="592" class="label">Gateway changes fence old credentials, reads and confirmations.</text><text x="40" y="626" class="note">Uncertain mutations retain original request identity; reconnecting never creates replacement work.</text>
<text x="40" y="696" class="small">Legacy child sessions and IDs require fresh Connect; shared IPs do not merge installations.</text>
</svg>
