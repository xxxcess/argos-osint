[package]
name = "argos-osint-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Brain recall, hardware, and providers for Argos"
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
dirs.workspace = true
futures-util.workspace = true
lancedb = { workspace = true, optional = true }
regex.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
strsim.workspace = true
sysinfo.workspace = true
tokio.workspace = true
tempfile.workspace = true
tokenizers.workspace = true
toml.workspace = true
tract-onnx.workspace = true
url.workspace = true
scraper.workspace = true

[features]
default = ["lancedb"]
# Local LanceDB vector index. CI builds with `--no-default-features` and skips this.
lancedb = ["dep:lancedb"]
# Test/screenshot fixtures used by the binary's tests. Never enabled in release builds.
fixtures = []
# Paused-time Tokio tests (`tokio::time::pause`).
test-util = ["tokio/test-util"]

[build-dependencies]
# Prebuilt protoc for every host; see tools/protoc and .cargo/config.toml.
protoc-bin-vendored.workspace = true

[dev-dependencies]
tempfile.workspace = true
