<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="brain-browse-title brain-browse-desc">
<title id="brain-browse-title">Brain browsing and direct associations</title>
<desc id="brain-browse-desc">Internal storage and recall remain unchanged. A background reader batches Claims and Actor associations into immutable snapshots. The TUI filters its cached display index and drops stale deliveries. Direct provenance supplies typed association tabs and all graph nodes; grouping never merges identity. Rows navigate to exact records; graph nodes only scroll.</desc>
