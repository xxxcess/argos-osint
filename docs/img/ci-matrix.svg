<rect width="640" height="230" fill="#fff"/>
<text x="20" y="25" font-weight="bold">ci.yml: 4 platforms × 2 storage legs (fail-fast off)</text>
<g fill="#f3f4f6" stroke="#9ca3af">
<rect x="20" y="45" width="150" height="160"/><rect x="190" y="45" width="210" height="160"/><rect x="420" y="45" width="200" height="160"/></g>
<text x="30" y="68" font-weight="bold">Platform</text>
<text x="30" y="98">Linux x86_64</text><text x="30" y="128">Linux aarch64</text><text x="30" y="158">macOS arm64</text><text x="30" y="188">macOS Intel (15)</text>
<text x="200" y="68" font-weight="bold" fill="#1d4ed8">embedded (default)</text>
<text x="200" y="98">fmt --check</text><text x="200" y="123">clippy -D warnings</text><text x="200" y="148">cargo test --workspace</text><text x="200" y="173">test_surreal --mode embedded</text>
<text x="430" y="68" font-weight="bold" fill="#b45309">server (CI only)</text>
