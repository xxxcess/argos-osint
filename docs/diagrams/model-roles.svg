<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 368" role="img" aria-labelledby="model-roles-title model-roles-desc">
<title id="model-roles-title">Fleetworks model routing</title>
<desc id="model-roles-desc">A model-backed operation resolves its configured role chain and uses a compatible provider route. Atlas live domain admission uses its own Rust-BERT classifier.</desc>
<defs>
  <marker id="model-roles-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4f5d75"/></marker>
</defs>
<style>
  text{font-family:Geist,system-ui,sans-serif;fill:#2d3142}
  .heading{font-family:'Instrument Serif',Georgia,serif;font-size:24px}
  .label{font-size:16px;font-weight:600}
  .note{font-size:13px}
  .code{font:12px 'Geist Mono',ui-monospace,monospace}
  .zone{font-size:12px;font-weight:600;letter-spacing:1px}
  .node{fill:white;stroke:#4f5d75}
  .accent{fill:#fff6ed;stroke:#eb6c36}
  .edge,.flow{fill:none;stroke:#4f5d75;stroke-width:1.5}
  .edge{marker-end:url(#model-roles-arrow)}
</style>
