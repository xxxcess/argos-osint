name: Build and verify one Fleetworks Mac app

on:
  workflow_call:
    inputs:
      expected-head:
        type: string
        required: true
      target:
        type: string
        required: true
      runner:
        type: string
        required: true
    outputs:
      artifact-id:
        value: ${{ jobs.package.outputs.artifact-id }}
      artifact-url:
        value: ${{ jobs.package.outputs.artifact-url }}
      sha256:
        value: ${{ jobs.package.outputs.sha256 }}
      evidence-url:
        value: ${{ jobs.package.outputs.evidence-url }}

# No signing, release, PR-comment or package-write credentials are available.
# Native build/fixture jobs never install Docker, Node or backend engines.
permissions:
  contents: read
  actions: read

env:
  FLEETWORKS_HEAD: ${{ inputs.expected-head }}
  NATIVE_TARGET: ${{ inputs.target }}
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: 1

jobs:
  package:
    name: Native app and real-view fixtures
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
      sha256: ${{ steps.package.outputs.sha256 }}
      rune-revision: ${{ steps.package.outputs.rune-revision }}
      evidence-url: ${{ steps.evidence.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected-head }}
          persist-credentials: false
          lfs: false
      - name: Resolve exact source and repository toolchain
        id: pin
        env:
          SELECTED_RUNNER: ${{ inputs.runner }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FLEETWORKS_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$FLEETWORKS_HEAD"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          pairs = {
              "x86_64-apple-darwin": "macos-15-intel",
              "aarch64-apple-darwin": "macos-15",
          }
          if pairs.get(os.environ["NATIVE_TARGET"]) != os.environ["SELECTED_RUNNER"]:
              raise SystemExit("Selected Mac target/runner pair is unsupported")
          match = re.search(r'^channel\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"', Path("rust-toolchain.toml").read_text(), re.M)
          if not match:
              raise SystemExit("Repository requires an explicit Rust toolchain pin")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("version=" + match[1], file=output)
          PY
      - name: Install the selected repository toolchain
        env:
          TOOLCHAIN: ${{ steps.pin.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt --target "$NATIVE_TARGET"
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$NATIVE_TARGET"
          test "$(rustc -vV | sed -n 's/^release: //p')" = "$TOOLCHAIN"
          xcode-select -p
          xcrun --sdk macosx --show-sdk-path
          python3 scripts/fleetworks_verify.py platform --format json
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ inputs.target }}-${{ steps.pin.outputs.version }}-${{ hashFiles('Cargo.lock', 'apps/fleetworks-desktop/Cargo.toml') }}
          workspaces: . -> target/agents
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Run scoped desktop unit tests
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/fleetworks-native-evidence"
          mkdir -p "$evidence"
          cargo fmt -p fleetworks-desktop -p fleetworks-workspace -p fleetworks-contracts -- --check
          python3 scripts/agent_cargo.py test --locked -p fleetworks-desktop \
            -p fleetworks-workspace -p fleetworks-contracts -- --test-threads=1 \
            | tee "$evidence/unit-tests.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$evidence/unit-tests.log"
      - name: Generate selected actual shared-view fixture evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fleetworks_verify.py native-ui --agent --require-clean \
            --revision "$FLEETWORKS_HEAD" --output "$RUNNER_TEMP/fleetworks-native-evidence/fixtures" \
            --scene workstation-offline --scene atlas-offline --scene brain-search-ready \
            --scene brain-dossier --scene brain-search-indexing --scene brain-search-error \
            --scene tools-offline --scene models-setup --scene profile-setup \
            --scene workspaces-offline --scene jobs-offline \
            --size 1280x800 --size 640x480 --scale 1 --scale 2 \
            --script brain-search-ready=apps/fleetworks-desktop/tests/fixtures/scripts/brain-search-open.json \
            --script-expect-key brain-search-ready=dossier-name
      - name: Build and package the complete local-review app
        id: package
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/fleetworks-native-candidate"
          python3 scripts/fleetworks_candidate.py build-native --agent \
            --target "$NATIVE_TARGET" --profile release --output "$output" \
            --revision "$FLEETWORKS_HEAD" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --archive --require-clean
          CANDIDATE_DIRECTORY="$output" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from fleetworks_candidate import locked_rune_revision, sha256
          directory = Path(os.environ["CANDIDATE_DIRECTORY"])
          archives = list(directory.glob("Fleetworks-*.zip"))
          if len(archives) != 1:
              raise SystemExit("Exactly one versioned app ZIP is required")
          manifest = json.loads((directory / "Fleetworks.app.manifest.json").read_text())
          if manifest["revision"] != os.environ["FLEETWORKS_HEAD"] or manifest["dirty"] is not False:
              raise SystemExit("Candidate source identity differs from the selected exact revision")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("sha256=" + sha256(archives[0]), file=output)
              print("rune-revision=" + locked_rune_revision(), file=output)
          PY
      - name: Upload immutable app ZIP, manifest and checksum
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Fleetworks-app-${{ inputs.target }}-${{ inputs.expected-head }}-${{ github.run_id }}.${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fleetworks-native-candidate/Fleetworks-*.zip
            ${{ runner.temp }}/fleetworks-native-candidate/Fleetworks-*.zip.sha256
            ${{ runner.temp }}/fleetworks-native-candidate/Fleetworks.app.manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain real-view evidence and original failures
        id: evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Fleetworks-native-evidence-${{ inputs.target }}-${{ inputs.expected-head }}-${{ github.run_id }}.${{ github.run_attempt }}
          path: ${{ runner.temp }}/fleetworks-native-evidence/
          if-no-files-found: ignore
          retention-days: 14

  verify:
    name: Verify exact downloaded app bytes
    needs: package
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected-head }}
          persist-credentials: false
          lfs: false
      - name: Require exact artifact and source identity
        env:
          ARTIFACT_ID: ${{ needs.package.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FLEETWORKS_HEAD"
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: ${{ runner.temp }}/fleetworks-native-download
          digest-mismatch: error
      - name: Verify downloaded ZIP without installing or launching it
        env:
          EXPECTED_SHA256: ${{ needs.package.outputs.sha256 }}
          RUNE_REVISION: ${{ needs.package.outputs.rune-revision }}
        shell: bash
        run: |
          set -euo pipefail
          archives=("$RUNNER_TEMP"/fleetworks-native-download/Fleetworks-*.zip)
          test "${#archives[@]}" = 1
          python3 scripts/fleetworks_candidate.py verify-native --archive "${archives[0]}" \
            --sha256 "$EXPECTED_SHA256" --revision "$FLEETWORKS_HEAD" \
            --target "$NATIVE_TARGET" --profile release --rune-revision "$RUNE_REVISION" \
            --require-clean --directory "$RUNNER_TEMP/fleetworks-native-extracted"
      - name: Record actual review URLs and verification limits
        env:
          APP_URL: ${{ needs.package.outputs.artifact-url }}
          EVIDENCE_URL: ${{ needs.package.outputs.evidence-url }}
          EXPECTED_SHA256: ${{ needs.package.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APP_URL"
          test -n "$EVIDENCE_URL"
          {
            printf 'Fleetworks `%s` / `%s`\n\n' "$FLEETWORKS_HEAD" "$NATIVE_TARGET"
            printf -- '- [Download exact app artifact](%s); SHA-256 `%s`.\n' "$APP_URL" "$EXPECTED_SHA256"
            printf -- '- [Real-view PNG/tree/test evidence](%s). Actions retention: 14 days.\n' "$EVIDENCE_URL"
            printf -- '- Bundle architecture, libraries, identity and checksums passed on downloaded bytes.\n'
            printf -- '- PNGs generated; human visual inspection and matching-hardware GUI launch remain pending.\n'
            printf -- '- Unsigned review candidate; notarization, minimum-macOS testing and publication remain pending.\n'
          } >> "$GITHUB_STEP_SUMMARY"
