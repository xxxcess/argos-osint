<div class="eyebrow">Execution</div><h1>Provider request scheduling</h1>
<p class="lede">One provider queue paces every Argos model path. HTTP dispatch owns pacing; the route executor owns retries and validation.</p>
<div class="frame"><svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="model-request-scheduling-title model-request-scheduling-desc" viewBox="0 0 900 700">
<title id="model-request-scheduling-title">Provider request scheduling</title>
<desc id="model-request-scheduling-desc">Workflow retries and direct compatibility calls converge on compilation and one process-wide FIFO pacing queue per provider before HTTP sends. Rate limits and overloads extend the provider cooldown. Validation returns a result or hands failure back to the retry owner.</desc>

<text x="762.0" y="629" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="10" fill="#4f5d75">publish behind task fence</text>
<text x="80" y="188" font-family="Geist,system-ui,sans-serif" font-size="11" fill="#4f5d75">direct compatibility calls</text>
<text x="30" y="388" font-family="Geist,system-ui,sans-serif" font-size="11" fill="#4f5d75">429 / 503 / stream error</text>
<text x="44" y="407" font-family="Geist,system-ui,sans-serif" font-size="11" fill="#4f5d75">extend provider cooldown</text>
<text x="612" y="169" font-family="Geist,system-ui,sans-serif" font-size="11" fill="#4f5d75">failure</text>
<text x="612" y="187" font-family="Geist,system-ui,sans-serif" font-size="11" fill="#4f5d75">retry / fallback</text>
<text x="588" y="487" font-family="Geist,system-ui,sans-serif" font-size="11" fill="#4f5d75">response</text>
<text x="24" y="670" font-family="Geist,system-ui,sans-serif" font-size="12" fill="#4f5d75">Queue waits are cancellable. Retry-After extends pacing; exhausted or terminal routes return an error.</text>
<text x="24" y="690" font-family="Geist,system-ui,sans-serif" font-size="12" fill="#4f5d75">Process-local policy; external traffic, token/day quotas and provider outages remain outside this clock.</text>
