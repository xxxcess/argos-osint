<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="brain-topology-title brain-topology-desc">
<title id="brain-topology-title">Argos Brain Memory Topology and Scope Analysis</title>
<desc id="brain-topology-desc">Brain graph panes and exact Intel records seed a bounded two-hop retained neighborhood. A generation-fenced background read delivers one immutable snapshot to GraphCanvas and inspector. Explicit scope analysis remains separate.</desc>
