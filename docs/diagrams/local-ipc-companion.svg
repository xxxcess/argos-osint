<text x="904" y="194" class="note">Zero network listeners; logs on stderr</text>
<text x="904" y="222" class="note">Private 0700 state dir, one writer</text>
<text x="1096" y="292" class="minor">Starts in-process</text>

<rect x="888" y="336" width="384" height="136" rx="6" class="node"/>
<text x="904" y="368" class="label">Engines run inside the process</text>
<text x="904" y="398" class="note">Embedded SurrealDB for domain records</text>
<text x="904" y="426" class="note">Jobs SQLite + RocksDB queue</text>
<text x="904" y="454" class="note">Tantivy search service, in-process</text>
