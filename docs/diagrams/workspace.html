<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Argos workspace</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --accent-tint:rgba(235,108,54,.08); --link:#2e5aa8; }
    html,body { margin:0; background:var(--paper); color:var(--ink); font-family:Geist,system-ui,sans-serif; }
    main { max-width:880px; margin:0 auto; padding:40px 24px 64px; }
    .eyebrow { font-family:"Geist Mono",ui-monospace,monospace; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
    h1 { font-family:"Instrument Serif",serif; font-weight:400; font-size:1.75rem; margin:.4rem 0 1.25rem; }
    .frame { overflow-x:auto; }
    svg { min-width:800px; display:block; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Architecture</div>
    <h1>Argos workspace</h1>
    <div class="frame">
      <svg role="img" aria-labelledby="workspace-title workspace-desc" viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg">
        <title id="workspace-title">Argos workspace</title>
        <desc id="workspace-desc">Home launches four applications that share SQLite and LanceDB; Tools, Models, and Profile configure gathering and accounts; Jobs and Logs watch background work.</desc>
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5d75" />
          </marker>
          <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#eb6c36" />
          </marker>
        </defs>
        <rect width="800" height="360" fill="#f5f5f5" />
        <!-- arrows first -->
        <path d="M400 92 L400 116" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)" />
        <path d="M328 92 L180 116" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)" />
        <path d="M328 92 L268 116" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)" />
        <path d="M472 92 L532 116" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)" />
        <path d="M400 188 L400 220" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)" />
        <path d="M180 188 L180 220" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)" />
        <path d="M268 188 L268 220" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)" />
        <path d="M532 188 L532 220" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)" />
        <path d="M656 92 L656 220" fill="none" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)" />
        <!-- Home -->
        <rect x="328" y="28" width="144" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2" />
        <rect x="336" y="36" width="44" height="14" rx="2" fill="#eb6c36" />
        <text x="358" y="47" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="8" fill="#f5f5f5" letter-spacing=".12em">HOME</text>
        <text x="400" y="70" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">Launcher</text>
        <!-- Apps -->
        <g font-family="Geist,system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">
          <rect x="116" y="120" width="128" height="68" rx="6" fill="#fff" stroke="#2d3142" />
          <text x="180" y="150" text-anchor="middle">Intel</text>
          <text x="180" y="168" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" font-weight="400" fill="#7a8399">brief + reports</text>
          <rect x="256" y="120" width="128" height="68" rx="6" fill="#fff" stroke="#2d3142" />
          <text x="320" y="150" text-anchor="middle">Atlas</text>
          <text x="320" y="168" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" font-weight="400" fill="#7a8399">news cycles</text>
          <rect x="336" y="120" width="128" height="68" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2" />
          <text x="400" y="150" text-anchor="middle">Recon</text>
          <text x="400" y="168" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" font-weight="400" fill="#7a8399">investigations</text>
          <rect x="468" y="120" width="128" height="68" rx="6" fill="#fff" stroke="#2d3142" />
          <text x="532" y="150" text-anchor="middle">Brain</text>
          <text x="532" y="168" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" font-weight="400" fill="#7a8399">memories</text>
          <rect x="604" y="28" width="128" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" />
          <text x="668" y="56" text-anchor="middle">Models</text>
          <text x="668" y="74" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" font-weight="400" fill="#7a8399">Providers</text>
        </g>
        <!-- Store -->
        <rect x="116" y="224" width="480" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" />
        <text x="356" y="256" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">SQLite + LanceDB</text>
        <text x="356" y="276" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">~/.argos/argos.db · memory_lancedb/ · user_version 24</text>
        <rect x="604" y="224" width="128" height="72" rx="6" fill="#fff" stroke="#2d3142" />
        <text x="668" y="256" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">Jobs · Logs</text>
        <text x="668" y="276" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">background</text>
        <g font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#4f5d75">
          <rect x="24" y="320" width="10" height="10" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" />
          <text x="40" y="329">focal</text>
          <rect x="96" y="320" width="10" height="10" fill="#fff" stroke="#2d3142" />
          <text x="112" y="329">application</text>
          <rect x="216" y="320" width="10" height="10" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" />
          <text x="232" y="329">store</text>
        </g>
      </svg>
    </div>
  </main>
</body>
</html>
