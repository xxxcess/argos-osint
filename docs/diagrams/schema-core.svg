      <svg role="img" aria-labelledby="schema-core-title schema-core-desc" viewBox="0 0 880 340" xmlns="http://www.w3.org/2000/svg">
        <title id="schema-core-title">Report and investigation tables</title>
        <desc id="schema-core-desc">intel_report_attempts is the unique dispatch ledger. ON DELETE CASCADE from jobs. Schema version 24 creates the table on open if it is missing.</desc>

        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
