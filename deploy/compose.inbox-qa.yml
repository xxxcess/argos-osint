# Optional Distributed Inbox QA. Apply after compose.native-review.yml.
# Make one private, empty socket directory per executor/model pair.
x-qa-socket: &qa-socket
  type: bind
  source: ${FLEETWORKS_QA_SOCKET_DIR:?Provision a 0700 directory for this QA replica only}
  target: /run/fleetworks-qa
  bind:
    create_host_path: false

x-qa-owner: &qa-owner "${FLEETWORKS_UID:?Set the isolated workspace owner UID}:${FLEETWORKS_GID:?Set the isolated workspace owner GID}"

services:
  assistant-qa-executor:
    image: ${FLEETWORKS_RUNTIME_IMAGE:?Set the verified gateway runtime image}
    platform: ${PLATFORM:?Select the native Linux architecture}
    pull_policy: never
    command: [--role, assistant-qa]
    user: *qa-owner
    environment:
      ARGOS_HOME: /workspace
      FLEETWORKS_WORKSPACE: /workspace
      HOME: /tmp
      FLEETWORKS_STORAGE_URL: ws://surrealdb:8000
      FLEETWORKS_STORAGE_NAMESPACE: fleetworks_review
      FLEETWORKS_STORAGE_DATABASE: fleetworks_review
      FLEETWORKS_STORAGE_USERNAME: fleetworks_review
      FLEETWORKS_STORAGE_PASSWORD_FILE: /run/secrets/storage_password
      FLEETWORKS_JOBS_ORIGIN: http://jobs:8080
      FLEETWORKS_JOBS_TOKEN_FILE: /run/secrets/jobs_token
      FLEETWORKS_ACCESS_SCOPE_ID: ${FLEETWORKS_ACCESS_SCOPE_ID:?Retain the provisioned review scope}
      FLEETWORKS_ACCESS_EPOCH: ${FLEETWORKS_ACCESS_EPOCH:?Retain the provisioned review epoch}
      FLEETWORKS_QA_SOCKET: /run/fleetworks-qa/model.sock
    volumes:
      - *qa-socket
      - type: bind
        source: ${FLEETWORKS_HOST_WORKSPACE:?Select the isolated backend workspace}
        target: /workspace
        read_only: true
        bind:
          create_host_path: false
    secrets: [storage_password, jobs_token]
    depends_on:
      jobs:
        condition: service_healthy
      assistant-qa-model:
        condition: service_started
    tmpfs: [/tmp, /workspace/secrets, /workspace/storage]
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    stop_grace_period: 10s
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 64

  assistant-qa-model:
    image: ${FLEETWORKS_QA_IMAGE:?Set the verified Inbox QA model image}
    platform: ${PLATFORM}
    pull_policy: never
    user: *qa-owner
    network_mode: none
    volumes: [*qa-socket]
    tmpfs:
      - /tmp:size=16m,mode=1777
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    stop_grace_period: 10s
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 32
