<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="intel-web-title intel-web-desc">
<title id="intel-web-title">Local Intel web lifecycle</title><desc id="intel-web-desc">The foreground stack supervisor starts or adopts a loopback API, waits for storage-backed readiness, then launches the web app. The API owns one repository, shared in-process when the TUI is displayed. Standalone TUI uses core directly. The browser opens after frontend HTTP readiness. Failed readiness blocks launch; lost readiness gates the browser. Shutdown stops owned children and preserves an adopted API.</desc>
<defs><marker id="iw-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4f5d75"/></marker></defs>
<rect width="1000" height="590" fill="#f5f5f5"/>
<style>text{font-family:Geist,system-ui,sans-serif;fill:#2d3142}.heading{font-size:18px;font-weight:600}.note{font-size:13px}.line{fill:none;stroke:#4f5d75;stroke-width:2;marker-end:url(#iw-arrow)}.node{fill:white;stroke:#4f5d75;stroke-width:1.5}</style>
<text x="40" y="38" class="note">PHASE 1 · LOCAL DEVELOPMENT · NO AUTHENTICATION GATE</text>
<rect x="40" y="80" width="250" height="92" rx="6" class="node"/>
<text x="60" y="112" class="heading">Argos service launcher</text><text x="60" y="138" class="note">Ratatui wizard / stack up</text><text x="60" y="157" class="note">Terminal: TUI or service logs</text>
<path d="M290 124H364" class="line"/>
<rect x="364" y="80" width="260" height="92" rx="6" fill="white" stroke="#eb6c36" stroke-width="2"/>
<text x="384" y="112" class="heading">Rust API / shared TUI</text><text x="384" y="138" class="note">Start owned / adopt healthy instance</text><text x="384" y="157" class="note">127.0.0.1 · strict Host / Origin</text>
<path d="M624 124H700" class="line"/>
<rect x="700" y="80" width="260" height="92" rx="6" class="node"/>
<text x="720" y="112" class="heading">Core + SurrealDB</text><text x="720" y="138" class="note">One embedded owner / server lease</text><text x="720" y="157" class="note">Brief worker and repository services</text>
<path d="M494 172V232" class="line"/>
<rect x="364" y="232" width="260" height="92" rx="6" class="node"/>
<text x="384" y="264" class="heading">Storage-backed readiness</text><text x="384" y="290" class="note">Compatible API version + instance</text><text x="384" y="309" class="note">Live schema probe, bounded retries</text>
<path d="M624 278H700" class="line"/><text x="642" y="265" class="note">ready</text>
<rect x="700" y="232" width="260" height="92" rx="6" fill="white" stroke="#eb6c36" stroke-width="2"/>
<text x="720" y="264" class="heading">Next / static web UI</text><text x="720" y="290" class="note">Intel screens · no Jobs / Logs</text><text x="720" y="309" class="note">HTTP ready → open browser tab</text>
<path d="M364 278H290" class="line"/><text x="305" y="265" class="note">fail</text>
<rect x="40" y="232" width="250" height="92" rx="6" class="node"/>
<text x="60" y="264" class="heading">Abort launch</text><text x="60" y="290" class="note">Diagnostics + owned-child cleanup</text><text x="60" y="309" class="note">Preserve storage and adopted API</text>
<path d="M830 324V384" class="line"/>
<rect x="700" y="384" width="260" height="88" rx="6" class="node"/>
<text x="720" y="416" class="heading">Connection / retry gate</text><text x="720" y="442" class="note">Offline: remove working UI</text><text x="720" y="461" class="note">Recover: namespace by API instance</text>
<rect x="40" y="384" width="250" height="88" rx="6" class="node"/>
<text x="60" y="416" class="heading">stack up --tui</text><text x="60" y="442" class="note">Direct core/storage access</text><text x="60" y="461" class="note">No API listener or readiness check</text>
<path d="M40 428H20V60H830V80" class="line"/>
<rect x="364" y="384" width="260" height="88" rx="6" class="node"/>
<text x="384" y="416" class="heading">Rust Jobs → Logs</text><text x="384" y="442" class="note">Server jobs · bounded redacted events</text><text x="384" y="461" class="note">Shared repository · existing retention</text>
<path d="M494 324V384" class="line"/><text x="506" y="355" class="note">API traffic</text>
<path d="M960 278H980V494H494V472" class="line"/><text x="748" y="488" class="note">Web server output</text>
<text x="40" y="526" class="note">status / down → live supervisor capability channel → held children (no PID-file signaling)</text>
<text x="40" y="552" class="note">Builds are offline; readiness is a run-time requirement. Public deployment and native clients are deferred.</text>
</svg>
