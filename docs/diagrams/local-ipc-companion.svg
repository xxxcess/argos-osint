<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 736" role="img" aria-labelledby="local-ipc-companion-title local-ipc-companion-desc">
<title id="local-ipc-companion-title">Local IPC companion: stdio-only backend beside the native app</title>
<desc id="local-ipc-companion-desc">The native app finds its bundled argos-api-host companion beside the desktop executable, or at an explicit environment override, and never searches the bare PATH. It starts the companion with the local-ipc role and a private state directory. The two processes talk only over versioned, length-delimited binary frames on stdin and stdout, with bounded frame size and in-flight requests; stderr carries logs. The companion opens no network listener and runs embedded SurrealDB, the Jobs store and the actor search service inside its own process. The backend advertises capabilities and the app derives NLP, classifier and actor search availability from them. A clean shutdown releases worker leases. After a restart the smoke test checks the same job ID, no duplicate and eventual completion, not that the job was still active at shutdown. A Docker-free smoke test and an HTTP/IPC parity test cover the mechanics; real GUI verification stays separate.</desc>
<defs><marker id="local-ipc-companion-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4f5d75"/></marker></defs>
<style>text{font-family:Geist,system-ui,sans-serif;fill:#2d3142}.label{font-size:20px;font-weight:600}.note{font-size:16px}.zone{font-size:13px;font-weight:600;letter-spacing:1px}.node{fill:#fff;stroke:#4f5d75}.accent{fill:#fff6ed;stroke:#eb6c36}.edge{fill:none;stroke:#4f5d75;stroke-width:2;marker-end:url(#local-ipc-companion-arrow)}.minor{fill:#4f5d75;font-size:14px}.code{font-family:'Geist Mono',ui-monospace,monospace;font-size:14px}</style>
