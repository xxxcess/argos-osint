        <rect x="320" y="24" width="240" height="32" fill="rgba(235,108,54,0.12)"/>
        <text x="332" y="44" font-family="Geist,system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">intel_report_attempts</text>
