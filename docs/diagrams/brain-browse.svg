<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 336" role="img" aria-labelledby="brain-browse-title brain-browse-desc">
<title id="brain-browse-title">Private Brain read boundaries</title>
<desc id="brain-browse-desc">The Intel desktop and Brain client use the gateway. Retained actor dossiers, Focus Brief details, Related leads, and topology requests reach private Brain and read from the workspace database.</desc>
<defs>
  <marker id="brain-browse-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4f5d75"/></marker>
</defs>
<style>
  text{font-family:Geist,system-ui,sans-serif;fill:#2d3142}
  .heading{font-family:'Instrument Serif',Georgia,serif;font-size:24px}
  .label{font-size:16px;font-weight:600}
  .note{font-size:13px}
  .code{font:12px 'Geist Mono',ui-monospace,monospace}
  .zone{font-size:12px;font-weight:600;letter-spacing:1px}
  .node{fill:white;stroke:#4f5d75}
  .accent{fill:#fff6ed;stroke:#eb6c36}
  .edge,.flow{fill:none;stroke:#4f5d75;stroke-width:1.5}
  .edge{marker-end:url(#brain-browse-arrow)}
</style>
<rect width="960" height="336" fill="#f5f5f5"/>
<text x="40" y="36" class="heading" text-anchor="start">Read retained records through the Fleetworks API</text>
