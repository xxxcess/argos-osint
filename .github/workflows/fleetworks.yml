name: Fleetworks

# Pull request updates run the Linux first pass. Dispatch the second pass
# after its CI succeeds. Branch publication keeps the complete release gates.
on:
  push:
    branches: [dev, nightly, main]
  pull_request:
    branches: [dev, nightly, main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      stage:
        description: Standard verification or second pass after first-pass CI succeeds
        type: choice
        options: [standard, second]
        default: standard
      pr:
        description: Open pull request number for second pass
        type: string
      mode:
        description: Run every hosted check or compare an exact base
        type: choice
        options: [full, pr]
        default: full
      base:
        description: Exact comparison commit for pr mode
        type: string
      head:
        description: Expected checked-out commit for an exact dispatch
        type: string
      components:
        description: Standard dispatch component selection
        type: choice
        options: [auto, native, backend, all]
        default: auto
      image_builder:
        description: Use Depot for nightly reviews, or select an exact-head benchmark builder
        type: choice
        options: [auto, buildx, depot]
        default: auto
      native_embedded_image:
        description: Build a Linux x86_64 Embedded development image from the native package
        type: boolean
        default: false
      depot_linux_native_pilot:
        description: Compare Depot cold and warm Linux native builds with a same-revision GitHub baseline
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: fleetworks-${{ github.event_name }}-${{ github.event_name == 'push' && github.ref != 'refs/heads/nightly' && 'stable' || github.event.pull_request.number || github.ref }}-${{ inputs.depot_linux_native_pilot && 'depot-linux-native-pilot' || inputs.stage || 'standard' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  FLEETWORKS_STAGE: ${{ github.event_name == 'pull_request' && 'first' || inputs.stage == 'second' && 'second' || 'standard' }}
  FLEETWORKS_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  linux_native_depot_pilot:
    name: Linux native Depot pilot
    if: github.event_name == 'workflow_dispatch' && inputs.depot_linux_native_pilot
    uses: ./.github/workflows/fleetworks-native-linux-depot-pilot.yml
    with:
      expected-head: ${{ inputs.head }}
    secrets:
      depot-ci-token: ${{ secrets.DEPOT_LINUX_NATIVE_PILOT_TOKEN }}

  scope:
    name: Select verification scopes
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.depot_linux_native_pilot) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      head: ${{ steps.release.outputs.head }}
      desktop_linux: ${{ steps.verification.outputs.desktop_linux }}
      core_native_linux: ${{ steps.verification.outputs.core_native_linux }}
      desktop_macos: ${{ steps.verification.outputs.desktop_macos }}
      backend_matrix: ${{ steps.verification.outputs.backend_matrix }}
      backend_arch: ${{ steps.verification.outputs.backend_arch }}
      review_image_matrix: ${{ steps.verification.outputs.review_image_matrix }}
      review_image_builder: ${{ steps.image_execution.outputs.builder }}
      review_image_skip_reason: ${{ steps.image_execution.outputs.skip_reason }}
      depot_release: ${{ github.event_name == 'push' && github.ref == 'refs/heads/nightly' }}
      local_backend: ${{ steps.verification.outputs.local_backend }}
      server: ${{ steps.verification.outputs.server }}
      compose: ${{ steps.verification.outputs.compose }}
      queue: ${{ steps.verification.outputs.queue }}
      storage: ${{ steps.verification.outputs.storage }}
      bert: ${{ steps.verification.outputs.bert }}
      web: ${{ steps.verification.outputs.web }}
      web_dev: ${{ steps.verification.outputs.web_dev }}
      images: ${{ steps.verification.outputs.images }}
      image_targets: ${{ steps.verification.outputs.image_targets }}
      full: ${{ steps.verification.outputs.full }}
      publish: ${{ steps.release.outputs.publish }}
      release_version: ${{ steps.release.outputs.version }}
      release_tag: ${{ steps.release.outputs.tag }}
      release_image_tag: ${{ steps.release.outputs.image_tag }}
      release_plan: ${{ steps.release.outputs.plan }}
    steps:
      - name: Validate explicitly requested image build
        if: github.event_name == 'workflow_dispatch' && (inputs.image_builder != 'auto' || inputs.native_embedded_image)
        env:
          DEPOT_REVIEW_PROJECT_ID: ${{ vars.DEPOT_REVIEW_PROJECT_ID }}
          EXPECTED_HEAD: ${{ inputs.head }}
          NATIVE_EMBEDDED_IMAGE: ${{ inputs.native_embedded_image }}
          IMAGE_BUILDER: ${{ inputs.image_builder }}
          MODE: ${{ inputs.mode }}
          STAGE: ${{ inputs.stage }}
          COMPONENTS: ${{ inputs.components }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/heads/* || "$EXPECTED_HEAD" != "$GITHUB_SHA" ]]; then
            echo '::error::An explicitly requested image build requires an exact head on a repository branch'
            exit 1
          fi
          if [[ ( "$IMAGE_BUILDER" == depot || "$NATIVE_EMBEDDED_IMAGE" == true ) && -z "$DEPOT_REVIEW_PROJECT_ID" ]]; then
            echo '::error::Depot image builds require DEPOT_REVIEW_PROJECT_ID'
            exit 1
          fi
          if [[ "$IMAGE_BUILDER" == buildx && "$STAGE" != standard ]]; then
            echo '::error::Buildx image benchmarks require a standard manual dispatch'
            exit 1
          fi
          if [[ "$NATIVE_EMBEDDED_IMAGE" == true && ( "$IMAGE_BUILDER" == buildx || "$MODE" != full || "$STAGE" != standard || ( "$COMPONENTS" != native && "$COMPONENTS" != all ) ) ]]; then
            echo '::error::The native Embedded image requires a standard full dispatch with components=native or all and Depot enabled'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.FLEETWORKS_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate second pass against the open PR and green first pass
        if: inputs.stage == 'second'
        id: promotion
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
          EXPECTED_HEAD: ${{ inputs.head }}
          STANDARD_BASE: ${{ inputs.base }}
          COMPONENTS: ${{ inputs.components }}
        run: python3 .github/scripts/fleetworks_ci.py promote --output "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check documentation and repository policy
        run: |
          python3 scripts/fleetworks_doc_links.py
          node scripts/release_check.mjs versions
          if [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == pull_request ]]; then
            node scripts/release_check.mjs event
          fi
          node --test .opencode/tests/*.test.mjs
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Classify changes at the event head
        id: plan
        env:
          FLEETWORKS_BASE: ${{ steps.promotion.outputs.base || github.event.pull_request.base.sha || github.event.before }}
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_BASE: ${{ inputs.base }}
          DISPATCH_HEAD: ${{ inputs.head }}
          DISPATCH_COMPONENTS: ${{ inputs.components }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$DISPATCH_HEAD" && "$DISPATCH_HEAD" != "$FLEETWORKS_HEAD" ]]; then
            echo '::error::Dispatch ref moved away from the requested revision'
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "${DISPATCH_COMPONENTS:-auto}" != auto ]]; then
            if [[ ! "$DISPATCH_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
              echo '::error::Explicit component dispatch requires an exact expected head SHA'
              exit 1
            fi
          fi
          python3 -B -m unittest discover -s scripts -p 'test_fleetworks_*.py'
          rm -f "$RUNNER_TEMP/trusted-planner-ready"
          mode=pr
          event="$GITHUB_EVENT_NAME"
          base="$FLEETWORKS_BASE"
          components="${DISPATCH_COMPONENTS:-auto}"
          if [[ "$FLEETWORKS_STAGE" != standard ]]; then
            if [[ ! "$base" =~ ^[0-9a-f]{40}$ || "$base" =~ ^0+$ ]]; then
              echo '::error::Pull request comparison requires a valid base SHA'
              exit 1
            fi
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$base"
            fi
            planner_root="$RUNNER_TEMP/trusted-planner"
            rm -rf "$planner_root"
            if git cat-file -e "${base}:scripts/fleetworks_verify.py" 2>/dev/null \
              && git cat-file -e "${base}:scripts/fleetworks_native_verify.py" 2>/dev/null \
              && git cat-file -e "${base}:scripts/fleetworks_release.py" 2>/dev/null; then
              mkdir -p "$planner_root"
              git archive "$base" scripts | tar -x -C "$planner_root"
              touch "$RUNNER_TEMP/trusted-planner-ready"
              PYTHONPATH="$planner_root/scripts" python3 .github/scripts/fleetworks_ci.py compare \
                --base "$base" --head "$FLEETWORKS_HEAD" --output "$RUNNER_TEMP/scope.json"
            else
              BASE="$base" HEAD_SHA="$FLEETWORKS_HEAD" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          scopes = [
              "bert",
              "compose",
              "desktop",
              "images",
              "local_backend",
              "queue",
              "server",
              "storage",
              "web",
              "web_dev",
          ]
          image_targets = ["runtime", "search-index", "surrealdb", "web"]
          image_arches = ["amd64", "arm64"]
          scope = {
              "base": os.environ["BASE"],
              "components": "all",
              "event": "pull_request",
              "format": 1,
              "full": False,
              "head": os.environ["HEAD_SHA"],
              "image_arches": image_arches,
              "image_targets": image_targets,
              "reason": "Trusted base does not include the planner; selecting all scopes for this pass",
              "scopes": scopes,
          }
          Path(os.environ["RUNNER_TEMP"], "scope.json").write_text(
              json.dumps(scope, indent=2, sort_keys=True) + "\n"
          )

          PY
            fi
          else
            if [[ "$event" == schedule || ( "$event" == workflow_dispatch && "$DISPATCH_MODE" != pr ) ]]; then
              mode=full
            elif [[ "$event" == workflow_dispatch ]]; then
              if [[ ! "$DISPATCH_BASE" =~ ^[0-9a-f]{40}$ || "$DISPATCH_BASE" =~ ^0+$ ]]; then
                echo '::error::Scoped dispatch requires an exact comparison SHA'
                exit 1
              fi
              event=pull_request
              base="$DISPATCH_BASE"
            fi
            python3 scripts/fleetworks_verify.py "$mode" \
              --event "$event" --base "$base" \
              --head "$FLEETWORKS_HEAD" --components "$components" \
              --github-output "$GITHUB_OUTPUT" --json-output "$RUNNER_TEMP/scope.json"
          fi
          printf 'head=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Plan source-scoped branch publication
        id: release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          temporary = Path(os.environ["RUNNER_TEMP"])
          scope = json.loads((temporary / "scope.json").read_text())
          event = os.environ["GITHUB_EVENT_NAME"]
          # A scoped manual dispatch compares like a PR, but cannot publish.
          scope["event"] = event
          (temporary / "release-scope.json").write_text(json.dumps(scope))
          trusted_marker = temporary / "trusted-planner-ready"
          staged = os.environ["FLEETWORKS_STAGE"] != "standard"
          if staged and not trusted_marker.exists():
              plan = {
                  "backend": True,
                  "base": scope["base"] or "",
                  "bert": True,
                  "channel": "",
                  "event": event,
                  "format": 1,
                  "head": os.environ["FLEETWORKS_HEAD"],
                  "image_tag": "",
                  "image_targets": scope["image_targets"],
                  "native": True,
                  "prerelease": False,
                  "publish": False,
                  "ref": os.environ["GITHUB_REF"],
                  "release_base": "",
                  "scope": scope,
                  "tag": "",
                  "untyped_commits": 0,
                  "version": "",
                  "web": True,
              }
              (temporary / "release.json").write_text(
                  json.dumps(plan, indent=2, sort_keys=True) + "\n"
              )
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  print("publish=false", file=output)
                  print(f"head={plan['head']}", file=output)
                  print(f"base={plan['base']}", file=output)
                  print("release_base=", file=output)
                  print("version=", file=output)
                  print("tag=", file=output)
                  print("image_tag=", file=output)
                  print("channel=", file=output)
                  print("prerelease=false", file=output)
                  print("native=true", file=output)
                  print("backend=true", file=output)
                  print("untyped_commits=0", file=output)
                  print("release_web=true", file=output)
          else:
              if staged:
                  planner_scripts = str(temporary / "trusted-planner" / "scripts")
                  env = dict(os.environ, PYTHONPATH=planner_scripts)
                  args = [
                      "plan",
                      "--event", scope["event"], "--ref", os.environ["GITHUB_REF"],
                      "--head", os.environ["FLEETWORKS_HEAD"], "--base", scope["base"] or "",
                      "--scope-plan", str(temporary / "release-scope.json"),
                      "--json-output", str(temporary / "release.json"),
                      "--github-output", os.environ["GITHUB_OUTPUT"],
                  ]
                  subprocess.run([
                      sys.executable, "-c",
                      "import sys, pathlib, fleetworks_release; "
                      "fleetworks_release.ROOT = pathlib.Path.cwd(); "
                      "sys.argv = ['fleetworks_release.py', *sys.argv[1:]]; "
                      "raise SystemExit(fleetworks_release.main())",
                      *args,
                  ], check=True, env=env)
              else:
                  subprocess.run([sys.executable, "scripts/fleetworks_release.py", "plan",
                      "--event", scope["event"], "--ref", os.environ["GITHUB_REF"],
                      "--head", os.environ["FLEETWORKS_HEAD"], "--base", scope["base"] or "",
                      "--scope-plan", str(temporary / "release-scope.json"),
                      "--json-output", str(temporary / "release.json"),
                      "--github-output", os.environ["GITHUB_OUTPUT"]], check=True)
              plan = json.loads((temporary / "release.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print("plan=" + json.dumps(plan, separators=(",", ":")), file=output)
          PY

      - name: Select jobs for the current pass
        id: verification
        run: |
          python3 .github/scripts/fleetworks_ci.py select --stage "$FLEETWORKS_STAGE" \
            --plan "$RUNNER_TEMP/release.json" --output "$GITHUB_OUTPUT"

      - name: Require a separate Depot project for nightly release images
        if: github.event_name == 'push' && github.ref == 'refs/heads/nightly' && steps.release.outputs.publish == 'true' && steps.verification.outputs.images == 'true'
        env:
          DEPOT_RELEASE_PROJECT_ID: ${{ vars.DEPOT_RELEASE_PROJECT_ID }}
          DEPOT_REVIEW_PROJECT_ID: ${{ vars.DEPOT_REVIEW_PROJECT_ID }}
        shell: bash
        run: |
          if [[ -z "$DEPOT_RELEASE_PROJECT_ID" || "$DEPOT_RELEASE_PROJECT_ID" == "$DEPOT_REVIEW_PROJECT_ID" ]]; then
            echo '::error::Set DEPOT_RELEASE_PROJECT_ID to a Depot project separate from DEPOT_REVIEW_PROJECT_ID for nightly release images'
            exit 1
          fi

      - name: Route selected review image builds
        id: image_execution
        if: steps.verification.outputs.review_images == 'true'
        env:
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          BUILDX_BENCHMARK: ${{ github.event_name == 'workflow_dispatch' && inputs.stage == 'standard' && inputs.image_builder == 'buildx' }}
          DEPOT_ELIGIBLE: >-
            ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'nightly')
              || (github.event_name == 'workflow_dispatch'
                && ((github.ref == 'refs/heads/nightly' && inputs.stage == 'standard')
                  || (inputs.stage == 'second' && steps.promotion.outputs.base_ref == 'nightly')
                  || inputs.image_builder == 'depot'))
              || (github.event_name == 'push' && github.ref == 'refs/heads/nightly') }}
          DEPOT_REVIEW_PROJECT_ID: ${{ vars.DEPOT_REVIEW_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$FORK_PR" == true ]]; then
            printf '%s\n' 'skip_reason=fork' >> "$GITHUB_OUTPUT"
          elif [[ "$BUILDX_BENCHMARK" == true ]]; then
            printf '%s\n' 'builder=buildx' >> "$GITHUB_OUTPUT"
          elif [[ "$DEPOT_ELIGIBLE" == true ]]; then
            if [[ -z "$DEPOT_REVIEW_PROJECT_ID" ]]; then
              echo '::error::Selected Docker review images require DEPOT_REVIEW_PROJECT_ID'
              exit 1
            fi
            printf '%s\n' 'builder=depot' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' 'skip_reason=outside_nightly' >> "$GITHUB_OUTPUT"
          fi

      - name: Clean up trusted planner checkout
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/trusted-planner" "$RUNNER_TEMP/trusted-planner-ready"

  gsd_core:
    name: "GSD Nightly: Core"
    needs: scope
    if: >-
      needs.scope.outputs.core_native_linux == 'true' || needs.scope.outputs.server == 'true' ||
      needs.scope.outputs.storage == 'true' || needs.scope.outputs.bert == 'true'
    uses: ./.github/workflows/gsd-nightly-core.yml
    with:
      head: ${{ needs.scope.outputs.head }}
      full: ${{ needs.scope.outputs.full == 'true' }}
      publish: ${{ needs.scope.outputs.publish == 'true' }}
      release-version: ${{ needs.scope.outputs.publish == 'true' && needs.scope.outputs.release_version || '' }}
      linux-native: ${{ needs.scope.outputs.core_native_linux == 'true' }}
      backend-arch: ${{ needs.scope.outputs.backend_arch }}
      backend-matrix: ${{ needs.scope.outputs.backend_matrix }}
      server: ${{ needs.scope.outputs.server == 'true' }}
      storage: ${{ needs.scope.outputs.storage == 'true' }}
      queue: ${{ needs.scope.outputs.queue == 'true' }}
      bert: ${{ needs.scope.outputs.bert == 'true' }}
    secrets:
      depot-ci-token: ${{ github.event_name == 'push' && github.ref == 'refs/heads/nightly' && needs.scope.outputs.core_native_linux == 'true' && needs.scope.outputs.publish == 'true' && vars.DEPOT_NIGHTLY_NATIVE_ENABLED == 'true' && secrets.DEPOT_LINUX_NATIVE_PILOT_TOKEN || '' }}

  gsd_ui:
    name: "GSD Nightly: UI"
    needs: scope
    if: >-
      (needs.scope.outputs.desktop_linux == 'true' && needs.scope.outputs.core_native_linux != 'true') ||
      needs.scope.outputs.desktop_macos == 'true' || needs.scope.outputs.web == 'true'
    uses: ./.github/workflows/gsd-nightly-ui.yml
    with:
      head: ${{ needs.scope.outputs.head }}
      full: ${{ needs.scope.outputs.full == 'true' }}
      publish: ${{ needs.scope.outputs.publish == 'true' }}
      release-version: ${{ needs.scope.outputs.publish == 'true' && needs.scope.outputs.release_version || '' }}
      linux-native: ${{ needs.scope.outputs.desktop_linux == 'true' && needs.scope.outputs.core_native_linux != 'true' }}
      macos: ${{ needs.scope.outputs.desktop_macos == 'true' }}
      web: ${{ needs.scope.outputs.web == 'true' }}
      web-dev: ${{ needs.scope.outputs.web_dev == 'true' }}
    secrets:
      depot-ci-token: ${{ github.event_name == 'push' && github.ref == 'refs/heads/nightly' && needs.scope.outputs.desktop_linux == 'true' && needs.scope.outputs.core_native_linux != 'true' && needs.scope.outputs.publish == 'true' && vars.DEPOT_NIGHTLY_NATIVE_ENABLED == 'true' && secrets.DEPOT_LINUX_NATIVE_PILOT_TOKEN || '' }}

  images_buildx_benchmark:
    name: Docker image benchmark (Buildx) / Linux ${{ matrix.arch }}
    needs: scope
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'standard' && inputs.image_builder == 'buildx' && needs.scope.outputs.review_image_builder == 'buildx'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.scope.outputs.review_image_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      IMAGE_BUILDER: buildx
    steps: &image_check_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.scope.outputs.head }}
          persist-credentials: false
          lfs: false
      - name: Test selected private search contracts
        if: contains(matrix.targets, 'search-index')
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          python3 scripts/agent_cargo.py test --locked --no-default-features -p fleetworks-search-index
      - &install_depot
        name: Install pinned Depot CLI
        if: env.IMAGE_BUILDER == 'depot'
        uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1
        with:
          version: 2.103.29
      - name: Build selected image closure and smoke exact container IDs
        env:
          IMAGE_TARGETS: ${{ matrix.targets }}
          IMAGE_ARCH: ${{ matrix.arch }}
          OWNER: ${{ github.repository_owner }}
          COMPOSE_SELECTED: ${{ matrix.compose }}
          DEV_SMOKE: ${{ matrix.dev }}
        shell: bash
        run: |
          set -euo pipefail
          smoke=()
          if [[ "$COMPOSE_SELECTED" == true ]]; then smoke+=(--compose); fi
          if [[ "$DEV_SMOKE" == true ]]; then smoke+=(--dev-smoke); fi
          builder=(--builder "$IMAGE_BUILDER")
          if [[ "$IMAGE_BUILDER" == depot ]]; then
            builder+=(--depot-project "${DEPOT_REVIEW_PROJECT_ID:?Depot review project is required}")
          fi
          python3 -B -m unittest discover -s deploy -p 'test_*.py'
          python3 .github/scripts/release_images.py --revision "$FLEETWORKS_HEAD" \
            --version "$(cat version.txt)" --image-tag "review-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --targets "$IMAGE_TARGETS" --arch "$IMAGE_ARCH" --registry "ghcr.io/${OWNER,,}" \
            --directory "$RUNNER_TEMP/image-checks" "${builder[@]}" "${smoke[@]}"
      - name: Retain exact image smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Fleetworks-Docker-Smoke-and-Timings-${{ env.IMAGE_BUILDER }}-Linux-${{ matrix.arch }}-${{ github.run_id }}.${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/image-checks/*.json
            .agent-scratch/native-review/images-*/public-smoke-*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  images_depot:
    name: Image checks (Depot) / Linux ${{ matrix.arch }}
    needs: scope
    if: needs.scope.outputs.review_image_builder == 'depot'
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.scope.outputs.review_image_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      IMAGE_BUILDER: depot
      DEPOT_REVIEW_PROJECT_ID: ${{ vars.DEPOT_REVIEW_PROJECT_ID }}
    steps: *image_check_steps

  native_embedded_image:
    name: Embedded desktop development image (Depot) / Linux x86_64
    needs: [scope, gsd_ui]
    if: >-
      always() && needs.scope.result == 'success' && github.event_name == 'workflow_dispatch' &&
      inputs.native_embedded_image && needs.gsd_ui.outputs.desktop_linux_result == 'success' &&
      needs.scope.outputs.publish != 'true'
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE_BUILDER: depot
      DEPOT_REVIEW_PROJECT_ID: ${{ vars.DEPOT_REVIEW_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.scope.outputs.head }}
          persist-credentials: false
          lfs: false
      - name: Select exact Linux native package artifact
        id: native_candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          prefix="Fleetworks-Linux-Desktop-App-x86_64-debug-$FLEETWORKS_HEAD-$GITHUB_RUN_ID."
          artifact="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" |
            jq -er --arg prefix "$prefix" --argjson max_attempt "$GITHUB_RUN_ATTEMPT" '
              [ .[].artifacts[]
                | select(.expired == false and (.id | type == "number") and (.name | startswith($prefix)))
                | . + {attempt: (.name | ltrimstr($prefix) | select(test("^[1-9][0-9]*$")) | tonumber)}
                | select(.attempt <= $max_attempt) ]
              | (group_by(.attempt) | last) // []
              | if length == 1 then .[0] | [.id, .attempt] | @tsv
                else error("Expected exactly one Linux native package artifact at the latest eligible attempt") end
            ')"
          IFS=$'\t' read -r artifact_id candidate_attempt <<< "$artifact"
          printf 'artifact_id=%s\ncandidate_attempt=%s\n' "$artifact_id" "$candidate_attempt" >> "$GITHUB_OUTPUT"
      - name: Download and verify selected artifact digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.native_candidate.outputs.artifact_id }}
          path: ${{ runner.temp }}/native-embedded-candidate
          digest-mismatch: error
      - *install_depot
      - name: Build, smoke, and export the Embedded development image
        env:
          CANDIDATE_ATTEMPT: ${{ steps.native_candidate.outputs.candidate_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          candidate="$RUNNER_TEMP/native-embedded-candidate"
          archives=("$candidate"/Fleetworks-*.tar.gz)
          manifests=("$candidate"/Fleetworks-*.manifest.json)
          if (( ${#archives[@]} != 1 || ${#manifests[@]} != 1 )); then
            echo '::error::The Linux native package must contain one archive and one manifest'
            exit 1
          fi
          archive="${archives[0]}"
          if [[ ! -f "$archive.sha256" ]]; then
            echo '::error::The Linux native package must contain the archive SHA-256 sidecar'
            exit 1
          fi
          version="$(cat version.txt)"
          if ! jq -e --arg revision "$FLEETWORKS_HEAD" --arg version "$version" --arg run_id "$GITHUB_RUN_ID" --arg attempt "$CANDIDATE_ATTEMPT" '
            .revision == $revision and .version == $version and .run_id == $run_id and .run_attempt == $attempt
            and .platform == "linux" and .target == "x86_64-unknown-linux-gnu" and .profile == "debug" and .dirty == false
            and .companion.relative_path == "bin/argos-api-host"
          ' "${manifests[0]}" >/dev/null; then
            echo '::error::The Linux native package manifest does not match the requested Embedded build'
            exit 1
          fi
          read -r digest _ < "$archive.sha256"
          output="$RUNNER_TEMP/native-embedded-image"
          image_archive="$output/fleetworks-native-embedded-linux-x86_64-${FLEETWORKS_HEAD:0:12}.tar.gz"
          mkdir -p "$output"
          python3 scripts/fleetworks_native_embedded_image.py --archive "$archive" --sha256 "$digest" \
            --revision "$FLEETWORKS_HEAD" --version "$version" --profile debug --builder depot \
            --depot-project "$DEPOT_REVIEW_PROJECT_ID" --tag "fleetworks-native-embedded:dev-$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" \
            --output "$image_archive" | tee "$output/image.json"
          test -s "$image_archive"
          test -s "$image_archive.sha256"
      - name: Upload development image archive and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Fleetworks-Embedded-Desktop-Docker-Archive-Linux-x86_64-${{ needs.scope.outputs.head }}-${{ github.run_id }}.${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-embedded-image/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  source_checks:
    name: ${{ inputs.stage == 'second' && 'Fleetworks second pass source checks' || github.event_name == 'workflow_dispatch' && 'Fleetworks manual source checks' || 'Fleetworks source checks' }}
    needs: [scope, gsd_core, gsd_ui, images_buildx_benchmark, images_depot, native_embedded_image]
    if: always() && !(github.event_name == 'workflow_dispatch' && inputs.depot_linux_native_pilot)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require success for every selected scope
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          PUBLISH_SELECTED: ${{ needs.scope.outputs.publish }}
          MAC_SELECTED: ${{ needs.scope.outputs.desktop_macos }}
          CORE_LINUX_SELECTED: ${{ needs.scope.outputs.core_native_linux }}
          UI_LINUX_SELECTED: ${{ needs.scope.outputs.desktop_linux == 'true' && needs.scope.outputs.core_native_linux != 'true' }}
          LOCAL_BACKEND_SELECTED: ${{ needs.scope.outputs.local_backend }}
          SERVER_SELECTED: ${{ needs.scope.outputs.server }}
          BERT_SELECTED: ${{ needs.scope.outputs.bert }}
          WEB_SELECTED: ${{ needs.scope.outputs.web }}
          WEB_DEV_SELECTED: ${{ needs.scope.outputs.web_dev }}
          BUILDX_BENCHMARK_SELECTED: ${{ needs.scope.outputs.review_image_builder == 'buildx' }}
          DEPOT_IMAGES_SELECTED: ${{ needs.scope.outputs.review_image_builder == 'depot' }}
          REVIEW_IMAGE_SKIP_REASON: ${{ needs.scope.outputs.review_image_skip_reason }}
          NATIVE_EMBEDDED_IMAGE_SELECTED: ${{ github.event_name == 'workflow_dispatch' && inputs.native_embedded_image }}
          IMAGE_TARGETS: ${{ needs.scope.outputs.image_targets }}
          QUEUE_SELECTED: ${{ needs.scope.outputs.queue }}
          STORAGE_SELECTED: ${{ needs.scope.outputs.storage }}
          DESKTOP_RESULT: ${{ needs.gsd_ui.result == 'skipped' && 'skipped' || needs.gsd_ui.outputs.desktop_result }}
          CORE_LINUX_RESULT: ${{ needs.gsd_core.result == 'skipped' && 'skipped' || needs.gsd_core.outputs.desktop_linux_result }}
          UI_LINUX_RESULT: ${{ needs.gsd_ui.result == 'skipped' && 'skipped' || needs.gsd_ui.outputs.desktop_linux_result }}
          SERVER_RESULT: ${{ needs.gsd_core.result == 'skipped' && 'skipped' || needs.gsd_core.outputs.server_result }}
          EMBEDDED_RESULT: ${{ needs.gsd_core.result == 'skipped' && 'skipped' || needs.gsd_core.outputs.embedded_result }}
          BERT_RESULT: ${{ needs.gsd_core.result == 'skipped' && 'skipped' || needs.gsd_core.outputs.bert_result }}
          WEB_RESULT: ${{ needs.gsd_ui.result == 'skipped' && 'skipped' || needs.gsd_ui.outputs.web_result }}
          BUILDX_BENCHMARK_RESULT: ${{ needs.images_buildx_benchmark.result }}
          DEPOT_IMAGES_RESULT: ${{ needs.images_depot.result }}
          NATIVE_EMBEDDED_IMAGE_RESULT: ${{ needs.native_embedded_image.result }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'Fleetworks revision `%s`\n\n' "$FLEETWORKS_HEAD" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$SCOPE_RESULT" != success ]]; then
            echo "::error::Scope planning finished with $SCOPE_RESULT"
            printf 'Scope planning: %s\n' "${SCOPE_RESULT:-missing}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          verify() {
            printf '%s: selected=%s result=%s\n' "$1" "${2:-missing}" "${3:-missing}" >> "$GITHUB_STEP_SUMMARY"
            case "$2:$3" in
              true:success|false:skipped) ;;
              *) echo "::error::$1 selected=${2:-missing} result=${3:-missing}"; return 1 ;;
            esac
          }
          # Other platform app builds always report, but only block trusted publication, whose
          # release plan attaches their archives. A red build stays red in its own check.
          report() {
            printf '%s (reported, not required): selected=%s result=%s\n' "$1" "${2:-missing}" "${3:-missing}" >> "$GITHUB_STEP_SUMMARY"
            case "$2:$3" in
              true:success|false:skipped) ;;
              true:failure) echo "::warning::$1 failed; it does not block this gate" ;;
              *) echo "::notice::$1 selected=${2:-missing} result=${3:-missing}; it does not block this gate" ;;
            esac
          }
          failed=0
          for value in "$QUEUE_SELECTED" "$STORAGE_SELECTED"; do
            case "$value:$SERVER_SELECTED" in
              true:true|false:true|false:false) ;;
              *) echo '::error::Queue and storage scopes need the server gate'; failed=1 ;;
            esac
          done
          case "$WEB_DEV_SELECTED:$WEB_SELECTED" in
            true:true|false:true|false:false) ;;
            *) echo '::error::Development browser scope needs the web gate'; failed=1 ;;
          esac
          if [[ "$PUBLISH_SELECTED" == true || "$FLEETWORKS_STAGE" != standard ]]; then
            verify desktop "$MAC_SELECTED" "$DESKTOP_RESULT" || failed=1
          else
            report desktop "$MAC_SELECTED" "$DESKTOP_RESULT"
          fi
          verify "Core Linux native" "$CORE_LINUX_SELECTED" "$CORE_LINUX_RESULT" || failed=1
          verify "UI Linux native" "$UI_LINUX_SELECTED" "$UI_LINUX_RESULT" || failed=1
          verify server "$SERVER_SELECTED" "$SERVER_RESULT" || failed=1
          verify embedded "$STORAGE_SELECTED" "$EMBEDDED_RESULT" || failed=1
          verify bert "$BERT_SELECTED" "$BERT_RESULT" || failed=1
          verify web "$WEB_SELECTED" "$WEB_RESULT" || failed=1
          verify images_buildx_benchmark "$BUILDX_BENCHMARK_SELECTED" "$BUILDX_BENCHMARK_RESULT" || failed=1
          verify images_depot "$DEPOT_IMAGES_SELECTED" "$DEPOT_IMAGES_RESULT" || failed=1
          verify native_embedded_image "$NATIVE_EMBEDDED_IMAGE_SELECTED" "$NATIVE_EMBEDDED_IMAGE_RESULT" || failed=1
          case "$REVIEW_IMAGE_SKIP_REASON" in
            fork) reason='fork pull requests cannot use the Depot review project' ;;
            outside_nightly) reason='outside the nightly rollout; use an exact-head manual Depot dispatch to verify' ;;
            *) reason='' ;;
          esac
          if [[ -n "$reason" ]]; then
            printf '::notice::Docker review images skipped: %s\n' "$reason"
            printf 'Docker review images: skipped (%s).\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
          fi
          printf 'Server images: %s\n' "${IMAGE_TARGETS:-none}" >> "$GITHUB_STEP_SUMMARY"
          printf 'Queue selected: %s. Storage selected: %s. Local backend selected: %s. Development browser selected: %s.\n' \
            "${QUEUE_SELECTED:-missing}" "${STORAGE_SELECTED:-missing}" \
            "${LOCAL_BACKEND_SELECTED:-missing}" "${WEB_DEV_SELECTED:-missing}" >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"

  release_images:
    name: Verified release image staging / Linux ${{ matrix.arch }}
    needs: [scope, source_checks]
    if: always() && needs.scope.result == 'success' && needs.source_checks.result == 'success' && needs.scope.outputs.publish == 'true' && needs.scope.outputs.images == 'true' && github.event_name == 'push' && contains(fromJson('["refs/heads/dev","refs/heads/main"]'), github.ref)
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      IMAGE_BUILDER: buildx
    steps: &release_image_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.scope.outputs.head }}
          persist-credentials: false
          lfs: false
      - *install_depot
      - name: Test selected private search contracts
        if: contains(needs.scope.outputs.image_targets, 'search-index')
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          python3 scripts/agent_cargo.py test --locked --no-default-features -p fleetworks-search-index
      - name: Authenticate trusted image staging
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build once, smoke exact IDs, stage digests and export archives
        env:
          HEAD: ${{ needs.scope.outputs.head }}
          VERSION: ${{ needs.scope.outputs.release_version }}
          IMAGE_TAG: ${{ needs.scope.outputs.release_image_tag }}
          IMAGE_TARGETS: ${{ needs.scope.outputs.image_targets }}
          IMAGE_ARCH: ${{ matrix.arch }}
          OWNER: ${{ github.repository_owner }}
          COMPOSE_SELECTED: ${{ needs.scope.outputs.compose == 'true' }}
          DEPOT_TOKEN: ${{ env.IMAGE_BUILDER == 'depot' && secrets.DEPOT_RELEASE_TOKEN || '' }}
        shell: bash
        run: |
          set -euo pipefail
          registry="ghcr.io/${OWNER,,}"
          compose=()
          if [[ "$COMPOSE_SELECTED" == true ]]; then compose=(--compose); fi
          builder=(--builder "$IMAGE_BUILDER")
          if [[ "$IMAGE_BUILDER" == depot ]]; then
            if [[ -z "$DEPOT_RELEASE_PROJECT_ID" || "$DEPOT_RELEASE_PROJECT_ID" == "$DEPOT_REVIEW_PROJECT_ID" || -z "$DEPOT_TOKEN" ]]; then
              echo '::error::Nightly Depot staging requires a distinct release project and its protected environment token'
              exit 1
            fi
            builder+=(--depot-project "$DEPOT_RELEASE_PROJECT_ID")
          fi
          python3 .github/scripts/release_images.py --revision "$HEAD" --version "$VERSION" \
            --image-tag "$IMAGE_TAG" --targets "$IMAGE_TARGETS" --arch "$IMAGE_ARCH" \
            --registry "$registry" --directory "$RUNNER_TEMP/release-images" --push "${builder[@]}" "${compose[@]}"
      - name: Retain exact staged digest identities and exported image archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Fleetworks-Release-Docker-Images-Linux-${{ matrix.arch }}-${{ github.run_id }}.${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-images/release-images-*.json
            ${{ runner.temp }}/release-images/fleetworks-images-linux-*.tar.gz
            ${{ runner.temp }}/release-images/fleetworks-images-linux-*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain actual image smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Fleetworks-Release-Docker-Smoke-Linux-${{ matrix.arch }}-${{ github.run_id }}.${{ github.run_attempt }}
          path: .agent-scratch/native-review/images-*/public-smoke-*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  release_images_depot:
    name: Verified release image staging (Depot) / Linux ${{ matrix.arch }}
    needs: [scope, source_checks]
    if: always() && needs.scope.result == 'success' && needs.source_checks.result == 'success' && needs.scope.outputs.publish == 'true' && needs.scope.outputs.images == 'true' && needs.scope.outputs.depot_release == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/nightly'
    permissions:
      contents: read
      packages: write
    environment: fleetworks-release-images
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      IMAGE_BUILDER: depot
      DEPOT_RELEASE_PROJECT_ID: ${{ vars.DEPOT_RELEASE_PROJECT_ID }}
      DEPOT_REVIEW_PROJECT_ID: ${{ vars.DEPOT_REVIEW_PROJECT_ID }}
    steps: *release_image_steps

  prepublish:
    name: ${{ inputs.stage == 'second' && 'Fleetworks second pass artifact checks' || github.event_name == 'workflow_dispatch' && 'Fleetworks manual artifact checks' || 'Fleetworks artifact checks' }}
    needs: [scope, source_checks, release_images, release_images_depot]
    if: always() && !(github.event_name == 'workflow_dispatch' && inputs.depot_linux_native_pilot)
    runs-on: ubuntu-24.04
    steps:
      - name: Require source checks and every selected release image
        env:
          SOURCE_RESULT: ${{ needs.source_checks.result }}
          BUILDX_SELECTED: ${{ needs.scope.outputs.publish == 'true' && needs.scope.outputs.images == 'true' && needs.scope.outputs.depot_release != 'true' }}
          DEPOT_SELECTED: ${{ needs.scope.outputs.publish == 'true' && needs.scope.outputs.images == 'true' && needs.scope.outputs.depot_release == 'true' }}
          BUILDX_RESULT: ${{ needs.release_images.result }}
          DEPOT_RESULT: ${{ needs.release_images_depot.result }}
        run: |
          set -euo pipefail
          test "$SOURCE_RESULT" = success
          verify_staging() {
            case "$2:$3" in
              true:success|false:skipped) ;;
              *) echo "::error::$1 staging selected=$2 result=$3"; return 1 ;;
            esac
          }
          verify_staging Buildx "$BUILDX_SELECTED" "$BUILDX_RESULT"
          verify_staging Depot "$DEPOT_SELECTED" "$DEPOT_RESULT"

  publish:
    name: Publish verified version and channel
    needs: [scope, prepublish]
    if: always() && needs.scope.result == 'success' && needs.prepublish.result == 'success' && needs.scope.outputs.publish == 'true' && github.event_name == 'push' && contains(fromJson('["refs/heads/dev","refs/heads/nightly","refs/heads/main"]'), github.ref)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.scope.outputs.head }}
          persist-credentials: false
      - name: Download current-run verified native archives
        if: fromJson(needs.scope.outputs.release_plan).native
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Fleetworks-macOS-Desktop-App-*-${{ github.run_id }}.${{ github.run_attempt }}
          path: ${{ runner.temp }}/release
          digest-mismatch: error
      - name: Download current-run verified Linux digests and image archives
        if: needs.scope.outputs.images == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Fleetworks-Release-Docker-Images-Linux-*-${{ github.run_id }}.${{ github.run_attempt }}
          path: ${{ runner.temp }}/release
          digest-mismatch: error
      - name: Download current-run verified Atlas BERT Linux worker bundles
        if: fromJson(needs.scope.outputs.release_plan).bert
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Fleetworks-Atlas-BERT-Worker-Bundle-Linux-*-${{ needs.scope.outputs.head }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release
          digest-mismatch: error
      - name: Promote only the verified source plan
        env:
          RELEASE_PLAN: ${{ needs.scope.outputs.release_plan }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          mkdir -p "$RUNNER_TEMP/release"
          printf '%s\n' "$RELEASE_PLAN" > "$RUNNER_TEMP/release-plan.json"
          python3 .github/scripts/publish_release.py --plan "$RUNNER_TEMP/release-plan.json" \
            --directory "$RUNNER_TEMP/release"

  required:
    name: ${{ inputs.stage == 'second' && 'Fleetworks second pass' || github.event_name == 'workflow_dispatch' && 'Fleetworks manual verification' || 'Fleetworks required' }}
    needs: [scope, prepublish, publish]
    if: always() && !(github.event_name == 'workflow_dispatch' && inputs.depot_linux_native_pilot)
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected check and publication
        env:
          CHECKS_RESULT: ${{ needs.prepublish.result }}
          PUBLISH_SELECTED: ${{ needs.scope.outputs.publish }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          test "$CHECKS_RESULT" = success
          case "$PUBLISH_SELECTED:$PUBLISH_RESULT" in
            true:success|false:skipped) ;;
            *) exit 1 ;;
          esac
