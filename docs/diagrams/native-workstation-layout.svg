<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="native-workstation-layout-title native-workstation-layout-desc">
<title id="native-workstation-layout-title">Native workstation shell and settings composition</title>
<desc id="native-workstation-layout-desc">A toolbar with telemetry, an Inbox bell and an optional Assistant toggle. The brand avatar opens Workstation Status from the rail. The central scroll area shows expanded Status checks with row action icons. The collapsed Diagnostics disclosure below contains backend connection details and Embedded capabilities. Operations pages can show a read-only context rail on wide windows. The optional Assistant can dock there with a pinned context, history and composer. The Inbox popover opens below the toolbar bell and preserves the selected destination and Assistant. Jobs and Logs opens the selected job in a separate log view. Workstation Settings opens a centered category and content dialog. Narrow windows hide the right panel while keeping the same controls.</desc>
