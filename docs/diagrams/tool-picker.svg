      <svg role="img" aria-labelledby="tool-picker-title tool-picker-desc" viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg">
        <title id="tool-picker-title">Tool picker transport</title>
        <desc id="tool-picker-desc">Jev decisions models call OpenRouter /alpha/decisions. Every other picker model uses chat with JSON repair. An unreachable picker falls back to a deterministic order.</desc>

        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="720" height="360" fill="#f5f5f5"/>

        <ellipse cx="360" cy="40" rx="72" ry="24" fill="#fff" stroke="#2d3142"/>
        <text x="360" y="44" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">Need a pick</text>
        <path d="M360 64 V92" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <polygon points="360,96 444,148 360,200 276,148" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="360" y="144" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">Jev model?</text>
        <text x="360" y="162" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">typesafe/jev-*</text>
        <path d="M444 148 H520" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="470" y="140" font-family="Geist Mono,ui-monospace,monospace" font-size="8" fill="#eb6c36">yes</text>
        <path d="M360 200 V228" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <text x="368" y="220" font-family="Geist Mono,ui-monospace,monospace" font-size="8" fill="#7a8399">no</text>
        <rect x="520" y="116" width="160" height="64" rx="6" fill="#fff" stroke="#2d3142"/>
        <text x="600" y="144" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">Decisions API</text>
        <text x="600" y="162" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">/alpha/decisions</text>
        <rect x="280" y="232" width="160" height="64" rx="6" fill="#fff" stroke="#2d3142"/>
        <text x="360" y="260" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">Chat JSON</text>
        <text x="360" y="278" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">one repair</text>
        <path d="M360 296 V316 H40 V148 H276" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="40" y="116" width="160" height="64" rx="6" fill="#fff" stroke="#2d3142"/>
        <text x="120" y="144" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">Fallback order</text>
        <text x="120" y="162" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">turn still completes</text>
        <ellipse cx="360" cy="340" rx="56" ry="16" fill="#fff" stroke="#2d3142"/>
        <text x="360" y="344" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">One tool</text>

      </svg>
