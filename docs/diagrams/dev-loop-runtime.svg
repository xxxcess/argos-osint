<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="dev-loop-runtime-title dev-loop-runtime-desc">
<title id="dev-loop-runtime-title">Runtime service image development loop</title>
<desc id="dev-loop-runtime-desc">Backend service roles run inside the shared runtime image. Iterate with focused host server-feature checks first, then rebuild the runtime stage with BuildKit Cargo caches and restart the Compose roles.</desc>
<defs>
  <marker id="dev-loop-runtime-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4f5d75"/></marker>
</defs>
<style>
  text{font-family:Geist,system-ui,sans-serif;fill:#2d3142}
  .heading{font-family:'Instrument Serif',Georgia,serif;font-size:24px}
  .label{font-size:16px;font-weight:600}
  .note{font-size:13px}
  .code{font:12px 'Geist Mono',ui-monospace,monospace}
  .zone{font-size:12px;font-weight:600;letter-spacing:1px}
  .node{fill:white;stroke:#4f5d75}
  .accent{fill:#fff6ed;stroke:#eb6c36}
  .edge,.flow{fill:none;stroke:#4f5d75;stroke-width:1.5}
  .edge{marker-end:url(#dev-loop-runtime-arrow)}
</style>
<rect width="960" height="360" fill="#f5f5f5"/>
<text x="40" y="36" class="heading" text-anchor="start">Avenue 2 · Server-feature check → cached runtime image → Compose roles</text>
<path d="M240 120H284" class="edge"/>
<path d="M500 120H544" class="edge"/>
<path d="M744 120H780V236" class="edge"/>
<path d="M644 160V236" class="edge"/>
<path d="M544 276H500" class="edge"/>
<path d="M284 276H240" class="edge"/>
<rect x="40" y="80" width="200" height="80" rx="6" class="node"/>
<text x="140" y="108" class="label" text-anchor="middle">Edit service crates</text>
<text x="140" y="128" class="note" text-anchor="middle">API, core, storage, jobs</text>
<text x="140" y="146" class="code" text-anchor="middle">services/api-host · crates/*</text>
<rect x="284" y="80" width="216" height="80" rx="6" class="node"/>
<text x="392" y="108" class="label" text-anchor="middle">Focused host check</text>
<text x="392" y="128" class="note" text-anchor="middle">Network feature graph</text>
<text x="392" y="146" class="code" text-anchor="middle">--features server,nlp,classifier</text>
<rect x="544" y="80" width="200" height="80" rx="6" class="accent"/>
<text x="644" y="108" class="label" text-anchor="middle">Build runtime stage</text>
<text x="644" y="128" class="note" text-anchor="middle">BuildKit Cargo cache mounts</text>
<text x="644" y="146" class="code" text-anchor="middle">FLEETWORKS_CORE_OPT_LEVEL=1</text>
<rect x="544" y="236" width="200" height="80" rx="6" class="accent"/>
<text x="644" y="264" class="label" text-anchor="middle">Service & worker roles</text>
<text x="644" y="284" class="note" text-anchor="middle">One argos-api-host binary</text>
<text x="644" y="302" class="code" text-anchor="middle">bootstrap · api · brain · jobs · worker</text>
<rect x="748" y="236" width="172" height="80" rx="6" class="node"/>
<text x="834" y="264" class="label" text-anchor="middle">Datastores</text>
<text x="834" y="284" class="note" text-anchor="middle">Domain + operational</text>
<text x="834" y="302" class="code" text-anchor="middle">SurrealDB + Jobs SQLite</text>
<rect x="284" y="236" width="216" height="80" rx="6" class="node"/>
<text x="392" y="264" class="label" text-anchor="middle">Health & readiness</text>
<text x="392" y="284" class="note" text-anchor="middle">Container probes + status</text>
<text x="392" y="302" class="code" text-anchor="middle">check-fleetworks-api · status</text>
<rect x="40" y="236" width="200" height="80" rx="6" class="node"/>
<text x="140" y="264" class="label" text-anchor="middle">Exercise via CLI</text>
<text x="140" y="284" class="note" text-anchor="middle">Logs & live client checks</text>
<text x="140" y="302" class="code" text-anchor="middle">venture logs · client <app></text>
<text x="40" y="340" class="note" text-anchor="start">Compose builds argos-api-host at opt-level 1 with 256 core codegen units so incremental service rebuilds stay fast and bounded in memory.</text>
</svg>
