<text x="384" y="676" class="note">Operator / CLI lanes remain until retirement gates</text>
<text x="384" y="700" class="note">They do not replace the Mac desktop lane</text>
<rect x="944" y="340" width="304" height="132" rx="6" class="accent"/>
<text x="960" y="372" class="label">Fleetworks required</text>
<text x="960" y="400" class="note">Every selected lane must succeed</text>
