name: Atlas BERT Linux worker checks

on:
  workflow_dispatch:
    inputs:
      head:
        description: Exact full source SHA (defaults to dispatched revision)
        type: string
        required: false
  workflow_call:
    inputs:
      head:
        description: Exact full source SHA
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: atlas-bert-${{ github.workflow }}-${{ github.event_name }}-${{ inputs.head || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  ATLAS_BERT_HEAD: ${{ inputs.head || github.event.pull_request.head.sha || github.sha }}
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  # Engine work is native Linux only; Rune client checks do not install Torch.
  runtime:
    name: Native Linux ${{ matrix.arch }} / real checkpoint and bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    # Match deploy/Dockerfile's Debian bookworm/glibc2.36 runtime. No QEMU or
    # Ubuntu24/glibc2.39 host binary is accepted as deployment-compatible.
    container: python:3.11-bookworm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.ATLAS_BERT_HEAD }}
          lfs: false
          persist-credentials: false
      - name: Resolve exact source and repository toolchain
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ATLAS_BERT_HEAD" =~ ^[0-9a-f]{40}$ ]]
          # checkout is host-owned while this isolated container runs as root.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$ATLAS_BERT_HEAD"
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          import tomllib
          channel = tomllib.loads(Path("rust-toolchain.toml").read_text())["toolchain"]["channel"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", channel):
              raise SystemExit("An exact repository toolchain pin is required")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("version=" + channel, file=output)
          PY
      - name: Provision isolated Debian build tools
        shell: bash
        env:
          TOOLCHAIN: ${{ steps.pin.outputs.version }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.arch == 'amd64' && 'x86_64' || 'aarch64' }}"
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev binutils curl ca-certificates
          curl --fail --silent --show-error --location --retry 3 https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh"
          sh "$RUNNER_TEMP/rustup-init.sh" -y --no-modify-path --profile minimal --default-toolchain "$TOOLCHAIN" --component rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          key: atlas-bert-bookworm-${{ matrix.arch }}-${{ steps.pin.outputs.version }}-${{ hashFiles('tools/atlas-bert/Cargo.lock') }}
          workspaces: tools/atlas-bert -> ../../target/agents
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Install exact matching CPU Torch wheel inside Linux only
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(python tools/atlas-bert/scripts/verify_linux.py wheel --target '${{ matrix.target }}')"
          python -m pip install --only-binary=:all: "$wheel" 'numpy==1.26.4'
      - name: Check formatting and synthetic verification contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path tools/atlas-bert/Cargo.toml --check
          python -m unittest discover -s tools/atlas-bert/scripts -p test_verify_linux.py -v
      - name: Build link test real checkpoint and verify extracted bundle
        shell: bash
        run: |
          set -euo pipefail
          python tools/atlas-bert/scripts/verify_linux.py run --agent --require-clean \
            --target '${{ matrix.target }}' --revision "$ATLAS_BERT_HEAD" \
            --output "$RUNNER_TEMP/atlas-bert-linux-${{ matrix.arch }}"
      - name: Upload immutable worker native libraries and verified model bundle
        id: bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: atlas-bert-bundle-${{ matrix.arch }}-${{ env.ATLAS_BERT_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/atlas-bert-linux-${{ matrix.arch }}/atlas-bert-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Bind evidence to exact artifact ID and digest
        shell: bash
        env:
          BUNDLE_ID: ${{ steps.bundle.outputs.artifact-id }}
          BUNDLE_URL: ${{ steps.bundle.outputs.artifact-url }}
          BUNDLE_DIGEST: ${{ steps.bundle.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "atlas-bert-linux-${{ matrix.arch }}" / "evidence.json"
          evidence = json.loads(path.read_text())
          if evidence["status"] != "passed" or not os.environ["BUNDLE_ID"]:
              raise SystemExit("A verified bundle and immutable artifact ID are required")
          evidence["actions_artifact"] = {"id": os.environ["BUNDLE_ID"], "url": os.environ["BUNDLE_URL"], "digest": os.environ["BUNDLE_DIGEST"]}
          path.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              print("### Atlas BERT native Linux ${{ matrix.arch }}", file=summary)
              print("Source: `" + evidence["source_sha"] + "`", file=summary)
              print("[Immutable bundle](" + os.environ["BUNDLE_URL"] + ")", file=summary)
              print("Archive SHA256: `" + evidence["archive"]["sha256"] + "`", file=summary)
              print("Native build/link/unit and real checkpoint/extracted-bundle inference passed. Gateway integration and publication are separate.", file=summary)
          PY
      - name: Retain bounded evidence and command diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: atlas-bert-evidence-${{ matrix.arch }}-${{ env.ATLAS_BERT_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/atlas-bert-linux-${{ matrix.arch }}/evidence.json
            ${{ runner.temp }}/atlas-bert-linux-${{ matrix.arch }}/*.log
          if-no-files-found: error
          retention-days: 14

  required:
    name: Required native Linux classifier runtimes
    needs: runtime
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require both native runtime legs
        env:
          RUNTIME_RESULT: ${{ needs.runtime.result }}
        run: test "$RUNTIME_RESULT" = success
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: atlas-bert-evidence-*-${{ env.ATLAS_BERT_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - name: Reject missing mismatched or failed runtime evidence
        env:
          EXPECTED_HEAD: ${{ env.ATLAS_BERT_HEAD }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          manifests = sorted(Path("evidence").rglob("evidence.json"))
          found = set()
          for path in manifests:
              value = json.loads(path.read_text())
              arch = value["arch"]
              if arch in found or arch not in ("amd64", "arm64") or value["source_sha"] != os.environ["EXPECTED_HEAD"] or value["status"] != "passed" or not value.get("actions_artifact", {}).get("id"):
                  raise SystemExit("Mismatched or failed Linux runtime evidence")
              if value["dirty"] or value["unit_tests_passed"] < 1 or any(value[key]["status"] != "passed" for key in ("build_inference", "extracted_inference")):
                  raise SystemExit("Missing real runtime checks")
              found.add(arch)
          if found != {"amd64", "arm64"} or len(manifests) != 2:
              raise SystemExit("Both native Linux architectures must supply evidence")
          print("Both native Linux classifier runtimes verified for " + os.environ["EXPECTED_HEAD"])
          PY
