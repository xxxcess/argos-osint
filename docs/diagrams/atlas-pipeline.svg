<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 940 500">
<title id="title">Atlas collection-v2 cycle</title><desc id="desc">Native news acquisition joins Classifier batches and local entity/publisher metadata before tentative Related matching. Phase 6 indexes every retained article occurrence through Brain (canonical Actors, mention Links, bounded Related) with atomic receipts. Pause retains receipts. Required classification or phase-6 index failure keeps the cycle partial; metadata failures produce warnings. Intel analysis is independently selected.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#4f5d75"/></marker></defs>
<rect width="940" height="500" fill="#f5f5f5"/>
<g fill="none" stroke="#4f5d75" marker-end="url(#arrow)"><path d="M224 130 H265 V80 H300"/><path d="M224 130 H265 V190 H300"/><path d="M530 80 H570 V135 H610"/><path d="M530 190 H570 V135 H610"/><path d="M735 175 V205"/><path d="M735 285 V315"/><path d="M735 375 V410"/></g>
<g font-family="Geist,system-ui,sans-serif" fill="#2d3142" text-anchor="middle">
<rect x="24" y="90" width="200" height="80" rx="5" fill="#fff" stroke="#2d3142"/><text x="124" y="118" font-size="15">1–2 Native acquisition</text><text x="124" y="140" font-size="11">Discovery → regional coverage</text><text x="124" y="157" font-size="11">Quotas · dedupe · retained articles</text>
<rect x="300" y="40" width="230" height="80" rx="5" fill="#fff" stroke="#eb6c36"/><text x="415" y="68" font-size="15">3 Classifier only</text><text x="415" y="89" font-size="11">8 articles · 32 KiB · exact IDs</text><text x="415" y="107" font-size="11">Shared admission / retries / receipts</text>
<rect x="300" y="150" width="230" height="80" rx="5" fill="#fff" stroke="#2d3142"/><text x="415" y="178" font-size="15">4 Local metadata</text><text x="415" y="199" font-size="11">Complete title / description mentions</text><text x="415" y="217" font-size="11">Native WP:RSP publisher prior</text>
<rect x="610" y="95" width="250" height="80" rx="5" fill="#fff" stroke="#eb6c36"/><text x="735" y="122" font-size="15">5 Related article leads</text><text x="735" y="143" font-size="11">≥2 distinct shared entities · verified spans</text><text x="735" y="161" font-size="11">At least one recognized category</text>
<rect x="610" y="205" width="250" height="80" rx="5" fill="#fff" stroke="#eb6c36"/><text x="735" y="230" font-size="15">6 Index actors and articles</text><text x="735" y="250" font-size="11">Brain Actors · mentioned_in Links · ≤20 Related</text><text x="735" y="268" font-size="11">atlas_article_index receipt · ≤100 per txn</text>
<rect x="610" y="315" width="250" height="60" rx="5" fill="#fff" stroke="#2d3142"/><text x="735" y="340" font-size="15">Local finalization</text><text x="735" y="360" font-size="11">Article / metadata / actor coverage</text>
<rect x="610" y="410" width="250" height="65" rx="5" fill="#fff" stroke="#2d3142"/><text x="735" y="435" font-size="15">Explicit Intel selection</text><text x="735" y="457" font-size="11">All-retained Related · article analysis</text>
<text x="300" y="300" font-size="12">Pause → stored receipts → Resume (phase 6 resumes alone)</text><text x="300" y="325" font-size="12">Classification or index failure: blocked / partial / failed</text><text x="300" y="356" font-size="12">No cycle claims; Brain writes are identity/relationship only</text><text x="300" y="382" font-size="12">Related stays tentative; Links are observed mentions</text><text x="300" y="408" font-size="12">Atlas owns no actor registry: one Brain Actor ID</text>
</g></svg>
