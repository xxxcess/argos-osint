<title id="intel-brief-chain-title">Intel brief: claim-specific analysis and staged publication</title>
<desc id="intel-brief-chain-desc">Visit or Reload attaches to one durable generation. Full article and metadata Claims are independent roots. Local NLP matches detected actor names, observed spellings and each claim's event terms to original body sentences, preserving nearby attribution and corrections. For each claim, bounded Classifier decisions select support, context and counterevidence. Synthesis receives one claim, associated actors and selected original sentences; every claim receives an analysis request, including an empty-evidence request that may return no inference. No full article chunks are sent for inference generation. Fidelity and bounded semantic selection retain at most five inferences. Links follows. Claims, Inferences and Links each have a fenced publication point through the shared canonical publisher, with only that stage's kind replaced and indexed. Later failure preserves earlier published kinds. Exact memory revision acknowledgments distinguish Published from Indexed. Cancellation and stale leases prevent commits; Retry runs failed branches only.</desc>
