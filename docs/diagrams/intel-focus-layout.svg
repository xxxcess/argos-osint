<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 344" role="img" aria-labelledby="intel-focus-layout-title intel-focus-layout-desc">
<title id="intel-focus-layout-title">Intel Focus Brief reading order</title>
<desc id="intel-focus-layout-desc">The Intel web desktop presents one scrolling Focus Brief. The reading column keeps Inferences last among evidence sections. The context rail moves below reading at widths below 900 pixels.</desc>
<defs>
  <marker id="intel-focus-layout-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4f5d75"/></marker>
</defs>
<style>
  text{font-family:Geist,system-ui,sans-serif;fill:#2d3142}
  .heading{font-family:'Instrument Serif',Georgia,serif;font-size:24px}
  .label{font-size:16px;font-weight:600}
  .note{font-size:13px}
  .code{font:12px 'Geist Mono',ui-monospace,monospace}
  .zone{font-size:12px;font-weight:600;letter-spacing:1px}
  .node{fill:white;stroke:#4f5d75}
  .accent{fill:#fff6ed;stroke:#eb6c36}
  .edge,.flow{fill:none;stroke:#4f5d75;stroke-width:1.5}
  .edge{marker-end:url(#intel-focus-layout-arrow)}
</style>
<rect width="960" height="344" fill="#f5f5f5"/>
<text x="40" y="36" class="heading" text-anchor="start">Wide Focus Brief · reading and context</text>
<rect x="40" y="64" width="880" height="72" rx="6" class="node"/>
<text x="480" y="97" class="label" text-anchor="middle">Article header</text>
<text x="480" y="115" class="note" text-anchor="middle">Title, confidence, and job beacon</text>
<rect x="40" y="164" width="552" height="88" rx="6" class="accent"/>
<text x="316" y="205" class="label" text-anchor="middle">Reading column</text>
<text x="316" y="223" class="note" text-anchor="middle">Summary → Actors → Claims → Inferences</text>
<rect x="620" y="164" width="300" height="88" rx="6" class="node"/>
<text x="770" y="205" class="label" text-anchor="middle">Context rail</text>
<text x="770" y="223" class="note" text-anchor="middle">Lifecycle · controls · source · Related</text>
<rect x="40" y="280" width="880" height="56" rx="6" class="node"/>
<text x="480" y="305" class="label" text-anchor="middle">Article context</text>
<text x="480" y="323" class="note" text-anchor="middle">Origin · extracted entities · topology action</text>
</svg>
