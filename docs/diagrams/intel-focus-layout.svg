<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">Intel Focus Brief layout</title><desc id="desc">React Native scrolls one shell with a header, an eight-column reader (summary, actors, claims, inferences) and a four-column context rail (lifecycle, source and related leads). Core TUI keeps Extracted, Reader and Context columns, with inferences last in the center stack.</desc><rect width="1000" height="470" fill="#f5f5f5"/><style>text{font-family:system-ui,sans-serif;fill:#2d3142}.head{font-size:22px;font-weight:600}.label{font-size:18px}.note{font-size:14px}.rule{stroke:#4f5d75;stroke-width:1.5}</style><text x="40" y="42" class="head">Focus Brief · inferences stay last among evidence</text><path d="M40 70H960M500 90V400" class="rule"/><text x="40" y="113" class="label">React Native · 8:4 reading desk</text><text x="40" y="156" class="note">Reading · summary → actors → claims</text><text x="40" y="186" class="note">Context · lifecycle → controls → source</text><text x="40" y="216" class="note">Context · related leads, not corroboration</text><text x="40" y="246" class="note">Reading · evidence sections collapse</text><path d="M40 268H430" stroke="#eb6c36" stroke-width="3"/><text x="40" y="300" class="head">Analytical inferences</text><text x="40" y="332" class="note">Header · confidence meter + job beacon</text><text x="40" y="362" class="note">Origin · entities · topology action</text><text x="540" y="113" class="label">Core TUI columns</text><text x="540" y="156" class="note">Extracted · confidence, actors, claims</text><text x="540" y="196" class="note">Reader · description, related</text><text x="540" y="236" class="head">Inferences · last</text><text x="540" y="276" class="note">Context · tags, country, jobs</text><path d="M40 410H960" class="rule"/><text x="40" y="440" class="note">Below 900px, context stacks after reading. Inferences stay last among evidence.</text><text x="40" y="462" class="note">Pending, verified empty and unavailable inference states stay on this section.</text></svg>
