<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 344" role="img" aria-labelledby="workspace-title workspace-desc">
<title id="workspace-title">Fleetworks workspace and clients</title>
<desc id="workspace-desc">Venture resolves one workspace, owns the local stack, and launches independent clients. The six terminal clients and the Intel desktop use the same versioned HTTP API.</desc>
<defs>
  <marker id="workspace-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4f5d75"/></marker>
</defs>
<style>
  text{font-family:Geist,system-ui,sans-serif;fill:#2d3142}
  .heading{font-family:'Instrument Serif',Georgia,serif;font-size:24px}
  .label{font-size:16px;font-weight:600}
  .note{font-size:13px}
  .code{font:12px 'Geist Mono',ui-monospace,monospace}
  .zone{font-size:12px;font-weight:600;letter-spacing:1px}
  .node{fill:white;stroke:#4f5d75}
  .accent{fill:#fff6ed;stroke:#eb6c36}
  .edge,.flow{fill:none;stroke:#4f5d75;stroke-width:1.5}
  .edge{marker-end:url(#workspace-arrow)}
</style>
<rect width="960" height="344" fill="#f5f5f5"/>
<text x="40" y="36" class="heading" text-anchor="start">Venture selects a workspace and serves two client surfaces</text>
<path d="M204 192H260V108H316" class="edge"/>
<path d="M204 192H316" class="edge"/>
<path d="M204 192H260V276H316" class="edge"/>
<path d="M640 192H708" class="edge"/>
<path d="M640 276H680V208H708" class="edge"/>
<rect x="40" y="156" width="164" height="72" rx="6" class="accent"/>
<text x="122" y="189" class="label" text-anchor="middle">Venture</text>
<text x="122" y="207" class="note" text-anchor="middle">Local stack owner</text>
<rect x="316" y="72" width="324" height="72" rx="6" class="node"/>
<text x="478" y="105" class="label" text-anchor="middle">Workspace</text>
<text x="478" y="123" class="note" text-anchor="middle">Datasets, config, secrets, models, logs, storage</text>
<rect x="316" y="156" width="324" height="72" rx="6" class="node"/>
<text x="478" y="189" class="label" text-anchor="middle">Terminal clients</text>
<text x="478" y="207" class="note" text-anchor="middle">Atlas · Brain · Jobs · Tools · Models · Profile</text>
<rect x="316" y="240" width="324" height="72" rx="6" class="node"/>
<text x="478" y="273" class="label" text-anchor="middle">Intel desktop</text>
<text x="478" y="291" class="note" text-anchor="middle">Bulletin · Focus Brief · actor dossiers · topology</text>
<rect x="708" y="156" width="212" height="72" rx="6" class="accent"/>
<text x="814" y="189" class="label" text-anchor="middle">Fleetworks API</text>
<text x="814" y="207" class="note" text-anchor="middle">Authenticated /api/v1</text>
</svg>
