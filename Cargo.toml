[workspace]
resolver = "2"
members = [
    "crates/argos-osint-core",
    "crates/argos-osint-bin",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"
authors = ["the Argos OSINT authors"]
rust-version = "1.91"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "5"
futures-util = "0.3"
# `remote` only works around a lancedb 0.39.0 bug: job.rs uses Error::Http, which
# exists only with that feature, so the default (empty) feature set fails to compile.
# Argos opens a local directory and never connects to LanceDB Cloud.
lancedb = { version = "0.39", features = ["remote"] }
protoc-bin-vendored = "3.3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_28", "all-widgets", "layout-cache", "macros", "underline-color"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
rpassword = "7"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
strsim = "0.11"
sysinfo = "0.33"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "fs", "sync", "net"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
toml = "0.8"
tract-onnx = "0.23"
url = "2"
