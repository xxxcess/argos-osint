[package]
name = "argos-api-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["embedded", "nlp"]
embedded = ["argos-osint-core/embedded", "argos-osint-api/embedded"]
server = ["argos-osint-core/server", "argos-osint-api/server"]
nlp = ["argos-osint-core/nlp", "argos-osint-api/nlp"]

[dependencies]
anyhow.workspace = true
argos-osint-core = { path = "../argos-osint-core", default-features = false }
axum = "0.8.8"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
argos-osint-api = { path = "../argos-osint-api", default-features = false }
clap.workspace = true
tracing-subscriber.workspace = true
