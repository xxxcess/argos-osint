[package]
name = "argos-osint-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Brain recall, hardware, and providers for Argos"
rust-version.workspace = true

[dependencies]
tracing = "0.1"
anyhow.workspace = true
chrono.workspace = true
dirs.workspace = true
futures-util.workspace = true
regex.workspace = true
rquickjs = { workspace = true, optional = true }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
strsim.workspace = true
surrealdb = { workspace = true, optional = true }
sysinfo.workspace = true
tokio.workspace = true
tempfile.workspace = true
tokenizers.workspace = true
toml.workspace = true
tract-onnx.workspace = true
url.workspace = true
scraper.workspace = true

[features]
# A local build runs Argos on embedded SurrealDB (RocksDB on disk, no network).
default = ["embedded", "nlp"]
nlp = ["dep:rquickjs"]
# SurrealDB storage API without an engine; pick `embedded` and/or `server`.
surreal = ["dep:surrealdb"]
# Embedded RocksDB engine in-process (single owner per Argos home). Default.
embedded = ["surreal", "surrealdb/kv-rocksdb"]
# WebSocket client for the per-home loopback SurrealDB server. Opt-in
# (`argos storage init --mode server` or ARGOS_STORAGE_MODE=server).
server = ["surreal", "surrealdb/protocol-ws"]
# Test/screenshot fixtures used by the binary's tests. Never enabled in release builds.
fixtures = []
# Paused-time Tokio tests (`tokio::time::pause`).
test-util = ["tokio/test-util"]

[dev-dependencies]
tempfile.workspace = true
proptest = "1.4"

[target.'cfg(unix)'.dependencies]
# Thread CPU clock for test budgets and non-blocking process status/signals.
libc = "0.2"
