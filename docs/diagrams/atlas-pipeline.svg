<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="atlas-pipeline-title atlas-pipeline-desc" viewBox="0 0 1180 690" width="1180" height="690">
<title id="atlas-pipeline-title">Atlas collection cycle</title><desc id="atlas-pipeline-desc">Local pinned six-domain admission feeds metadata, Related leads, canonical actors and scoped lifecycle repair. Terminal completion atomically schedules independent provider monitoring. Historical reclassification processes 64 retained occurrences at a time; Focus Brief runs on demand.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#4f5d75"/></marker></defs>
<rect width="1180" height="690" fill="#f5f5f5"/>
<g font-family="Geist,system-ui,sans-serif" fill="#2d3142"><text x="24" y="30" font-size="13">Foreground cycle · one immutable model pin · metadata only</text><rect x="24" y="54" width="260" height="130" rx="5" fill="#fff" stroke="#2d3142"/><text x="40" y="82" font-size="15">Native acquisition</text><text x="40" y="106" font-size="12" fill="#4f5d75">Existing provider requests</text><text x="40" y="124" font-size="12" fill="#4f5d75">Capture raw labels before filters</text><text x="40" y="142" font-size="12" fill="#4f5d75">Country / time / duplicate rules</text><rect x="310" y="54" width="546" height="130" rx="6" fill="#fff" stroke="#eb6c36"/><text x="326" y="82" font-size="15">Private staging → local six-domain engine</text><text x="326" y="106" font-size="12" fill="#4f5d75">Run-scoped headers · page 512 · hydrate / score 64</text><text x="326" y="124" font-size="12" fill="#4f5d75">Natural Bayes inside embedded QuickJS</text><text x="326" y="142" font-size="12" fill="#4f5d75">Six independent calibrated gates · exactly two qualifying domains</text><text x="326" y="160" font-size="12" fill="#4f5d75">Bounded inputs, immutable model pin and revision guards</text><rect x="882" y="54" width="260" height="130" rx="5" fill="#fff" stroke="#2d3142"/><text x="898" y="82" font-size="15">Outcome + receipt</text><text x="898" y="106" font-size="12" fill="#4f5d75">Atomic occurrence publication</text><text x="898" y="124" font-size="12" fill="#4f5d75">Reject with an explicit reason</text><text x="898" y="142" font-size="12" fill="#4f5d75">Valid siblings commit separately</text><path d="M284 119 H305" fill="none" stroke="#4f5d75" marker-end="url(#arrow)"/><path d="M856 119 H877" fill="none" stroke="#4f5d75" marker-end="url(#arrow)"/><path d="M1012 184 V213 H154 V242" fill="none" stroke="#4f5d75" marker-end="url(#arrow)"/><rect x="24" y="248" width="546" height="130" rx="6" fill="#fff" stroke="#2d3142"/><text x="40" y="276" font-size="15">Local metadata + Related leads</text><text x="40" y="300" font-size="12" fill="#4f5d75">Title / description spans · preserve original occurrence IDs</text><text x="40" y="318" font-size="12" fill="#4f5d75">Bulk revision reads and bounded indexed candidates</text><text x="40" y="336" font-size="12" fill="#4f5d75">Actors + text + place / time guide candidate retrieval</text><text x="40" y="354" font-size="12" fill="#4f5d75">Relationships remain tentative until supported by evidence</text><rect x="596" y="248" width="260" height="130" rx="5" fill="#fff" stroke="#2d3142"/><text x="612" y="276" font-size="15">Actors + lifecycle</text><text x="612" y="300" font-size="12" fill="#4f5d75">Canonical Brain identities</text><text x="612" y="318" font-size="12" fill="#4f5d75">Scoped derivative publication</text><text x="612" y="336" font-size="12" fill="#4f5d75">Current source / body fences</text><rect x="882" y="248" width="260" height="130" rx="5" fill="#fff" stroke="#2d3142"/><text x="898" y="276" font-size="15">Cycle finalization</text><text x="898" y="300" font-size="12" fill="#4f5d75">Coverage + stage measurements</text><text x="898" y="318" font-size="12" fill="#4f5d75">Terminal receipt + durable outbox</text><text x="898" y="336" font-size="12" fill="#4f5d75">No wait for model calibration</text><path d="M570 313 H591" fill="none" stroke="#4f5d75" marker-end="url(#arrow)"/><path d="M856 313 H877" fill="none" stroke="#4f5d75" marker-end="url(#arrow)"/><text x="24" y="421" font-size="13">Independent work · separate ownership and checkpoints</text><rect x="24" y="442" width="354" height="148" rx="5" fill="#fff" stroke="#2d3142"/><text x="40" y="470" font-size="15">Focus Brief · on demand</text><text x="40" y="494" font-size="12" fill="#4f5d75">Body retrieval and metadata claims in parallel</text><text x="40" y="512" font-size="12" fill="#4f5d75">Domain-guided claims, body-grounded inferences</text><text x="40" y="530" font-size="12" fill="#4f5d75">Evidence references and counterevidence retained</text><text x="40" y="548" font-size="12" fill="#4f5d75">Typed Links and bounded Brain summaries</text><rect x="408" y="442" width="354" height="148" rx="5" fill="#fff" stroke="#2d3142"/><text x="424" y="470" font-size="15">Historical admission · 64 rows</text><text x="424" y="494" font-size="12" fill="#4f5d75">Original metadata, provenance and run IDs</text><text x="424" y="512" font-size="12" fill="#4f5d75">Exact saved model; explicit pause / resume</text><text x="424" y="530" font-size="12" fill="#4f5d75">Complete affected derivatives before finishing</text><text x="424" y="548" font-size="12" fill="#4f5d75">Legacy evidence stays readable</text><rect x="792" y="442" width="354" height="148" rx="5" fill="#fff" stroke="#eb6c36"/><text x="808" y="470" font-size="15">Provider monitoring · 512 rows</text><text x="808" y="494" font-size="12" fill="#4f5d75">Durable observations and exact fetch origins</text><text x="808" y="512" font-size="12" fill="#4f5d75">Deduplicate families; permanent partitions</text><text x="808" y="530" font-size="12" fill="#4f5d75">No reviewed evidence: retain the active model</text><text x="808" y="548" font-size="12" fill="#4f5d75">No extra provider calls or cycle-stage wait</text><path d="M1012 378 V437" fill="none" stroke="#4f5d75" marker-end="url(#arrow)"/><text x="24" y="634" font-size="12">Pause checkpoints owned work. Missing pins block; provider / model / storage faults never become fabricated rejection labels.</text><text x="24" y="658" font-size="12">Historical categories are never blindly remapped. Domain membership is neither an evidence grade nor proof of a relationship.</text></g>
</svg>
