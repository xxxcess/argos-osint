<svg role="img" aria-labelledby="recon-title recon-desc" viewBox="0 0 880 280" xmlns="http://www.w3.org/2000/svg">
        <title id="recon-title">One Recon turn</title>
        <desc id="recon-desc">Brain recall, directives, tool picker, binder, sequential executor, then streaming synthesis that may extract Brain claims.</desc>
        <defs>
          <marker id="r-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5d75" />
          </marker>
          <marker id="r-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#eb6c36" />
          </marker>
        </defs>
        <rect width="880" height="280" fill="#f5f5f5" />
        <path d="M132 88 L156 88" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#r-arrow)" />
        <path d="M268 88 L292 88" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#r-arrow)" />
        <path d="M404 88 L428 88" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#r-arrow)" />
        <path d="M540 88 L564 88" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#r-arrow)" />
        <path d="M676 88 L700 88" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#r-accent)" />
        <path d="M756 132 L756 168 L132 168 L132 132" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#r-arrow)" />
        <g font-family="Geist,system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">
          <rect x="24" y="48" width="108" height="80" rx="6" fill="#fff" stroke="#2d3142" />
          <text x="78" y="84">Recall</text>
          <text x="78" y="104" font-family="Geist Mono,ui-monospace,monospace" font-size="9" font-weight="400" fill="#7a8399">Brain</text>
          <rect x="156" y="48" width="112" height="80" rx="6" fill="#fff" stroke="#2d3142" />
          <text x="212" y="84">Directives</text>
          <text x="212" y="104" font-family="Geist Mono,ui-monospace,monospace" font-size="9" font-weight="400" fill="#7a8399">d1–d5</text>
          <rect x="292" y="48" width="112" height="80" rx="6" fill="#fff" stroke="#2d3142" />
          <text x="348" y="84">Picker</text>
          <text x="348" y="104" font-family="Geist Mono,ui-monospace,monospace" font-size="9" font-weight="400" fill="#7a8399">1 tool / request</text>
          <rect x="428" y="48" width="112" height="80" rx="6" fill="#fff" stroke="#2d3142" />
          <text x="484" y="84">Binder</text>
          <text x="484" y="104" font-family="Geist Mono,ui-monospace,monospace" font-size="9" font-weight="400" fill="#7a8399">grounded inputs</text>
          <rect x="564" y="48" width="112" height="80" rx="6" fill="#fff" stroke="#2d3142" />
          <text x="620" y="84">Executor</text>
          <text x="620" y="104" font-family="Geist Mono,ui-monospace,monospace" font-size="9" font-weight="400" fill="#7a8399">sequential OSINT</text>
          <rect x="700" y="48" width="156" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2" />
          <text x="778" y="84">Synthesis</text>
          <text x="778" y="104" font-family="Geist Mono,ui-monospace,monospace" font-size="9" font-weight="400" fill="#7a8399">stream + citations</text>
        </g>
        <text x="440" y="196" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#4f5d75">CITED CLAIMS → BRAIN</text>
        <text x="440" y="244" text-anchor="middle" font-family="Instrument Serif,serif" font-size="14" font-style="italic" fill="#2d3142">Primary tools first (Firecrawl, SociaVault, Hunter). Gap-fillers never feed Hunter.</text>
      </svg>
