<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Durable jobs</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; }
    html,body { margin:0; background:var(--paper); color:var(--ink); font-family:Geist,system-ui,sans-serif; }
    main { max-width:920px; margin:0 auto; padding:40px 24px 64px; }
    .eyebrow { font-family:"Geist Mono",ui-monospace,monospace; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
    h1 { font-family:"Instrument Serif",serif; font-weight:400; font-size:1.75rem; margin:.4rem 0 .5rem; }
    p.lede { color:var(--muted); max-width:40rem; margin:0 0 1.25rem; font-size:15px; line-height:1.5; }
    .frame { overflow-x:auto; }
    svg { min-width:800px; display:block; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">State machine</div>
    <h1>Durable jobs</h1>
    <p class="lede">Jobs, Intel reports, Atlas runs, and graph summaries share leased tasks. Stale leases recover. Cancel is cooperative.</p>
    <div class="frame">
      <svg role="img" aria-labelledby="jobs-lifecycle-title jobs-lifecycle-desc" viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg">
        <title id="jobs-lifecycle-title">Durable jobs</title>
        <desc id="jobs-lifecycle-desc">Jobs, Intel reports, Atlas runs, and graph summaries share leased tasks. Stale leases recover. Cancel is cooperative.</desc>

        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="800" height="240" fill="#f5f5f5"/>

        <circle cx="40" cy="88" r="6" fill="#2d3142"/>
        <path d="M46 88 H80" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M220 88 H252" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <path d="M392 88 H424" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M564 88 H596" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M320 132 V168 H160 V132" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="220" y="160" font-family="Geist Mono,ui-monospace,monospace" font-size="8" fill="#7a8399">lease expired</text>
        <rect x="80" y="48" width="140" height="80" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
        <text x="150.0" y="76" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">register</text>
        <text x="150.0" y="94" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">JobSpec</text>
        <rect x="252" y="48" width="140" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="322.0" y="76" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">leased</text>
        <text x="322.0" y="94" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">owner + until</text>
        <rect x="424" y="48" width="140" height="80" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
        <text x="494.0" y="76" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">complete</text>
        <text x="494.0" y="94" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">receipt</text>
        <rect x="596" y="48" width="140" height="80" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
        <text x="666.0" y="76" text-anchor="middle" font-family="Geist,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">failed</text>
        <text x="666.0" y="94" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace" font-size="9" fill="#7a8399">retry / cooldown</text>
        <text x="400" y="212" text-anchor="middle" font-family="Instrument Serif,serif" font-size="14" font-style="italic" fill="#2d3142">Jobs lists the row; Logs holds the diagnostic.</text>

      </svg>
    </div>
  </main>
</body>
</html>
