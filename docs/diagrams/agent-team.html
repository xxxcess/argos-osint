<html lang="en"><head><meta charset="utf-8"><title>Agent handoffs</title><style>body{margin:32px;background:#f5f5f5;color:#2d3142;font-family:system-ui}main{max-width:1100px;margin:auto}svg{width:100%;height:auto}</style></head><body><main><h1>Agent handoffs</h1><p>The owning role dispatches coders to implement changes directly, then schedules documentation and verification.</p><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="team-title team-desc">
