<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="intel-job-states-title intel-job-states-desc">
<title id="intel-job-states-title">Intel brief stage states</title><desc id="intel-job-states-desc">Each intel-brief-v2 generation persists four stage tasks. Full article and Claims are independent roots; Inferences waits for both and Links waits for Inferences. Failed prerequisites block descendants. Explicit retry requeues failed work while retaining completed outputs. Historical report execution is retired.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4f5d75"/></marker></defs>
<rect width="960" height="460" fill="#f5f5f5"/>
<style>text{font-family:Geist,system-ui,sans-serif;fill:#2d3142}.label{font-size:18px}.note{font-size:13px}.line{fill:none;stroke:#4f5d75;stroke-width:2;marker-end:url(#arrow)}</style>
<rect x="32" y="48" width="240" height="88" rx="6" fill="white" stroke="#4f5d75"/>
<text x="152.0" y="76" text-anchor="middle" class="label">Queued</text>
<text x="152.0" y="99" text-anchor="middle" class="note">Roots ready immediately</text>
<text x="152.0" y="117" text-anchor="middle" class="note">Others await prerequisites</text>
<path d="M272 92H360" class="line"/>
<rect x="360" y="48" width="240" height="88" rx="6" fill="white" stroke="#eb6c36"/>
<text x="480.0" y="76" text-anchor="middle" class="label">Running</text>
<text x="480.0" y="99" text-anchor="middle" class="note">Dedicated brief worker pool</text>
<text x="480.0" y="117" text-anchor="middle" class="note">At most two stages at once</text>
<path d="M600 92H688" class="line"/>
<rect x="688" y="48" width="240" height="88" rx="6" fill="white" stroke="#eb6c36"/>
<text x="808.0" y="76" text-anchor="middle" class="label">Completed</text>
<text x="808.0" y="99" text-anchor="middle" class="note">Validated output committed</text>
<text x="808.0" y="117" text-anchor="middle" class="note">May include warnings</text>
<path d="M480 136V224" class="line"/>
<rect x="360" y="224" width="240" height="88" rx="6" fill="white" stroke="#4f5d75"/>
<text x="480.0" y="252" text-anchor="middle" class="label">Failed</text>
<text x="480.0" y="275" text-anchor="middle" class="note">Blocks descendants</text>
<text x="480.0" y="293" text-anchor="middle" class="note">Completed siblings retained</text>
<path d="M360 268H152V136" class="line"/>
<text x="200" y="244" text-anchor="middle" class="note">Explicit Retry</text>
<text x="480" y="360" text-anchor="middle" class="note">Full article + Claims → Inferences → Links</text>
<text x="480" y="388" text-anchor="middle" class="note">Claims, Inferences and Links publish separately behind generation and lease fences.</text>
<text x="480" y="416" text-anchor="middle" class="note">Cancellation or stale ownership prevents commits. Later failure preserves published kinds.</text>
</svg>
