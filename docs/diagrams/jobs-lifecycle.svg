<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 384" role="img" aria-labelledby="jobs-lifecycle-title jobs-lifecycle-desc">
<title id="jobs-lifecycle-title">Durable jobs and terminal operations · planned target</title>
<desc id="jobs-lifecycle-desc">The Jobs client reads durable job and task state and bounded logs through the versioned API. A worker takes a lease before execution. The planned Jobs/SQLite authority owns transitions; domain-owned fences and receipts protect publication. Current production scheduling still uses SurrealDB.</desc>
<defs>
  <marker id="jobs-lifecycle-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4f5d75"/></marker>
</defs>
<style>
  text{font-family:Geist,system-ui,sans-serif;fill:#2d3142}
  .heading{font-family:'Instrument Serif',Georgia,serif;font-size:24px}
  .label{font-size:16px;font-weight:600}
  .note{font-size:13px}
  .code{font:12px 'Geist Mono',ui-monospace,monospace}
  .zone{font-size:12px;font-weight:600;letter-spacing:1px}
  .node{fill:white;stroke:#4f5d75}
  .accent{fill:#fff6ed;stroke:#eb6c36}
  .edge,.flow{fill:none;stroke:#4f5d75;stroke-width:1.5}
  .edge{marker-end:url(#jobs-lifecycle-arrow)}
</style>
<rect width="960" height="384" fill="#f5f5f5"/>
<text x="40" y="36" class="heading" text-anchor="start">Planned Jobs / SQLite execution authority</text>
<path d="M228 116H272" class="edge"/>
<path d="M460 116H736" class="edge"/>
<path d="M366 152V204H364V232" class="edge"/>
<path d="M460 136H598V232" class="edge"/>
<path d="M692 268H728" class="edge"/>
<path d="M824 304V336H134V152" class="edge"/>
<rect x="40" y="80" width="188" height="72" rx="6" class="node"/>
<text x="134" y="113" class="label" text-anchor="middle">Queued</text>
<text x="134" y="131" class="note" text-anchor="middle">Wait for eligible work</text>
<rect x="272" y="80" width="188" height="72" rx="6" class="accent"/>
<text x="366" y="113" class="label" text-anchor="middle">Running</text>
<text x="366" y="131" class="note" text-anchor="middle">Jobs execution lease</text>
<rect x="736" y="80" width="184" height="72" rx="6" class="node"/>
<text x="828" y="113" class="label" text-anchor="middle">Completed</text>
<text x="828" y="131" class="note" text-anchor="middle">Domain receipt + outcome</text>
<rect x="504" y="232" width="188" height="72" rx="6" class="node"/>
<text x="598" y="265" class="label" text-anchor="middle">Failed</text>
<text x="598" y="283" class="note" text-anchor="middle">Reason in detail and logs</text>
<rect x="264" y="232" width="200" height="72" rx="6" class="node"/>
<text x="364" y="265" class="label" text-anchor="middle">Cancel supported work</text>
<text x="364" y="283" class="note" text-anchor="middle">Fence before acknowledgment</text>
<rect x="728" y="232" width="192" height="72" rx="6" class="accent"/>
<text x="824" y="265" class="label" text-anchor="middle">Retry eligible work</text>
<text x="824" y="283" class="note" text-anchor="middle">Requeue failed tasks</text>
<text x="40" y="364" class="note" text-anchor="start">Target: Jobs / SQLite owns transitions. Current scheduling remains in SurrealDB.</text>
</svg>
