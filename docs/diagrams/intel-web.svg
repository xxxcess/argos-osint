<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 616" role="img" aria-labelledby="intel-web-title intel-web-desc">
<title id="intel-web-title">Intel Web guarded relay and retained-operation ownership</title>
<desc id="intel-web-desc">The browser uses the advertised public web origin, protected by explicit authentication ingress for remote HTTPS. The Next.js Connect gate validates an existing registered context before protected rendering, HTTP exports or live access. Only the server attaches its WebRelay credential and opaque current-session proof to the configured API gateway. The gateway validates that context, owns live streams and delegates retained actor, brief, Related and topology operations to private Brain. Durable brief work and SurrealDB remain independently running Linux resources. Topology ForceCanvas and its accessible list belong to Intel Web. The native client may close without stopping accepted work or the independently managed deployment.</desc>
<defs><marker id="intel-web-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4f5d75"/></marker></defs>
<style>text{font-family:Geist,system-ui,sans-serif;fill:#2d3142}.figure-title{font-family:'Instrument Serif',Georgia,serif;font-size:30px}.label{font-size:20px;font-weight:600}.note{font-size:16px}.mono{font-family:'Geist Mono',ui-monospace,monospace;font-size:14px}.zone{font-size:13px;font-weight:600;letter-spacing:1px}.minor{font-size:14px;fill:#4f5d75}.node{fill:#fff;stroke:#4f5d75}.accent{fill:#fff6ed;stroke:#eb6c36}.edge{fill:none;stroke:#4f5d75;stroke-width:2;marker-end:url(#intel-web-arrow)}</style>
<rect width="1280" height="616" fill="#f5f5f5"/>
<text x="48" y="44" class="figure-title">Browser traffic stays on the guarded web origin</text>
<text x="48" y="76" class="zone">PUBLIC ORIGIN AND SERVER-ONLY PRIVATE UPSTREAM ARE SEPARATE</text>
<path d="M272 172H336" class="edge"/>
<path d="M624 172H688" class="edge"/>
<path d="M912 172H976" class="edge"/>
<path d="M800 240V368" class="edge"/>
<path d="M1104 240V368" class="edge"/>
<path d="M912 428H976" class="edge"/>
<g id="intel-web-browser">
<rect x="48" y="104" width="224" height="136" rx="6" class="node"/>
<text x="64" y="136" class="label">Intel browser</text>
<text x="64" y="168" class="note">Advertised web origin</text>
<text x="64" y="196" class="note">ForceCanvas + list</text>
<text x="64" y="224" class="minor">No backend bearer in JS</text>
</g>
<g id="intel-web-relay">
<rect x="336" y="104" width="288" height="136" rx="6" class="node accent"/>
<text x="352" y="136" class="label">Next.js Connect gate + relay</text>
<text x="352" y="168" class="note">Existing-ID session / HttpOnly</text>
<text x="352" y="196" class="note">RSC / REST / export / live guarded</text>
<text x="352" y="224" class="minor">Central server authority check</text>
</g>
<g id="intel-web-gateway">
<rect x="688" y="104" width="224" height="136" rx="6" class="node accent"/>
<text x="704" y="136" class="label">API gateway</text>
<text x="704" y="168" class="note">Scoped WebRelay proof</text>
<text x="704" y="196" class="note">Private delegation</text>
<text x="704" y="224" class="minor">Owns live streams</text>
</g>
<g id="intel-web-brain">
<rect x="976" y="104" width="256" height="136" rx="6" class="node"/>
<text x="992" y="136" class="label">Private Brain</text>
<text x="992" y="168" class="note">Retained actor / brief / Related</text>
<text x="992" y="196" class="note">Topology data operations</text>
<text x="992" y="224" class="minor">Rendering stays in Intel Web</text>
</g>
<text x="816" y="304" class="minor">Durably admitted work</text>
<g id="intel-web-worker">
<rect x="688" y="368" width="224" height="120" rx="6" class="node"/>
<text x="704" y="400" class="label">Brief worker</text>
<text x="704" y="432" class="note">Executes accepted stages</text>
<text x="704" y="464" class="minor">Independent of client lifetime</text>
</g>
<g id="intel-web-storage">
<rect x="976" y="368" width="256" height="120" rx="6" class="node"/>
<text x="992" y="400" class="label">SurrealDB</text>
<text x="992" y="432" class="note">Shared backend domain data</text>
<text x="992" y="464" class="minor">Private Linux datastore</text>
</g>
<text x="48" y="292" class="note">Missing, revoked or unavailable context denies protected data.</text>
<text x="48" y="328" class="note">Loopback or configured authenticated remote HTTPS ingress.</text>
<text x="48" y="368" class="note">No native-to-Docker, index or database connection.</text>
<text x="48" y="404" class="note">Deployment runs independently; native need not remain open.</text>
<text x="48" y="544" class="minor">Retained-operation view only; actor search has its own index/source path. See the detailed Intel Connect gate for revisions and logout.</text>
<text x="48" y="580" class="minor">Source ownership diagram, not a passing real browser, native GUI or installed deployment verification claim.</text>
</svg>
