name: Atlas BERT worker checks

on:
  pull_request:
    paths:
      - 'tools/atlas-bert/**'
      - '.github/workflows/atlas-bert.yml'
  workflow_dispatch:
    inputs:
      intel_runtime:
        description: Build and test the Intel worker with the pinned MNLI checkpoint
        type: boolean
        default: false
  workflow_call:
    inputs:
      head:
        description: Exact commit to verify
        type: string
      intel_only:
        type: boolean
        default: false
      intel_runtime:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: atlas-bert-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  ATLAS_BERT_HEAD: ${{ inputs.head || github.event.pull_request.head.sha || github.sha }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    if: ${{ !inputs.intel_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.ATLAS_BERT_HEAD }}
          lfs: false
          persist-credentials: false
      - name: Verify the checked-out commit
        run: test "$(git rev-parse HEAD)" = "$ATLAS_BERT_HEAD"
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Check worker formatting
        run: cargo fmt --manifest-path tools/atlas-bert/Cargo.toml --check
      - name: Check worker types
        # doc-only checks the Rust API without linking LibTorch or loading a model.
        run: cargo check --locked --manifest-path tools/atlas-bert/Cargo.toml --all-targets --features rust-bert/doc-only
  macos-intel:
    # Fleetworks calls the full runtime on PRs. The direct PR run checks Linux types only.
    if: ${{ github.event_name != 'pull_request' || inputs.intel_only || inputs.intel_runtime }}
    runs-on: macos-15-intel
    timeout-minutes: 35
    env:
      CARGO_BUILD_TARGET: x86_64-apple-darwin
      CARGO_PROFILE_DEV_DEBUG: 0
      LIBTORCH_USE_PYTORCH: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.ATLAS_BERT_HEAD }}
          lfs: false
          persist-credentials: false
      - name: Verify the checked-out commit
        run: test "$(git rev-parse HEAD)" = "$ATLAS_BERT_HEAD"
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-apple-darwin
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install Intel macOS PyTorch wheel
        run: >-
          python -m pip install --only-binary=:all: 'torch==2.1.0' 'numpy==1.26.4'
      - name: Check native worker types on Intel macOS
        if: ${{ !inputs.intel_runtime }}
        run: cargo check --locked --manifest-path tools/atlas-bert/Cargo.toml --all-targets --target x86_64-apple-darwin
      - name: Build, link, and test the Intel worker
        if: ${{ inputs.intel_runtime }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          cargo build --locked --manifest-path tools/atlas-bert/Cargo.toml --target x86_64-apple-darwin
          file tools/atlas-bert/target/x86_64-apple-darwin/debug/argos-atlas-bert |
            grep -F 'Mach-O 64-bit executable x86_64'
          export DYLD_LIBRARY_PATH="$(python -c 'import pathlib, torch; print(pathlib.Path(torch.__file__).parent / "lib")')"
          cargo test --locked --manifest-path tools/atlas-bert/Cargo.toml --target x86_64-apple-darwin
      - name: Prepare the pinned Typeform DistilBERT MNLI checkpoint
        if: ${{ inputs.intel_runtime }}
        run: bash tools/atlas-bert/scripts/prepare-model.sh "$RUNNER_TEMP/atlas-bert-model"
      - name: Run real checkpoint inference on Intel macOS
        if: ${{ inputs.intel_runtime }}
        run: |
          set -euo pipefail
          export DYLD_LIBRARY_PATH="$(python -c 'import pathlib, torch; print(pathlib.Path(torch.__file__).parent / "lib")')"
          python - <<'PY'
          import json
          import math
          import os
          from pathlib import Path
          import subprocess

          worker = Path("tools/atlas-bert/target/x86_64-apple-darwin/debug/argos-atlas-bert").resolve()
          model = Path(os.environ["RUNNER_TEMP"]) / "atlas-bert-model"
          election = "Parliament voted to amend election law and the electoral commission updated the ballot rules."
          research = "Researchers published an experiment improving error correction on a silicon quantum processor."
          batches = [[election, research], [research], [election], [election, research]]
          output = subprocess.run(
              [worker, "serve", model],
              input="".join(json.dumps({"texts": batch}) + "\n" for batch in batches),
              stdout=subprocess.PIPE,
              text=True,
              timeout=180,
              check=True,
          ).stdout
          ready, *responses = (json.loads(line) for line in output.splitlines())
          assert ready == {"protocol": "argos-atlas-bert-v1"}, ready
          assert len(responses) == len(batches), responses
          for batch, response in zip(batches, responses):
              assert len(response["scores"]) == len(batch), response
              for row in response["scores"]:
                  assert len(row) == 6 and all(math.isfinite(score) and 0 <= score <= 1 for score in row), row
          first, research_only, election_only, repeated = (response["scores"] for response in responses)
          for batch_row, single_row, repeated_row in zip(first, [election_only[0], research_only[0]], repeated):
              for batch_score, single_score, repeated_score in zip(batch_row, single_row, repeated_row):
                  assert math.isclose(batch_score, single_score, abs_tol=1e-5), (batch_row, single_row)
                  assert math.isclose(batch_score, repeated_score, abs_tol=1e-5), (batch_row, repeated_row)
          assert first[0][0] > first[1][0] and first[1][5] > first[0][5], first
          print("Intel Atlas worker passed the handshake, six-domain score order, and batch/repeat checks.")
          PY
