[workspace]
resolver = "2"
members = [
    "crates/argos-osint-core",
    "crates/argos-osint-bin",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"
authors = ["the Argos OSINT authors"]
rust-version = "1.86"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "5"
futures-util = "0.3"
imap = { version = "2.4", default-features = false, features = ["tls"] }
native-tls = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_28", "all-widgets", "layout-cache", "macros", "underline-color"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
rpassword = "7"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "fs", "sync"] }
toml = "0.8"
url = "2"
unicode-width = "0.2"
urlencoding = "2"
petgraph = "0.7"
